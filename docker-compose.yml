version: '3.8'

services:
  # Keycloak IAM Server
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: ronl-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_LOG_LEVEL: INFO
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: / 
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./config/keycloak/ronl-realm.json:/opt/keycloak/data/import/ronl-realm.json:ro
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-themes:/opt/keycloak/themes
      - ./config/keycloak/ronl-realm.json:/opt/keycloak/data/import/ronl-realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8080' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ronl-network

  # PostgreSQL Database (for Keycloak and audit logs)
  postgres:
    image: postgres:16-alpine
    container_name: ronl-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ronl-network

  # Operaton BPMN Engine (local, for E2E process/task testing — see
  # docs/TESTING-FRONTEND-UI.md item 4; keeps test runs off the real
  # operaton.open-regels.nl engine). H2 file-based DB, no external DB
  # dependency. Host port 8081 matches OPERATON_BASE_URL in
  # packages/backend/.env.example.
  #
  # One-time setup on a FRESH operaton-data volume: the image runs as a
  # non-root user (uid 1000), but Docker creates a brand-new named volume
  # owned by root, so the engine crashes on startup with
  # java.nio.file.AccessDeniedException on its .mv.db file. Fix once, before
  # first `docker compose up operaton`:
  #   docker run --rm -v ronl-business-api_operaton-data:/data alpine chown -R 1000:1000 /data
  # (On Windows/Git Bash, prefix with MSYS_NO_PATHCONV=1 or the /data path
  # gets mangled into a Windows path.) Not needed again unless the volume is
  # deleted and recreated.
  operaton:
    image: operaton/operaton:latest
    container_name: ronl-operaton
    environment:
      TZ: Europe/Amsterdam
      DB_DRIVER: org.h2.Driver
      DB_URL: jdbc:h2:file:/operaton/h2-data/operaton-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      JAVA_OPTS: -XX:MaxRAMPercentage=70.0
      DEBUG: 'false'
    volumes:
      - operaton-data:/operaton/h2-data
    ports:
      - '8081:8080'
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8080' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ronl-network

  # Redis Cache (for session storage and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: ronl-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ronl-network

volumes:
  keycloak-data:
    driver: local
  postgres-data:
    driver: local
  operaton-data:
    driver: local
  redis-data:
    driver: local

networks:
  ronl-network:
    driver: bridge
