services:
  # Keycloak IAM Server
  keycloak:
    image: quay.io/keycloak/keycloak:23.0@sha256:14e99d6f5dd0516a5bdc82537b732cb85469ecdb15ad7fe5f11ff67521544db8
    container_name: ronl-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_LOG_LEVEL: INFO
      KC_PROXY: edge
      KC_HTTP_RELATIVE_PATH: / 
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./config/keycloak/ronl-realm.json:/opt/keycloak/data/import/ronl-realm.json:ro
      - keycloak-data:/opt/keycloak/data
      - ./keycloak-themes:/opt/keycloak/themes
      - ./config/keycloak/ronl-realm.json:/opt/keycloak/data/import/ronl-realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8080' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ronl-network

  # PostgreSQL Database (for Keycloak and audit logs)
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: ronl-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ronl-network

  # One-time init for the operaton-data volume. The operaton image runs as a
  # non-root user (uid 1000), but Docker creates a brand-new named volume owned
  # by root, so the engine would crash on a FRESH volume with
  # java.nio.file.AccessDeniedException on its .mv.db file. This throwaway
  # container chowns the volume to uid 1000 and exits; operaton waits for it to
  # complete (see depends_on below). Idempotent — a no-op on an already-owned
  # volume, so it is safe to leave enabled on every `docker compose up`.
  operaton-init:
    image: alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    container_name: ronl-operaton-init
    command: chown -R 1000:1000 /data
    volumes:
      - operaton-data:/data
    networks:
      - ronl-network

  # Operaton BPMN Engine (local, for E2E process/task testing — see
  # E2E environment, item 4 of the testing docs; keeps test runs off the real
  # operaton.open-regels.nl engine). H2 file-based DB, no external DB
  # dependency. Host port 8081 matches OPERATON_BASE_URL in
  # packages/backend/.env.example. Volume permissions are fixed by the
  # operaton-init service above before this container starts.
  operaton:
    image: operaton/operaton:2.1.5@sha256:ed5d68637e2024dee93c3de19472d3ba4e835073c7c8d66f2bd3f36c15616892
    container_name: ronl-operaton
    environment:
      TZ: Europe/Amsterdam
      DB_DRIVER: org.h2.Driver
      DB_URL: jdbc:h2:file:/operaton/h2-data/operaton-local;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      # #415: the same login and permission checks as the VM engine
      # (deployment/vm/operaton/prod/docker-compose.yml). The invoice example is
      # off: on an EMPTY database it fails to start with authorization on.
      # Accounts come from the operaton-accounts one-shot below.
      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=70.0
        -Doperaton.bpm.run.auth.enabled=true
        -Doperaton.bpm.authorization.enabled=true
        -Doperaton.bpm.run.cors.enabled=false
        -Doperaton.bpm.run.example.enabled=false
      DEBUG: 'false'
    volumes:
      - operaton-data:/operaton/h2-data
    ports:
      - '8081:8080'
    depends_on:
      operaton-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8080' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ronl-network

  # One-shot (#415): creates the local accounts with the same script the VM
  # uses. Idempotent, so it runs on every `docker compose up`. Local-only,
  # non-secret passwords: rbaBackend/rbaBackend, ldeBackend/ldeBackend,
  # publicReader/publicReader; demo/demo stays the admin.
  operaton-accounts:
    image: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: ronl-operaton-accounts
    entrypoint: ['sh', '/provision-accounts.sh']
    volumes:
      - ./deployment/vm/operaton/provision-accounts.sh:/provision-accounts.sh:ro
    environment:
      OPERATON_URL: http://operaton:8080/engine-rest
      OPERATON_ADMIN_USER: demo
      OPERATON_ADMIN_PASSWORD: demo
      SERVICE_ACCOUNTS: rbaBackend ldeBackend
      PW_RBABACKEND: rbaBackend
      PW_LDEBACKEND: ldeBackend
      EXISTING_ADMIN_MEMBERS: ''
      PUBLIC_READER_PASSWORD: publicReader
    depends_on:
      operaton:
        condition: service_healthy
    networks:
      - ronl-network

  # Redis Cache (for session storage and rate limiting)
  # Held at 7.2 (7.2.16): the last BSD-3-Clause line. Redis 7.4 and later is
  # RSALv2/SSPLv1. ACC and PROD run Azure Cache for Redis 6.0, also BSD-3.
  redis:
    image: redis:7.2-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
    container_name: ronl-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ronl-network

volumes:
  keycloak-data:
    driver: local
  postgres-data:
    driver: local
  operaton-data:
    driver: local
  redis-data:
    driver: local

networks:
  ronl-network:
    driver: bridge
