name: Deploy Public Site to Azure ACC

on:
  push:
    branches:
      - acc
    paths:
      - 'packages/public-site/**'
      - '.github/workflows/azure-publicsite-acc.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - acc
    # Mirrors the push filter above. Without it every pull request to acc
    # deployed all three sites, each holding a Static Web Apps staging
    # environment — three apps against a three-environment ceiling, which
    # five open pull requests exhausted on 2026-08-28.
    #
    # Note this also gates close_pull_request_job, which fires on 'closed'.
    # A pull request touching none of these paths never created a preview,
    # so there is nothing for it to tear down.
    paths:
      - 'packages/public-site/**'
      - '.github/workflows/azure-publicsite-acc.yml'
  workflow_dispatch:

# Serialise deployments to one Azure Static Web Apps environment. Two
# deployments at the same environment make Azure cancel one and report
# "Deployment Canceled" on a job that did nothing wrong — seen on
# 2026-08-29, two acc deploys 20 seconds apart. The group includes the ref,
# so pull requests never cancel each other's previews, only their own
# superseded runs.
#
# The key must distinguish the EVENT, not just the ref. Keyed on github.ref
# alone, the pull_request(closed) teardown and the push deploy that a merge
# fires simultaneously landed in the same group and cancelled each other —
# one of each pair died, at random. Seen on 2026-08-29 merging #25: two acc
# deploys skipped and one preview left un-torn-down.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy ACC Public Site
    environment:
      name: acc
      url: https://acc.publiek.open-regels.nl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc, so there is ONE place this repository states its
          # Node version. Before #36 there were four answers and they disagreed:
          # these workflows said '20', .nvmrc said 22, engines.node said
          # >=20.13.0, and both App Service plans run NODE|22-lts. So the
          # deployed artifact was BUILT on a major the host does not run.
          #
          # .nvmrc is pinned to an exact 22.22.0 rather than a bare 22,
          # deliberately: 'nothing a pipeline downloads may float' is the same
          # policy the action digests above follow, and a bare major resolves to
          # whatever 22.x the runner happens to carry. Renovate's node manager
          # parses .nvmrc, so this is maintained rather than hand-bumped --
          # unlike linked-data-explorer, which pins exact literals in each
          # workflow and drifted apart exactly that way (its #80: engines moved
          # to >=24.20.0 while all four workflows stayed at 24.19.0).
          #
          # zizmor.yml is deliberately NOT switched to this file. Its
          # renovate-config-validator step needs Node 24, because renovate@44.50.3
          # declares engines.node ^24.11.0 and npm accepts a mismatch with an
          # EBADENGINE warning rather than refusing. That pin is load-bearing.
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: packages/public-site
        run: npm run lint

      - name: Type-check
        working-directory: packages/public-site
        run: npm run type-check

      - name: Unit tests
        working-directory: packages/public-site
        run: npm test

      - name: Build for ACC (includes prerender + bundle-cleanliness gate)
        working-directory: packages/public-site
        # Build provenance: the footer answers "which build am I looking at?",
        # which the hand-bumped version cannot. These belong on the BUILD step
        # rather than the deploy step because the runner builds this package —
        # the deploy action gets skip_app_build: true and only uploads dist/.
        # Nothing is derived from git; a build id that fails to resolve lies.
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_number }}
        run: |
          npm run build:acc
          test -f dist/index.html || (echo "ERROR: index.html not found!" && exit 1)
          test -f dist/sitemap.xml || (echo "ERROR: sitemap.xml not found!" && exit 1)
          test -f dist/robots.txt || (echo "ERROR: robots.txt not found!" && exit 1)
          echo "✅ Build completed successfully"

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PUBLIC_SITE_ACC }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/packages/public-site/dist'
          skip_app_build: true

  close_pull_request_job:
    permissions: {}
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PUBLIC_SITE_ACC }}
          action: 'close'
