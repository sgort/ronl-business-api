name: Deploy Frontend to Azure ACC

on:
  push:
    branches:
      - acc
    paths:
      - 'packages/frontend/**'
      - 'packages/shared/**'
      - 'packages/pa-cockpit/**'
      - '.github/workflows/azure-frontend-acc.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - acc
    # Mirrors the push filter above. Without it every pull request to acc
    # deployed all three sites, each holding a Static Web Apps staging
    # environment — three apps against a three-environment ceiling, which
    # five open pull requests exhausted on 2026-08-28.
    #
    # Note this also gates close_pull_request_job, which fires on 'closed'.
    # A pull request touching none of these paths never created a preview,
    # so there is nothing for it to tear down.
    paths:
      - 'packages/frontend/**'
      - 'packages/shared/**'
      - 'packages/pa-cockpit/**'
      - '.github/workflows/azure-frontend-acc.yml'
  workflow_dispatch:

# Serialise deployments to one Azure Static Web Apps environment. Two
# deployments at the same environment make Azure cancel one and report
# "Deployment Canceled" on a job that did nothing wrong — seen on
# 2026-08-29, two acc deploys 20 seconds apart. The group includes the ref,
# so pull requests never cancel each other's previews, only their own
# superseded runs.
#
# The key must distinguish the EVENT, not just the ref. Keyed on github.ref
# alone, the pull_request(closed) teardown and the push deploy that a merge
# fires simultaneously landed in the same group and cancelled each other —
# one of each pair died, at random. Seen on 2026-08-29 merging #25: two acc
# deploys skipped and one preview left un-torn-down.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy ACC Frontend
    environment:
      name: acc
      url: https://acc.mijn.open-regels.nl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc, so there is ONE place this repository states its
          # Node version. Before #36 there were four answers and they disagreed:
          # these workflows said '20', .nvmrc said 22, engines.node said
          # >=20.13.0, and both App Service plans run NODE|22-lts. So the
          # deployed artifact was BUILT on a major the host does not run.
          #
          # .nvmrc is pinned to an exact 22.22.0 rather than a bare 22,
          # deliberately: 'nothing a pipeline downloads may float' is the same
          # policy the action digests above follow, and a bare major resolves to
          # whatever 22.x the runner happens to carry. Renovate's node manager
          # parses .nvmrc, so this is maintained rather than hand-bumped --
          # unlike linked-data-explorer, which pins exact literals in each
          # workflow and drifted apart exactly that way (its #80: engines moved
          # to >=24.20.0 while all four workflows stayed at 24.19.0).
          #
          # zizmor.yml is deliberately NOT switched to this file. Its
          # renovate-config-validator step needs Node 24, because renovate@44.50.3
          # declares engines.node ^24.11.0 and npm accepts a mismatch with an
          # EBADENGINE warning rather than refusing. That pin is load-bearing.
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@ronl/shared

      - name: Run linter
        working-directory: packages/frontend
        run: npm run lint

      # @ronl/pa-cockpit has no deploy workflow of its own — it is a library
      # this frontend consumes — so until now its 476 tests ran nowhere in CI.
      # This workflow's paths filter already includes packages/pa-cockpit/**,
      # so a change there triggers this run; it just did not test it. Placed
      # before the frontend's own suite because the frontend imports it: a
      # break here explains a break there.
      #
      # It also makes the per-file 80% branch floor mean the same thing in
      # every workspace. A threshold that only fires on someone's laptop is a
      # convention wearing a gate's clothes. See issue #80.
      - name: Unit tests (pa-cockpit)
        working-directory: packages/pa-cockpit
        run: npm test

      - name: Unit tests
        working-directory: packages/frontend
        run: npm test

      - name: Performance budget
        working-directory: packages/frontend
        run: npm run test:perf

      - name: Build frontend for ACC
        working-directory: packages/frontend
        # Stamps the bundle with which BUILD it is, not just which release —
        # the changelog version comes from package.json and is bumped by hand,
        # so ACC and PROD can serve different builds of the same version. Vite
        # merges VITE_-prefixed process.env over .env.acceptance, so these
        # reach import.meta.env without touching the mode file. Absent (local
        # builds, forks), src/utils/buildInfo.ts renders 'local build'.
          #
        # On a pull request github.sha is the merge commit GitHub synthesises,
        # so a preview's SHA matches no commit in the branch. That is the
        # commit that was built, and is expected — not a bug to chase.
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_number }}
        run: |
          npm run build:acc

          echo "Build output:"
          ls -la dist/
          test -f dist/index.html || (echo "ERROR: index.html not found!" && exit 1)
          echo "✅ Build completed successfully"

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ACC }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/packages/frontend/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Wait for deployment
        run: sleep 15

      - name: Verify deployment
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://acc.mijn.open-regels.nl)
          if [ "$response" = "200" ]; then
            echo "✅ Frontend is accessible!"
          else
            echo "⚠️  Frontend returned HTTP $response"
          fi

  close_pull_request_job:
    permissions: {}
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ACC }}
          action: 'close'