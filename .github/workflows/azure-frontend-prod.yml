name: Deploy Frontend to Production

on:
  push:
    branches:
      - main
    paths:
      - 'packages/frontend/**'
      - 'packages/shared/**'
      - 'packages/pa-cockpit/**'
      - '.github/workflows/azure-frontend-prod.yml'
  workflow_dispatch:

# Same serialisation as the acc workflow, but production runs QUEUE rather
# than cancel: interrupting a live production deployment to start another
# is worse than waiting for it. Production deploys are rare enough that
# the wait costs nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: Build and Deploy Production Frontend
    environment:
      name: production
      url: https://mijn.open-regels.nl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc, so there is ONE place this repository states its
          # Node version. Before #36 there were four answers and they disagreed:
          # these workflows said '20', .nvmrc said 22, engines.node said
          # >=20.13.0, and both App Service plans run NODE|22-lts. So the
          # deployed artifact was BUILT on a major the host does not run.
          #
          # .nvmrc is pinned to an exact 22.22.0 rather than a bare 22,
          # deliberately: 'nothing a pipeline downloads may float' is the same
          # policy the action digests above follow, and a bare major resolves to
          # whatever 22.x the runner happens to carry. Renovate's node manager
          # parses .nvmrc, so this is maintained rather than hand-bumped --
          # unlike linked-data-explorer, which pins exact literals in each
          # workflow and drifted apart exactly that way (its #80: engines moved
          # to >=24.20.0 while all four workflows stayed at 24.19.0).
          #
          # zizmor.yml is deliberately NOT switched to this file. Its
          # renovate-config-validator step needs Node 24, because renovate@44.50.3
          # declares engines.node ^24.11.0 and npm accepts a mismatch with an
          # EBADENGINE warning rather than refusing. That pin is load-bearing.
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@ronl/shared

      - name: Run linter
        working-directory: packages/frontend
        run: npm run lint

      # See azure-frontend-acc.yml for why pa-cockpit's suite runs here: it is
      # a library with no deploy workflow of its own, already inside this
      # workflow's paths filter, and its tests ran nowhere in CI before this.
      - name: Unit tests (pa-cockpit)
        working-directory: packages/pa-cockpit
        run: npm test

      - name: Unit tests
        working-directory: packages/frontend
        run: npm test

      - name: Performance budget
        working-directory: packages/frontend
        run: npm run test:perf

      - name: Build frontend for production
        working-directory: packages/frontend
        # See azure-frontend-acc.yml for why these are injected rather than
        # derived from git at build time. PROD deploys from a push, so
        # github.sha is a real commit here, never a synthesised merge commit.
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_number }}
        run: |
          npm run build:prod

          echo "Build output:"
          ls -la dist/
          test -f dist/index.html || (echo "ERROR: index.html not found!" && exit 1)
          echo "✅ Build completed successfully"

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/packages/frontend/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Wait for deployment
        run: sleep 15

      - name: Verify deployment
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://mijn.open-regels.nl)
          if [ "$response" = "200" ]; then
            echo "✅ Frontend is accessible!"
          else
            echo "⚠️  Frontend returned HTTP $response"
          fi