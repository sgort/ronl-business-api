name: Deploy Public Site to Azure Production

on:
  # Called by promote-to-production.yml and nothing else (#177).
  #
  # This site has the most to lose from the race this replaces: its build
  # PRERENDERS against the live API, so a prerender inside the window where the
  # backend had not deployed yet baked a failed call into the deployed output
  # rather than showing it once. The filter that used to live here now lives in
  # scripts/promotion-targets.sh, which answers for all four in one place; the
  # ordering lives in the promotion workflow. Keep the two in step —
  # azure-publicsite-acc.yml's paths filter is the reference copy.
  #
  # workflow_dispatch stays: it is the escape hatch for deploying this site
  # alone, and the only route left if the promotion workflow is broken.
  workflow_call:
    # Named rather than inherited. `secrets: inherit` would hand this workflow
    # every secret the repository has -- including the Keycloak VM's SSH key and
    # the Semgrep token -- to deploy one static site. Declaring the one it needs
    # means the caller passes that one, and a missing secret fails at the call
    # rather than at the deploy step.
    secrets:
      AZURE_STATIC_WEB_APPS_API_TOKEN_PUBLIC_SITE_PROD:
        description: Deployment token for the publiek.open-regels.nl Static Web App.
        required: true
  workflow_dispatch:

# Same serialisation as the acc workflow, but production runs QUEUE rather
# than cancel: interrupting a live production deployment to start another
# is worse than waiting for it. Production deploys are rare enough that
# the wait costs nothing.
#
# The group names this app rather than ${{ github.workflow }}. Inside a called
# workflow that expression resolves to the CALLER's name, so all three site
# workflows would share one group and serialise against each other for no
# reason — and a group equal to the promotion workflow's own would deadlock it
# against the jobs it is waiting for.
concurrency:
  group: deploy-publicsite-prod-${{ github.ref }}
  cancel-in-progress: false

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    name: Build and Deploy Production Public Site
    environment:
      name: production
      url: https://publiek.open-regels.nl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc, so there is ONE place this repository states its
          # Node version. Before #36 there were four answers and they disagreed:
          # these workflows said '20', .nvmrc said 22, engines.node said
          # >=20.13.0, and both App Service plans run NODE|22-lts. So the
          # deployed artifact was BUILT on a major the host does not run.
          #
          # .nvmrc is pinned to an exact 22.22.0 rather than a bare 22,
          # deliberately: 'nothing a pipeline downloads may float' is the same
          # policy the action digests above follow, and a bare major resolves to
          # whatever 22.x the runner happens to carry. Renovate's node manager
          # parses .nvmrc, so this is maintained rather than hand-bumped --
          # unlike linked-data-explorer, which pins exact literals in each
          # workflow and drifted apart exactly that way (its #80: engines moved
          # to >=24.20.0 while all four workflows stayed at 24.19.0).
          #
          # zizmor.yml is deliberately NOT switched to this file. Its
          # renovate-config-validator step needs Node 24, because renovate@44.50.3
          # declares engines.node ^24.11.0 and npm accepts a mismatch with an
          # EBADENGINE warning rather than refusing. That pin is load-bearing.
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: packages/public-site
        run: npm run lint

      - name: Type-check
        working-directory: packages/public-site
        run: npm run type-check

      - name: Unit tests
        working-directory: packages/public-site
        run: npm test

      - name: Build for production (includes prerender + bundle-cleanliness gate)
        working-directory: packages/public-site
        # Build provenance — see the fuller note in azure-publicsite-acc.yml.
        # On the BUILD step because the runner builds; the deploy action gets
        # skip_app_build: true and only uploads dist/.
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_number }}
        run: |
          npm run build:prod
          test -f dist/index.html || (echo "ERROR: index.html not found!" && exit 1)
          test -f dist/sitemap.xml || (echo "ERROR: sitemap.xml not found!" && exit 1)
          test -f dist/robots.txt || (echo "ERROR: robots.txt not found!" && exit 1)

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PUBLIC_SITE_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/packages/public-site/dist'
          skip_app_build: true
