name: Deploy PA Demo to Azure ACC

on:
  push:
    branches:
      - acc
    # packages/shared/** is included even though pa-demo's @ronl/shared
    # imports are type-only (erased before Vite ever sees them). A
    # shared-only change can't alter the compiled output, but without this
    # filter a breaking type change in @ronl/shared would never run
    # pa-demo's type-check step here, and would instead surface later at an
    # unrelated pa-demo PR.
    paths:
      - 'packages/pa-demo/**'
      - 'packages/shared/**'
      - 'packages/pa-cockpit/**'
      - '.github/workflows/azure-pa-demo-acc.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - acc
    # Mirrors the push filter above. Without it every pull request to acc
    # deployed all three sites, each holding a Static Web Apps staging
    # environment — three apps against a three-environment ceiling, which
    # five open pull requests exhausted on 2026-08-28.
    #
    # Note this also gates close_pull_request_job, which fires on 'closed'.
    # A pull request touching none of these paths never created a preview,
    # so there is nothing for it to tear down.
    paths:
      - 'packages/pa-demo/**'
      - 'packages/shared/**'
      - 'packages/pa-cockpit/**'
      - '.github/workflows/azure-pa-demo-acc.yml'
  workflow_dispatch:

# Serialise deployments to one Azure Static Web Apps environment. Two
# deployments at the same environment make Azure cancel one and report
# "Deployment Canceled" on a job that did nothing wrong — seen on
# 2026-08-29, two acc deploys 20 seconds apart. The group includes the ref,
# so pull requests never cancel each other's previews, only their own
# superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy ACC PA Demo
    environment:
      name: acc
      url: https://acc.plato.open-regels.nl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@ronl/shared

      - name: Lint
        working-directory: packages/pa-demo
        run: npm run lint

      - name: Type-check
        working-directory: packages/pa-demo
        run: npm run type-check

      - name: Unit tests
        working-directory: packages/pa-demo
        run: npm test

      - name: Install Playwright browser
        working-directory: packages/pa-demo
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: packages/pa-demo
        # No backend, database or Keycloak needed: pa-demo issues no network
        # requests, and Playwright starts its own dev server (see
        # e2e/playwright.config.ts) — that's the whole environment.
        run: npm run test:e2e

      - name: Build for ACC (includes the bundle gate)
        working-directory: packages/pa-demo
        run: |
          npm run build:acc
          test -f dist/index.html || (echo "ERROR: index.html not found!" && exit 1)
          test -f dist/staticwebapp.config.json || (echo "ERROR: SWA config not copied!" && exit 1)
          echo "✅ Build completed successfully"

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PA_DEMO_ACC }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/packages/pa-demo/dist'
          skip_app_build: true

  close_pull_request_job:
    permissions: {}
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PA_DEMO_ACC }}
          action: 'close'
