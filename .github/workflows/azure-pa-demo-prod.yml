name: Deploy PA Demo to Azure Production

on:
  push:
    branches:
      - main
    # packages/shared/** is included even though pa-demo's @ronl/shared
    # imports are type-only (erased before Vite ever sees them). A
    # shared-only change can't alter the compiled output, but without this
    # filter a breaking type change in @ronl/shared would never run
    # pa-demo's type-check step here, and would instead surface later at an
    # unrelated pa-demo PR.
    paths:
      - 'packages/pa-demo/**'
      - 'packages/shared/**'
      - 'packages/pa-cockpit/**'
      - '.github/workflows/azure-pa-demo-prod.yml'
  workflow_dispatch:

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: Build and Deploy Production PA Demo
    environment:
      name: production
      url: https://plato.open-regels.nl

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          lfs: false
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@ronl/shared

      - name: Lint
        working-directory: packages/pa-demo
        run: npm run lint

      - name: Type-check
        working-directory: packages/pa-demo
        run: npm run type-check

      - name: Unit tests
        working-directory: packages/pa-demo
        run: npm test

      - name: Build for production (includes the bundle gate)
        working-directory: packages/pa-demo
        run: |
          npm run build:prod
          test -f dist/index.html || (echo "ERROR: index.html not found!" && exit 1)
          test -f dist/staticwebapp.config.json || (echo "ERROR: SWA config not copied!" && exit 1)
          echo "✅ Build completed successfully"

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PA_DEMO_PROD }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: '/packages/pa-demo/dist'
          skip_app_build: true
