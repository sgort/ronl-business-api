name: Build Backend for Production

on:
  # No `pull_request` trigger, deliberately. This is the decision #87 asks for,
  # recorded here rather than left to drift.
  #
  # `main` is promoted from `acc`, so every commit arriving here has already run
  # this same suite on its own acc pull request (since #87 closed that gap).
  # Re-running 2008 tests on the promotion pull request costs minutes and says
  # nothing new about the code -- while `audit`, which IS required on `main`,
  # reports there on every pull request regardless of base.
  #
  # Note that linked-data-explorer excludes its production workflow for a
  # DIFFERENT reason that does not apply here: there, the production
  # environment carries required reviewers, so a pull_request trigger would put
  # a human approval in front of the very tests meant to inform it. Both
  # environments in this repository have no protection rules at all. The
  # exclusion stands on the promotion argument alone, and would want revisiting
  # if protection rules were ever added.
  push:
    branches:
      - main
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - '.github/workflows/azure-backend-prod.yml'
      # Mirrors the acc workflow: the root lockfile and manifest feed every
      # workspace, so a lockfile-only promotion must still build and test the
      # backend rather than reaching production untested.
      - 'package-lock.json'
      - 'package.json'
      # .nvmrc sets the Node version this workflow builds, tests and ships on.
      # Without it here, a Node bump built and deployed nothing (sgort/linked-data-explorer#119).
      - '.nvmrc'
  workflow_dispatch:

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      # Mints the OIDC token azure/login exchanges for an ARM token.
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://api.open-regels.nl

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc, so there is ONE place this repository states its
          # Node version. Before #36 there were four answers and they disagreed:
          # these workflows said '20', .nvmrc said 22, engines.node said
          # >=20.13.0, and both App Service plans run NODE|22-lts. So the
          # deployed artifact was BUILT on a major the host does not run.
          #
          # .nvmrc is pinned to an exact 22.22.0 rather than a bare 22,
          # deliberately: 'nothing a pipeline downloads may float' is the same
          # policy the action digests above follow, and a bare major resolves to
          # whatever 22.x the runner happens to carry. Renovate's node manager
          # parses .nvmrc, so this is maintained rather than hand-bumped --
          # unlike linked-data-explorer, which pins exact literals in each
          # workflow and drifted apart exactly that way (its #80: engines moved
          # to >=24.20.0 while all four workflows stayed at 24.19.0).
          #
          # zizmor.yml is deliberately NOT switched to this file. Its
          # renovate-config-validator step needs Node 24, because renovate@44.50.3
          # declares engines.node ^24.11.0 and npm accepts a mismatch with an
          # EBADENGINE warning rather than refusing. That pin is load-bearing.
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@ronl/shared

      - name: Run linter
        working-directory: packages/backend
        run: npm run lint

      - name: Unit tests
        working-directory: packages/backend
        run: npm test

      - name: Build TypeScript
        working-directory: packages/backend
        run: npm run build

      - name: Verify build output
        working-directory: packages/backend
        run: |
          test -f dist/index.js || (echo "❌ dist/index.js not found" && exit 1)
          echo "✅ dist/index.js found"

      - name: Prepare deployment package
        working-directory: packages/backend
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_number }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p deploy

          cp -r dist deploy/
          cp package.json deploy/

          # Record which build this artifact is, for /v1/health's `build` block
          # (#129). package.json's version names the release, not the build, so
          # every deploy between two releases reports the same string. It is a
          # file in the artifact rather than an App Service setting, because
          # settings persist across deploys and can describe a build that is no
          # longer running -- which is the failure this exists to detect.
          jq -n --arg sha "$BUILD_SHA" --arg run "$BUILD_RUN" --arg runId "$BUILD_RUN_ID" \
            '{sha: $sha, run: $run, runId: $runId}' > deploy/build-info.json
          cat deploy/build-info.json

          # Install production dependencies FROM THE LOCKFILE (#34). This used to
          # be `npm install --production` in deploy/, which had a package.json and
          # no lockfile, so it re-resolved every caret range at deploy time: the
          # artifact could ship versions no test ran against and no lockfile
          # records, with no cooldown. On 2026-08-29 an acceptance deploy ran with
          # @anthropic-ai/sdk freshly jumped 42 minor versions and uuid five
          # majors, none of it matching what any build had verified.
          #
          # The only lockfile is the workspace root's, and `npm ci` in deploy/
          # cannot use it: it describes every workspace. So the install runs in a
          # staging copy holding the root manifest and lockfile and the two
          # manifests the backend needs, filtered to the backend workspace with
          # production dependencies only. `npm ci` refuses a lockfile that does
          # not satisfy the manifests, rather than resolving around it.
          #
          # packages/shared is present because the lockfile records @ronl/shared
          # as a workspace link and npm must be able to resolve it. The other
          # workspaces are left out: with them present npm also installs their
          # packages, which never reach this artifact.
          #
          # The root `prepare` is `husky`, a devDependency, so under --omit=dev it
          # would fail with "husky: not found". It is dropped from the staged copy
          # rather than from the repository, where it is load-bearing.
          stage="$RUNNER_TEMP/backend-prod"
          rm -rf "$stage"
          mkdir -p "$stage/packages/backend" "$stage/packages/shared" "$stage/scripts"
          cp ../../package.json ../../package-lock.json "$stage/"
          cp ../../scripts/write-deps-marker.sh "$stage/scripts/"
          cp package.json "$stage/packages/backend/"
          cp ../shared/package.json "$stage/packages/shared/"
          (cd "$stage" && npm pkg delete scripts.prepare)
          (cd "$stage" && npm ci --omit=dev --workspace=@ronl/backend --no-audit --no-fund)

          # A production dependency the backend needs at a version other than the
          # hoisted one would be installed under packages/backend/node_modules and
          # would not reach the artifact from here. None does today; fail rather
          # than ship without it on the day one does. Only real package entries
          # count, not the directory itself: npm can leave it behind empty.
          nested="$stage/packages/backend/node_modules"
          if [ -d "$nested" ]; then
            echo "packages/backend/node_modules holds: $(ls -A "$nested" | xargs)"
            if find "$nested" -mindepth 1 -maxdepth 1 ! -name ".*" | grep -q .; then
              echo "❌ Backend production dependencies installed un-hoisted; the packaging below would drop them:"
              find "$nested" -mindepth 1 -maxdepth 1 ! -name ".*"
              exit 1
            fi
          fi

          # The workspace link points back into the staging copy, so it is removed
          # before the tree is copied and replaced with real content afterwards.
          rm -rf "$stage/node_modules/@ronl"
          cp -r "$stage/node_modules" deploy/

          # @ronl/shared is a workspace package npm cannot fetch from the registry.
          # It goes in AFTER the install, deliberately: copied in before, npm sees
          # a package not declared in the manifest it is installing, prunes it as
          # extraneous, and the app dies at runtime with "Cannot find module
          # '@ronl/shared'". deploy-backend-to-prod.sh learned this the hard way and
          # says so; the version of this step that this replaces had the two the
          # wrong way round, latent only because nothing ever deployed its artifact.
          mkdir -p deploy/node_modules/@ronl/shared
          cp -r ../shared/dist deploy/node_modules/@ronl/shared/
          cp ../shared/package.json deploy/node_modules/@ronl/shared/
          node -e "require.resolve('@ronl/shared', { paths: ['./deploy'] })" \
            && echo "✅ @ronl/shared resolves from the artifact"

          echo "Production dependencies: $(ls deploy/node_modules | wc -l) top-level entries"

          # Tell Azure not to rebuild — this artifact is already built.
          echo "[config]" > deploy/.deployment
          echo "SCM_DO_BUILD_DURING_DEPLOYMENT = false" >> deploy/.deployment

      - name: Create deployment zip
        working-directory: packages/backend
        run: |
          cd deploy
          zip -qr ../deployment-prod.zip .
          echo "✅ $(du -sh ../deployment-prod.zip | cut -f1) — deployment-prod.zip"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-prod
          path: packages/backend/deployment-prod.zip
          retention-days: 5

      # ── Deploy ────────────────────────────────────────────────────────────────
      #
      # No event gate here: this workflow has no pull_request trigger, by the same
      # reasoning linked-data-explorer records on its production workflow. main is
      # promoted from acc, so the content has already run this suite on its acc
      # pull request, and the `production` environment's protection rules would
      # otherwise make every promotion wait on a human approval BEFORE the tests
      # could run -- an approval gate in front of the check meant to inform it.
      #
      # Authentication is OIDC rather than a publish profile. SCM basic auth is
      # DISABLED on this App Service (basicPublishingCredentialsPolicies/scm
      # allow=false, measured 2026-09-20), so a publish-profile deploy would be
      # rejected. `az webapp deploy` over an ARM token is what
      # deploy-backend-to-prod.sh already does by hand.
      #
      # The identity is separate from acc's, scoped to this App Service alone, so
      # a mistake in the acceptance workflow cannot reach production.
      - name: Log in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name ronl-business-api-prod \
            --resource-group rg-ronl-prod \
            --src-path packages/backend/deployment-prod.zip \
            --type zip

      - name: Health check
        run: |
          for i in $(seq 1 5); do
            code=$(curl -s -o /dev/null -m 10 -w "%{http_code}" https://api.open-regels.nl/v1/health/live || true)
            if [ "$code" = "200" ]; then
              echo "✅ Backend is alive"
              exit 0
            fi
            echo "Attempt $i/5: HTTP ${code:-none}, retrying in 10s"
            sleep 10
          done
          echo "❌ Liveness check failed after 5 attempts"
          exit 1

      - name: Verify the deploy took effect
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # The previous build keeps answering while Azure starts the new one, so
          # a liveness check passes against either. build.sha (#129) tells them
          # apart directly: without it, a deploy that silently left the old
          # artifact serving would pass every check above.
          #
          # About three minutes, matching linked-data-explorer, where a 34s window
          # once gave up 14s before the new build started.
          running=""
          for attempt in $(seq 1 12); do
            body=$(curl -s -m 10 https://api.open-regels.nl/v1/health || true)
            running=$(printf '%s' "$body" | jq -r '.data.build.sha' 2>/dev/null || true)
            [ "$running" = "$EXPECTED_SHA" ] && break
            echo "Attempt $attempt/12: build.sha is ${running:-unreadable}, expected $EXPECTED_SHA"
            [ "$attempt" -lt 12 ] && sleep 15
          done

          if [ "$running" = "$EXPECTED_SHA" ]; then
            echo "✅ production is running $EXPECTED_SHA"
          else
            echo "❌ production is running ${running:-unreadable}, expected $EXPECTED_SHA: the deploy did not take effect"
            curl -s https://api.open-regels.nl/v1/health | jq '{version, build, environment}' || true
            exit 1
          fi
