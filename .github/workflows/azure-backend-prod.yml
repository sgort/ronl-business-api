name: Build Backend for Production

on:
  push:
    branches:
      - main
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - '.github/workflows/azure-backend-prod.yml'
  workflow_dispatch:

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.open-regels.nl

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@ronl/shared

      - name: Run linter
        working-directory: packages/backend
        run: npm run lint

      - name: Unit tests
        working-directory: packages/backend
        run: npm test

      - name: Build TypeScript
        working-directory: packages/backend
        run: npm run build

      - name: Verify build output
        working-directory: packages/backend
        run: |
          test -f dist/index.js || (echo "❌ dist/index.js not found" && exit 1)
          echo "✅ dist/index.js found"

      - name: Prepare deployment package
        working-directory: packages/backend
        run: |
          mkdir -p deploy

          cp -r dist deploy/
          cp package.json deploy/

          # Copy shared package before npm install can overwrite it
          mkdir -p deploy/node_modules/@ronl/shared
          cp -r ../shared/dist deploy/node_modules/@ronl/shared/
          cp ../shared/package.json deploy/node_modules/@ronl/shared/

          # Remove @ronl/shared from package.json so npm install doesn't touch it
          cd deploy
          npm pkg delete dependencies.@ronl/shared
          npm install --production --omit=dev

          echo "[config]" > .deployment
          echo "SCM_DO_BUILD_DURING_DEPLOYMENT = false" >> .deployment

      - name: Create deployment zip
        working-directory: packages/backend
        run: |
          cd deploy
          zip -r ../deployment-prod.zip .
          echo "✅ $(du -sh ../deployment-prod.zip | cut -f1) — deployment-prod.zip"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-prod
          path: packages/backend/deployment-prod.zip
          retention-days: 5