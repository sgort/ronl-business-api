name: Deploy Backend to Azure ACC

on:
  # The backend's 2008 tests used to run only AFTER a merge, because this
  # workflow triggered on push alone. A backend pull request therefore reached
  # acc with `audit` as its only check -- and audit validates workflows,
  # renovate.json and the supply-chain register, saying nothing about whether
  # the code works.
  #
  # #86 made that sharper rather than softer: the per-file 80% branch floor it
  # added to packages/backend/jest.config.js gated nothing before a merge, so a
  # file dropping below it failed on acc, after the fact, rather than on the
  # branch that caused it. The floor was real in four workspaces and
  # retrospective in the fifth. Issue #87.
  #
  # Nothing here needs an `if:` guard, unlike linked-data-explorer's equivalent
  # change (its #82): that workflow deploys to Azure, so it had to gate six
  # deploy-side steps on the event. This one ends at an uploaded artifact and
  # contains no deploy step at all -- the real deploy is deploy-backend-to-acc.sh,
  # run by hand -- so a pull-request run has no external side effect.
  pull_request:
    branches:
      - acc
    # No path filter here, deliberately: see the `changes` job. Filtering the
    # trigger would leave this workflow's required check unreported.
  push:
    branches:
      - acc
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - '.github/workflows/azure-backend-acc.yml'
      - 'package-lock.json'
      - 'package.json'
      # .nvmrc sets the Node version this workflow builds, tests and ships on.
      # Without it here, a Node bump built and deployed nothing (sgort/linked-data-explorer#119).
      - '.nvmrc'
  workflow_dispatch:

# Serialise runs, so a pull request pushed to twice in quick succession does not
# run 2008 tests twice over. Keyed on the pull-request NUMBER where there is one
# and the ref otherwise: keyed on github.ref alone, the push run a merge fires
# and the pull request's own final run land in the same group and cancel each
# other at random -- seen in this repository on 2026-08-29 with the Static Web
# Apps deploys, and fixed there the same way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  # Which files did this pull request change? The path filter used to sit on the
  # pull_request trigger, and a workflow its trigger filters out never starts, so
  # it reports no check at all. A required check that never reports waits
  # forever, and a pull request that does not touch these paths could never
  # merge. A job skipped by its own `if:` reports success instead. So the filter
  # lives here, and the jobs below are skipped rather than never started, which
  # is what lets their checks be required (sgort/linked-data-explorer#119).
  #
  # Fail-safe: the jobs below run when this job did NOT succeed, not only when it
  # says "relevant". An API failure here means a full build, never a free pass.
  # push keeps its trigger filter; nothing is required on a push.
  changes:
    permissions:
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Match the changed files against this workflow's paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # The paths under push: above, as one regular expression. Keep the two in step.
          # Why the root lockfile and manifest are in the pattern (moved here
          # from the pull_request path filter, sgort/linked-data-explorer#119):
          # The root lockfile and manifest, because every workspace resolves through
          # them and a hoisted dependency can move under any of them. Without these
          # a lockfile-only change -- Renovate's lock-file maintenance above all --
          # is built and tested by nothing.
          #
          # Safe to widen HERE and nowhere else: this job claims no Static Web Apps
          # staging environment. The frontend app was on the Free plan, three
          # environments, when five open pull requests exhausted it on 2026-08-28,
          # which is why the three SWA workflows kept their narrow filters. It is
          # on Standard (ten) now; widening those filters would make every
          # lockfile-only pull request claim previews, and is a decision of its own.
          # linked-data-explorer#97.
          PATTERN: '^(\.nvmrc$|packages/backend/|packages/shared/|\.github/workflows/azure-backend-acc\.yml$|package-lock\.json$|package\.json$)'
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Renames count under both names, as GitHub's own path filter does.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if printf '%s\n' "$files" | grep -qE "$PATTERN"; then relevant=true; else relevant=false; fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Changed files relevant to this workflow: $relevant"

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    permissions:
      contents: read
      # Mints the OIDC token azure/login exchanges for an ARM token. Without
      # it the deploy fails with no token to present at all.
      id-token: write
    runs-on: ubuntu-24.04
    # Declared for pull-request runs too, following linked-data-explorer rather
    # than the conditional #87 floats as the tidier alternative. Both
    # environments in this repository carry no protection rules, so nothing
    # waits on an approval; the only cost is that a pull-request run records a
    # deployment against `acc` in the environment's history. The Static Web Apps
    # preview deploys already do exactly that on every pull request, so the
    # entry is not a new pattern -- and matching the reference repository is
    # worth more than avoiding it.
    environment:
      name: acc
      url: https://acc.api.open-regels.nl

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc, so there is ONE place this repository states its
          # Node version. Before #36 there were four answers and they disagreed:
          # these workflows said '20', .nvmrc said 22, engines.node said
          # >=20.13.0, and both App Service plans run NODE|22-lts. So the
          # deployed artifact was BUILT on a major the host does not run.
          #
          # .nvmrc is pinned to an exact 22.22.0 rather than a bare 22,
          # deliberately: 'nothing a pipeline downloads may float' is the same
          # policy the action digests above follow, and a bare major resolves to
          # whatever 22.x the runner happens to carry. Renovate's node manager
          # parses .nvmrc, so this is maintained rather than hand-bumped --
          # unlike linked-data-explorer, which pins exact literals in each
          # workflow and drifted apart exactly that way (its #80: engines moved
          # to >=24.20.0 while all four workflows stayed at 24.19.0).
          #
          # zizmor.yml is deliberately NOT switched to this file. Its
          # renovate-config-validator step needs Node 24, because renovate@44.50.3
          # declares engines.node ^24.11.0 and npm accepts a mismatch with an
          # EBADENGINE warning rather than refusing. That pin is load-bearing.
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@ronl/shared

      - name: Run linter
        working-directory: packages/backend
        run: npm run lint

      # Lints the published contract against the NL API Design Rules 2.2.1
      # ruleset (#200). Runs BEFORE the tests so a document that cannot satisfy
      # the ruleset fails fast and names the rule; the coverage gate inside
      # "npm test" then checks it against the routes actually served.
      - name: Lint the OpenAPI document
        working-directory: packages/backend
        run: npm run lint:openapi

      - name: Unit tests
        working-directory: packages/backend
        run: npm test

      - name: Build TypeScript
        working-directory: packages/backend
        run: npm run build

      - name: Verify build output
        working-directory: packages/backend
        run: |
          test -f dist/index.js || (echo "❌ dist/index.js not found" && exit 1)
          echo "✅ dist/index.js found"

      - name: Prepare deployment package
        working-directory: packages/backend
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_number }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p deploy

          cp -r dist deploy/
          cp package.json deploy/

          # The OpenAPI document the /v1/openapi.json route serves (#200).
          # openapi/openapi.json is generated by the `prebuild` hook and is
          # gitignored, so it exists by now but is not in the repository.
          # src/openapi/document.ts resolves it as ../../openapi/openapi.json
          # from dist/openapi, which is deploy/openapi/ in the artifact -- the
          # same relative step build-info.json below relies on.
          #
          # Only the JSON: the YAML source, the vendored ADR ruleset and the
          # Spectral config are build-time inputs and have no business in a
          # production artifact.
          mkdir -p deploy/openapi
          cp openapi/openapi.json deploy/openapi/

          # Record which build this artifact is, for /v1/health's `build` block
          # (#129). package.json's version names the release, not the build, so
          # every deploy between two releases reports the same string. It is a
          # file in the artifact rather than an App Service setting, because
          # settings persist across deploys and can describe a build that is no
          # longer running -- which is the failure this exists to detect.
          jq -n --arg sha "$BUILD_SHA" --arg run "$BUILD_RUN" --arg runId "$BUILD_RUN_ID" \
            '{sha: $sha, run: $run, runId: $runId}' > deploy/build-info.json
          cat deploy/build-info.json

          # Install production dependencies FROM THE LOCKFILE (#34). This used to
          # be `npm install --production` in deploy/, which had a package.json and
          # no lockfile, so it re-resolved every caret range at deploy time: the
          # artifact could ship versions no test ran against and no lockfile
          # records, with no cooldown. On 2026-08-29 an acceptance deploy ran with
          # @anthropic-ai/sdk freshly jumped 42 minor versions and uuid five
          # majors, none of it matching what any build had verified.
          #
          # The only lockfile is the workspace root's, and `npm ci` in deploy/
          # cannot use it: it describes every workspace. So the install runs in a
          # staging copy holding the root manifest and lockfile and the two
          # manifests the backend needs, filtered to the backend workspace with
          # production dependencies only. `npm ci` refuses a lockfile that does
          # not satisfy the manifests, rather than resolving around it.
          #
          # packages/shared is present because the lockfile records @ronl/shared
          # as a workspace link and npm must be able to resolve it. The other
          # workspaces are left out: with them present npm also installs their
          # packages, which never reach this artifact.
          #
          # The root `prepare` is `husky`, a devDependency, so under --omit=dev it
          # would fail with "husky: not found". It is dropped from the staged copy
          # rather than from the repository, where it is load-bearing. The same goes
          # for @ronl/shared's `prepare`, which is `tsc`: under --omit=dev npm runs
          # it with no TypeScript installed and the install fails. Its dist is
          # built by the step above and copied into the artifact below.
          stage="$RUNNER_TEMP/backend-prod"
          rm -rf "$stage"
          mkdir -p "$stage/packages/backend" "$stage/packages/shared" "$stage/scripts"
          cp ../../package.json ../../package-lock.json "$stage/"
          cp ../../scripts/write-deps-marker.sh "$stage/scripts/"
          cp package.json "$stage/packages/backend/"
          cp ../shared/package.json "$stage/packages/shared/"
          (cd "$stage" && npm pkg delete scripts.prepare)
          (cd "$stage" && npm pkg delete scripts.prepare --workspace=@ronl/shared)
          (cd "$stage" && npm ci --omit=dev --workspace=@ronl/backend --no-audit --no-fund)

          # A production dependency the backend needs at a version other than the
          # hoisted one -- or one the lockfile simply records under the workspace,
          # as it does altcha-lib (ec32fa8) -- is installed under
          # packages/backend/node_modules. deploy/ IS the backend's root, so those
          # entries belong in deploy/node_modules and are merged in after the
          # hoisted tree is copied. Where the same package is ALSO hoisted, the two
          # versions cannot both live there: something else resolves to the hoisted
          # one, and overwriting it would break that instead. Fail on that case
          # rather than guess. Dot entries (.bin, npm's metadata) are skipped, and
          # a scope directory stands for the packages inside it.
          nested="$stage/packages/backend/node_modules"
          nested_pkgs=""
          if [ -d "$nested" ]; then
            for entry in "$nested"/[!.]*; do
              [ -e "$entry" ] || continue
              name=$(basename "$entry")
              case "$name" in
                @*) for scoped in "$entry"/*; do nested_pkgs="$nested_pkgs $name/$(basename "$scoped")"; done ;;
                *) nested_pkgs="$nested_pkgs $name" ;;
              esac
            done
            echo "packages/backend/node_modules holds:${nested_pkgs:- nothing}"
            for pkg in $nested_pkgs; do
              if [ -e "$stage/node_modules/$pkg" ]; then
                echo "❌ $pkg is installed both hoisted and under packages/backend; the artifact can hold only one"
                exit 1
              fi
            done
          fi

          # The workspace link points back into the staging copy, so it is removed
          # before the tree is copied and replaced with real content afterwards.
          rm -rf "$stage/node_modules/@ronl"
          cp -r "$stage/node_modules" deploy/
          for pkg in $nested_pkgs; do
            mkdir -p "deploy/node_modules/$(dirname "$pkg")"
            cp -r "$nested/$pkg" "deploy/node_modules/$pkg"
            echo "✅ $pkg merged from packages/backend/node_modules"
          done

          # @ronl/shared is a workspace package npm cannot fetch from the registry.
          # It goes in AFTER the install, deliberately: copied in before, npm sees
          # a package not declared in the manifest it is installing, prunes it as
          # extraneous, and the app dies at runtime with "Cannot find module
          # '@ronl/shared'". deploy-backend-to-acc.sh learned this the hard way and
          # says so; the version of this step that this replaces had the two the
          # wrong way round, latent only because nothing ever deployed its artifact.
          mkdir -p deploy/node_modules/@ronl/shared
          cp -r ../shared/dist deploy/node_modules/@ronl/shared/
          cp ../shared/package.json deploy/node_modules/@ronl/shared/
          node -e "require.resolve('@ronl/shared', { paths: ['./deploy'] })" \
            && echo "✅ @ronl/shared resolves from the artifact"

          echo "Production dependencies: $(ls deploy/node_modules | wc -l) top-level entries"

          # Tell Azure not to rebuild — this artifact is already built.
          echo "[config]" > deploy/.deployment
          echo "SCM_DO_BUILD_DURING_DEPLOYMENT = false" >> deploy/.deployment

      - name: Create deployment zip
        working-directory: packages/backend
        run: |
          cd deploy
          zip -qr ../deployment-acc.zip .
          echo "✅ $(du -sh ../deployment-acc.zip | cut -f1) — deployment-acc.zip"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-acc
          path: packages/backend/deployment-acc.zip
          retention-days: 5

      # ── Deploy ────────────────────────────────────────────────────────────────
      #
      # Gated on the event, following linked-data-explorer's equivalent change
      # (its #82): this workflow keeps its pull_request trigger so `build` can be
      # a required check on acc, and a pull request must build and test without
      # shipping anything.
      #
      # Authentication is OIDC rather than a publish profile. That is not a
      # preference: SCM basic auth is DISABLED on both App Services
      # (basicPublishingCredentialsPolicies/scm allow=false, measured
      # 2026-09-20), so azure/webapps-deploy with a publish-profile secret --
      # which is what linked-data-explorer uses, and why it works there -- would
      # be rejected here. The unused AZURE_WEBAPP_PUBLISH_PROFILE_ACC secret from
      # 2026-03-01 is the earlier attempt.
      #
      # `az webapp deploy` over an ARM token is exactly what
      # deploy-backend-to-acc.sh already does by hand, so this is the existing
      # mechanism with a machine identity instead of a human session -- and it
      # removes the failure that blocked the 15 September deploy, where an
      # expired az login stopped a release reaching acc after it had merged.
      - name: Log in to Azure
        if: github.event_name != 'pull_request'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_ACC }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        if: github.event_name != 'pull_request'
        run: |
          az webapp deploy \
            --name ronl-business-api-acc \
            --resource-group rg-ronl-acc \
            --src-path packages/backend/deployment-acc.zip \
            --type zip

      - name: Health check
        if: github.event_name != 'pull_request'
        run: |
          for i in $(seq 1 5); do
            code=$(curl -s -o /dev/null -m 10 -w "%{http_code}" https://acc.api.open-regels.nl/v1/health/live || true)
            if [ "$code" = "200" ]; then
              echo "✅ Backend is alive"
              exit 0
            fi
            echo "Attempt $i/5: HTTP ${code:-none}, retrying in 10s"
            sleep 10
          done
          echo "❌ Liveness check failed after 5 attempts"
          exit 1

      - name: Verify the deploy took effect
        if: github.event_name != 'pull_request'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # The previous build keeps answering while Azure starts the new one, so
          # a liveness check passes against either. build.sha (#129) tells them
          # apart directly: without it, a deploy that silently left the old
          # artifact serving would pass every check above.
          #
          # About three minutes, matching linked-data-explorer, where a 34s window
          # once gave up 14s before the new build started.
          running=""
          for attempt in $(seq 1 12); do
            body=$(curl -s -m 10 https://acc.api.open-regels.nl/v1/health || true)
            running=$(printf '%s' "$body" | jq -r '.data.build.sha' 2>/dev/null || true)
            [ "$running" = "$EXPECTED_SHA" ] && break
            echo "Attempt $attempt/12: build.sha is ${running:-unreadable}, expected $EXPECTED_SHA"
            [ "$attempt" -lt 12 ] && sleep 15
          done

          if [ "$running" = "$EXPECTED_SHA" ]; then
            echo "✅ acc is running $EXPECTED_SHA"
          else
            echo "❌ acc is running ${running:-unreadable}, expected $EXPECTED_SHA: the deploy did not take effect"
            curl -s https://acc.api.open-regels.nl/v1/health | jq '{version, build, environment}' || true
            exit 1
          fi
