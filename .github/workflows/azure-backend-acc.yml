name: Build Backend for ACC

on:
  # The backend's 2008 tests used to run only AFTER a merge, because this
  # workflow triggered on push alone. A backend pull request therefore reached
  # acc with `audit` as its only check -- and audit validates workflows,
  # renovate.json and the supply-chain register, saying nothing about whether
  # the code works.
  #
  # #86 made that sharper rather than softer: the per-file 80% branch floor it
  # added to packages/backend/jest.config.js gated nothing before a merge, so a
  # file dropping below it failed on acc, after the fact, rather than on the
  # branch that caused it. The floor was real in four workspaces and
  # retrospective in the fifth. Issue #87.
  #
  # Nothing here needs an `if:` guard, unlike linked-data-explorer's equivalent
  # change (its #82): that workflow deploys to Azure, so it had to gate six
  # deploy-side steps on the event. This one ends at an uploaded artifact and
  # contains no deploy step at all -- the real deploy is deploy-backend-to-acc.sh,
  # run by hand -- so a pull-request run has no external side effect.
  pull_request:
    branches:
      - acc
    # No path filter here, deliberately: see the `changes` job. Filtering the
    # trigger would leave this workflow's required check unreported.
  push:
    branches:
      - acc
    paths:
      - 'packages/backend/**'
      - 'packages/shared/**'
      - '.github/workflows/azure-backend-acc.yml'
      - 'package-lock.json'
      - 'package.json'
      # .nvmrc sets the Node version this workflow builds, tests and ships on.
      # Without it here, a Node bump built and deployed nothing (sgort/linked-data-explorer#119).
      - '.nvmrc'
  workflow_dispatch:

# Serialise runs, so a pull request pushed to twice in quick succession does not
# run 2008 tests twice over. Keyed on the pull-request NUMBER where there is one
# and the ref otherwise: keyed on github.ref alone, the push run a merge fires
# and the pull request's own final run land in the same group and cancel each
# other at random -- seen in this repository on 2026-08-29 with the Static Web
# Apps deploys, and fixed there the same way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  # Which files did this pull request change? The path filter used to sit on the
  # pull_request trigger, and a workflow its trigger filters out never starts, so
  # it reports no check at all. A required check that never reports waits
  # forever, and a pull request that does not touch these paths could never
  # merge. A job skipped by its own `if:` reports success instead. So the filter
  # lives here, and the jobs below are skipped rather than never started, which
  # is what lets their checks be required (sgort/linked-data-explorer#119).
  #
  # Fail-safe: the jobs below run when this job did NOT succeed, not only when it
  # says "relevant". An API failure here means a full build, never a free pass.
  # push keeps its trigger filter; nothing is required on a push.
  changes:
    permissions:
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Match the changed files against this workflow's paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # The paths under push: above, as one regular expression. Keep the two in step.
          # Why the root lockfile and manifest are in the pattern (moved here
          # from the pull_request path filter, sgort/linked-data-explorer#119):
          # The root lockfile and manifest, because every workspace resolves through
          # them and a hoisted dependency can move under any of them. Without these
          # a lockfile-only change -- Renovate's lock-file maintenance above all --
          # is built and tested by nothing.
          #
          # Safe to widen HERE and nowhere else: this job claims no Static Web Apps
          # staging environment. The frontend app was on the Free plan, three
          # environments, when five open pull requests exhausted it on 2026-08-28,
          # which is why the three SWA workflows kept their narrow filters. It is
          # on Standard (ten) now; widening those filters would make every
          # lockfile-only pull request claim previews, and is a decision of its own.
          # linked-data-explorer#97.
          PATTERN: '^(\.nvmrc$|packages/backend/|packages/shared/|\.github/workflows/azure-backend-acc\.yml$|package-lock\.json$|package\.json$)'
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Renames count under both names, as GitHub's own path filter does.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          if printf '%s\n' "$files" | grep -qE "$PATTERN"; then relevant=true; else relevant=false; fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Changed files relevant to this workflow: $relevant"

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    # Declared for pull-request runs too, following linked-data-explorer rather
    # than the conditional #87 floats as the tidier alternative. Both
    # environments in this repository carry no protection rules, so nothing
    # waits on an approval; the only cost is that a pull-request run records a
    # deployment against `acc` in the environment's history. The Static Web Apps
    # preview deploys already do exactly that on every pull request, so the
    # entry is not a new pattern -- and matching the reference repository is
    # worth more than avoiding it.
    environment:
      name: acc
      url: https://acc.api.open-regels.nl

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc, so there is ONE place this repository states its
          # Node version. Before #36 there were four answers and they disagreed:
          # these workflows said '20', .nvmrc said 22, engines.node said
          # >=20.13.0, and both App Service plans run NODE|22-lts. So the
          # deployed artifact was BUILT on a major the host does not run.
          #
          # .nvmrc is pinned to an exact 22.22.0 rather than a bare 22,
          # deliberately: 'nothing a pipeline downloads may float' is the same
          # policy the action digests above follow, and a bare major resolves to
          # whatever 22.x the runner happens to carry. Renovate's node manager
          # parses .nvmrc, so this is maintained rather than hand-bumped --
          # unlike linked-data-explorer, which pins exact literals in each
          # workflow and drifted apart exactly that way (its #80: engines moved
          # to >=24.20.0 while all four workflows stayed at 24.19.0).
          #
          # zizmor.yml is deliberately NOT switched to this file. Its
          # renovate-config-validator step needs Node 24, because renovate@44.50.3
          # declares engines.node ^24.11.0 and npm accepts a mismatch with an
          # EBADENGINE warning rather than refusing. That pin is load-bearing.
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@ronl/shared

      - name: Run linter
        working-directory: packages/backend
        run: npm run lint

      - name: Unit tests
        working-directory: packages/backend
        run: npm test

      - name: Build TypeScript
        working-directory: packages/backend
        run: npm run build

      - name: Verify build output
        working-directory: packages/backend
        run: |
          test -f dist/index.js || (echo "❌ dist/index.js not found" && exit 1)
          echo "✅ dist/index.js found"

      - name: Prepare deployment package
        working-directory: packages/backend
        run: |
          mkdir -p deploy

          cp -r dist deploy/
          cp package.json deploy/

          # Copy shared package before npm install can overwrite it
          mkdir -p deploy/node_modules/@ronl/shared
          cp -r ../shared/dist deploy/node_modules/@ronl/shared/
          cp ../shared/package.json deploy/node_modules/@ronl/shared/

          # Remove @ronl/shared from package.json so npm install doesn't touch it
          cd deploy
          npm pkg delete dependencies.@ronl/shared
          npm install --production --omit=dev

          echo "[config]" > .deployment
          echo "SCM_DO_BUILD_DURING_DEPLOYMENT = false" >> .deployment

      - name: Create deployment zip
        working-directory: packages/backend
        run: |
          cd deploy
          zip -r ../deployment-acc.zip .
          echo "✅ $(du -sh ../deployment-acc.zip | cut -f1) — deployment-acc.zip"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-acc
          path: packages/backend/deployment-acc.zip
          retention-days: 5
