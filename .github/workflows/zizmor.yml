name: Supply-chain audit

on:
  # No `branches:` filter here, deliberately, unlike the push trigger below.
  #
  # A pull request opened against a FEATURE branch -- a stacked PR -- matches
  # no filtered trigger, so it accumulates no audit at all. It then reports
  # mergeStateStatus CLEAN with zero checks: ready-looking, and not ready.
  # When its parent merges and GitHub retargets it to acc, the required audit
  # is missing and it blocks permanently, because retargeting emits no
  # pull_request event either. Closing and reopening the pull request is the
  # only way out, `reopened` being one of the default trigger types.
  #
  # That is not hypothetical: it cost four rounds of manual intervention in
  # linked-data-explorer and blocked #45 here. The audit is read-only and
  # cheap, so running it on every pull request regardless of base costs
  # little and removes the hole entirely.
  #
  # Do NOT copy this to azure-frontend-acc.yml. That workflow carries the
  # same filter for the opposite reason -- it rations Static Web Apps staging
  # environments against a three-environment ceiling, which five open pull
  # requests exhausted on 2026-08-28 and again on 2026-09-02. Identical
  # syntax, opposite consequence when removed.
  pull_request:
  push:
    branches:
      - acc
      - main

# Read-only: the audit inspects the tree and needs nothing else.
permissions:
  contents: read

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24 for the config validator
        # renovate@44.50.3 declares engines.node ^24.11.0; the runner's
        # default is Node 22. npm accepts that with an EBADENGINE warning
        # rather than refusing, so the validator ran unsupported and green
        # -- the kind of mismatch that keeps working until it abruptly
        # does not. Reuses the setup-node pin this repository already
        # carries, so Renovate maintains one digest rather than two.
        #
        # Placed BEFORE the zizmor step deliberately: a step after a
        # failing one is skipped, and the validator's `if: always()`
        # would then run on whatever Node the runner defaulted to.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # The action's `version` input defaults to "latest". Pinning it is
          # the whole point of this exercise — and it keeps CI's findings
          # identical to the local baseline this work was measured against.
          # Not Renovate-maintained: the github-actions manager does not
          # parse action inputs, so this must be bumped by hand.
          version: '1.29.0'
          # advanced-security uploads SARIF, which needs security-events:
          # write. This job is contents: read only, so it must be false.
          # It also means fork PRs work, having no upload step to fail.
          advanced-security: false
          annotations: true
          online-audits: false
          # Leave `token` at its default. Setting it to '' looks like sound
          # least-privilege hardening, but zizmor's --gh-token is env-backed
          # and clap rejects a set-but-empty value before any audit runs,
          # even with online-audits: false:
          #   error: invalid value '' for '--gh-token <GH_TOKEN>'
          # Learned the hard way in ttl-editor; do not retry it.

      - name: Validate renovate.json
        # Runs even when zizmor fails, so a single run reports on both halves
        # of the policy rather than the first failure hiding the second.
        if: always()
        # Pinned like everything else here. A supply-chain check that fetched a
        # floating version of its own tool would be self-defeating. Renovate's
        # npm manager will NOT maintain this for us -- it is an inline npx
        # argument, not a manifest entry -- so it is bumped by hand, alongside
        # the zizmor version above.
        #
        # --strict also fails on configuration Renovate would silently
        # auto-migrate. That is deliberate: it is how `baseBranches`, renamed
        # upstream to `baseBranchPatterns`, was caught in linked-data-explorer
        # rather than living on as a deprecated key that still "worked".
        #
        # No filename argument. Passing one switches the validator into global
        # config mode, which applies different rules than the repository config
        # this file actually is -- it will happily validate and tell you
        # nothing useful.
        run: npx --yes --package renovate@44.50.3 renovate-config-validator --strict

      - name: Install dependencies for the formatter
        # Needed because the check below must run THIS repository's Prettier,
        # not a version named here. An `npx prettier@<pinned>` would be a second
        # version to keep in step with package.json, reintroducing exactly the
        # drift the check exists to catch. npm ci costs install time and cannot
        # drift.
        #
        # This job had no npm ci at all before: everything in it ran from npx or
        # plain node. That is the cost of this step, and it buys a check that is
        # always measuring what developers actually run.
        if: always()
        run: npm ci

      - name: Check formatting
        # Formatting was enforced by the pre-push hook alone, so the rule held
        # on a developer's machine and not on the shared branch. That gap is not
        # theoretical: a Prettier 3.7 -> 3.9 upgrade changed how short union
        # types are formatted, and five files nobody had touched began failing
        # `prettier --check` the moment the upgrade merged — with every CI check
        # green. The symptom would have been the next person's `git push`
        # failing on files they had never opened.
        #
        # The ROOT script, matching what the pre-push hook runs. Linked Data
        # Explorer fans out per workspace because Prettier resolves
        # .prettierignore relative to the working directory and its packages
        # each carry their own; this repository has one root .prettierignore and
        # one root script, so the root run IS the right command here. Copying
        # either shape into the other repository would be wrong.
        #
        # It belongs in this job rather than in a deploy workflow: `audit` has
        # no paths filter and is the required status check, so every pull
        # request reaches it — including documentation-only ones, whose markdown
        # is the most likely thing to drift, since lint-staged only formats
        # src/** and package.json on commit.
        #
        # if: always() for the same reason as the validator above — a zizmor
        # failure should not hide a formatting failure behind it.
        if: always()
        run: npm run check-format

      - name: Verify pin truth and register agreement
        # zizmor validates pin FORMAT — that `uses:` names a 40-character SHA.
        # It cannot say the SHA is the RIGHT one, so a wrong or hostile digest
        # carrying a plausible "# v7.0.1" comment passes zizmor, Prettier and
        # review alike. This resolves every digest against the GitHub API and
        # compares SECURITY-PIPELINE.md's register with the workflows —
        # digests, versions, the (×N) multiplicities, and the totals headline.
        #
        # The multiplicities are not decoration here: setup-node silently went
        # from ×8 to ×9 when the config-validator step above was added, and the
        # register still said ×8 with every gate green. That is the drift this
        # step now catches.
        #
        # if: always() for the same reason as the validator above — one run
        # should report on every half of the policy, not stop at the first.
        if: always()
        # BLOCKING. It ran with continue-on-error: true from its adoption in
        # #81 until #83 promoted it, once the thing it was waiting on had been
        # shown to work here rather than only in linked-data-explorer.
        #
        # What it was waiting on: Renovate rewrites workflow pins and their
        # version comments together, and never touches SECURITY-PIPELINE.md, so
        # every action-bump pull request fails the register half until the
        # register is updated by hand. Blocking on that would fail a required
        # check on routine dependency updates, which is how gates get resented
        # and then bypassed.
        #
        # What resolved it: the register is updated ON the bump's branch,
        # before merging, so the check is green on the pull request rather than
        # only on acc afterwards. Exercised here on #101 (zizmor-action v0.6.2
        # -> v0.6.4), which is also this repository's own drift mode rather
        # than a borrowed one.
        #
        # Why NOT staying non-blocking, which is the part that is easy to get
        # wrong: continue-on-error does not merely keep the job green, it
        # rewrites the STEP's reported conclusion too, and the honest result
        # (outcome: failure) is not exposed by the REST API at all. Observed on
        # #101 before its register was fixed -- the step, the job and the pull
        # request's checks list ALL read "success" while this step's own log
        # carried:
        #
        #   1 finding(s):
        #     [register] zizmorcore/zizmor-action: workflow pins cc914d7f3750…
        #                (v0.6.4) but SECURITY-PIPELINE.md records only
        #                3dc1ecc9bcb9… (v0.6.2)
        #
        # A check nobody can see fail is not protecting anything; it is a check
        # that has to be remembered, which is the condition the register
        # drifted in to begin with.
        #
        # This does put a network call inside a job the ruleset requires, so a
        # GitHub API outage or rate limit can now fail a gate unrelated to the
        # change under review. If that proves to be a problem, add --offline:
        # it keeps the register half blocking and drops only the
        # network-dependent half. Do NOT restore continue-on-error, which
        # reinstates the invisibility above.
        env:
          # contents: read suffices — this only resolves public refs.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check-supply-chain
