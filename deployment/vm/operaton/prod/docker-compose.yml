name: operaton-prod

services:
  operaton:
    # 1.0.0 is what runs: the VM pulled `latest` once and its digest,
    # sha256:74659f07..., is Docker Hub's 1.0.0. Upgrading is #423; digest
    # pinning comes with #196.
    image: operaton/operaton:1.0.0
    container_name: ${OPERATON_NAME}
    restart: unless-stopped
    volumes:
      - ${OPERATON_DATA}:/operaton/h2-data
    environment:
      TZ: Europe/Amsterdam
      DB_DRIVER: org.h2.Driver
      DB_URL: jdbc:h2:file:/operaton/h2-data/operaton-prod;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      # #415: engine-rest requires a login (basic auth), the engine checks
      # permissions, and its own CORS is off (Caddy answers CORS for the public
      # rule paths only). Proven on 1.0.0 by deployment/vm/operaton/test/.
      # The tenant check stays on (default): DMNs are deployed without a tenant.
      # The invoice example stays as it is here: on this existing database it
      # starts normally with these settings (it fails only on an empty one).
      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=70.0
        -Doperaton.bpm.run.auth.enabled=true
        -Doperaton.bpm.authorization.enabled=true
        -Doperaton.bpm.run.cors.enabled=false
      DEBUG: "false"
    networks:
      npm-network:
        ipv4_address: 172.18.0.10

networks:
  npm-network:
    external: true
