name: caddy-proxy

services:
  caddy:
    # Pinned by tag and digest to the version the #415 harness
    # (deployment/vm/operaton/test) proves the engine-rest allowlist on; the two
    # move together (#433). Was the floating caddy:2-alpine.
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # #415: OPERATON_PUBLIC_READER_AUTH (base64 of publicReader:<password>),
    # read by operaton-engine-rest.caddy. The file lives only on the VM.
    # Changing it needs `docker compose up -d` (a recreate), not a reload.
    env_file: ./caddy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./operaton-engine-rest.caddy:/etc/caddy/operaton-engine-rest.caddy:ro
      - ./static:/srv/static
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - npm-network

volumes:
  caddy_data:
  caddy_config:

networks:
  npm-network:
    external: true

