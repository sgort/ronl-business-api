name: skosmos

services:
  skosmos-web:
    image: quay.io/natlibfi/skosmos:latest@sha256:c585569869892cbbaa88956fa3092df54262e7509062622fcec05a7278e6deb6
    container_name: skosmos-web
    restart: unless-stopped
    volumes:
      - ./config.ttl:/var/www/html/config.ttl:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - npm-network

networks:
  npm-network:
    external: true
    name: npm-network