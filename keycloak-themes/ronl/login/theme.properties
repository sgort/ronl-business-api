# RONL Business API - Keycloak Theme Configuration
# Theme Name: ronl
# Version: 1.0.0
# Description: Custom theme matching MijnOmgeving design

# Parent Theme - extends default Keycloak base theme
parent=base

# Import default Keycloak styles as foundation
import=common/keycloak

# Custom Styles: Flevoland IT's tokens first (a copy of
# packages/shared/styles/flevoland/tokens.css, written by
# `npm run sync:keycloak-tokens`), then the theme that uses them (#400).
styles=css/flevoland-tokens.css css/login.css

# Localization
locales=nl,en

# Account Pages
# (Optional: can customize account management pages)
# accountStyles=css/account.css

# Email Templates  
# (Optional: can customize email templates)
# emailStyles=css/email.css
