# packages/backend/openapi/.spectral.yaml
#
# Lints the built openapi.json (npm run lint:openapi) against the NL API Design
# Rules 2.2.1 ruleset vendored beside this file. Every rule in it gates except
# the exceptions below. Each states its reason and is scoped as narrowly as the
# rule allows; add one only with a reason a reviewer can check.

extends:
  - ./adr-ruleset-2.2.1.yaml

rules:
  # The release version is calendar-based, YYYY.MM.N with a zero-padded month
  # (2026.09.11), and info.version is that same string, set from package.json by
  # scripts/build-openapi.cjs. A zero-padded month is not valid semver, and
  # rewriting it in the document would make the document disagree with the
  # release it describes. linked-data-explorer disables this rule for the same
  # reason and the same scheme.
  nlgov:semver: 'off'

  # The three problem-details rules (use-problem-schema, problem-schema-members,
  # problem-invalid-input) were off globally until #216 moved every error
  # response to RFC 9457 `application/problem+json`. They gate now.

overrides:
  # The ValidSign STUB ceremony is a page a person's browser posts a form to,
  # standing in for ValidSign's own signing screen; its failure is an HTML page
  # for that person, not an API error for a client to parse. Problem details
  # would show them raw JSON. Stub mode only, and scoped to this one response.
  - files:
      - 'openapi.json#/paths/~1validsign~1stub~1ceremony~1%7BpackageId%7D~1sign/post/responses/500'
    rules:
      nlgov:use-problem-schema: 'off'

  # PublicIndexItem.date is NAMED `date` but carries a full timestamp, so
  # `format: date-time` is the honest description and the rule is wrong here.
  #
  # Checked against the running ACC service rather than inferred:
  #
  #   GET /v1/public/zoeken?q=zorg  ->  "date": "2026-08-14T12:41:03.000Z"
  #
  # In the source it is assigned straight from each item type's own timestamp --
  # `publishedAt` for berichten and nieuws, `modified` for producten,
  # `gepubliceerd` for processen (search.service.ts). Setting `format: date`
  # would make the document claim a precision the data does not have; renaming
  # the field would break every consumer of the public search API for a naming
  # nit. Scoped to this one property.
  - files:
      - 'openapi.json#/components/schemas/PublicIndexItem/properties/date'
    rules:
      nlgov:use-date-instead-of-datetime: 'off'

  # PaFeedItem.date is the same case as PublicIndexItem.date above: named
  # `date`, carrying a full timestamp. Checked against acceptance rather than
  # assumed:
  #
  #   GET /v1/pa/feed  ->  "date": "2026-09-25T22:47:20.137+02:00"
  #
  # These come from the upstream parliamentary sources with sub-second
  # precision and an offset, and are passed through unaltered. `format: date`
  # would claim a precision the data does not have, and truncating it here
  # would lose information the cockpit orders by. Scoped to this one property.
  - files:
      - 'openapi.json#/components/schemas/PaFeedItem/properties/date'
    rules:
      nlgov:use-date-instead-of-datetime: 'off'
