# packages/backend/openapi/openapi.yaml
#
# The published contract for the RONL Business API (#200). Hand-written, as in
# linked-data-explorer: this backend carries no decorators or schema
# annotations to generate from, and generating would mean adding them to 130
# handlers before anything could be published.
#
# Served as JSON at /v1/openapi.json. scripts/build-openapi.cjs builds
# openapi.json from this file and sets info.version from package.json, so the
# version is never edited here and never drifts from the release.
#
# EVERY /v1 operation must appear here or in openapi/pending.json:
# src/openapi/coverage.test.ts fails when a served operation is in neither, and
# when a documented operation is not served. pending.json may only shrink.
#
# After editing, run `npm run build:openapi` and restart the dev server -- the
# document is read once at module load, so a running process will not pick it
# up.
openapi: '3.1.0'

info:
  title: RONL Business API
  # NO `version` here, deliberately. scripts/build-openapi.cjs sets it from
  # package.json and REFUSES TO BUILD if this file sets one, so the published
  # document and the release can never disagree.
  summary: Process, decision and document services for Regels.overheid.nl
  contact:
    name: Steven Gort
    email: steven.gort@ictu.nl
    url: https://iou-architectuur.open-regels.nl/
  description: |
    Business API behind Regels.overheid.nl: Operaton process and decision
    execution, task handling, document generation and signing, and the
    machine-to-machine surface consumed outside the browser applications.

    ## Authentication

    Most operations require a Keycloak-issued JWT as a bearer token, applied by
    `jwtMiddleware` inside each router rather than at the mount. A tenant is
    derived from the token and enforced per operation; some operations
    additionally require a role.

    The unauthenticated surface is deliberate and small: `/v1/health`,
    `/v1/openapi.json`, `/v1/public`, `/v1/media-aggregator`, and the ValidSign
    callback, which carries no token because ValidSign does not send one.

    ## Error responses

    Every 4xx and 5xx is RFC 9457 problem details, served as
    `application/problem+json` (#216): `type`, `status`, `title`, `detail` and
    `instance`, plus a `code` extension member -- the stable identifier to
    branch on (see the `Problem` schema). Until #216 errors answered
    `{ "success": false, "error": { "code", "message" } }`; `error.code` is now
    `code`, and `error.message` is `detail`. Successful responses keep their
    `{ "success": true, "data": ... }` envelope.

    **Any operation can answer 400 `MALFORMED_BODY`**: a JSON body that does not
    parse is refused before routing, whatever the method. Oversized bodies
    answer 413 `PAYLOAD_TOO_LARGE`, and the rate limit 429
    `RATE_LIMIT_EXCEEDED`.

    ## Coverage

    **Complete.** Every operation this service serves is described here, and
    every operation described here is served -- `src/openapi/coverage.test.ts`
    asserts both, in both directions, and fails the build otherwise. An
    operation absent from this document is absent from the API.

    It was written per mount group across #200, with the operations not yet
    reached listed in `openapi/pending.json`. That file was emptied and
    deleted by the last group, `/v1/m2m` (#214).

# The major version lives in the server URL, so every path below is written
# without its /v1 prefix -- nlgov:include-major-version-in-uri requires the
# version in the URI, and putting it here rather than on 130 paths is how
# linked-data-explorer does it too.
servers:
  - url: https://api.open-regels.nl/v1
    description: Production
  - url: https://acc.api.open-regels.nl/v1
    description: Acceptance

tags:
  - name: Health
    description: Liveness, readiness and dependency checks. Unauthenticated.
  - name: Discovery
    description: What this service is and where its contract lives.
  - name: Public
    description: |
      The unauthenticated citizen-facing surface. Read operations are cached;
      the three write operations are rate limited and ALTCHA-protected.
  - name: Process
    description: |
      Starting, following and cancelling Operaton process instances. Every
      operation is organisation-scoped; the five instance reads also admit the
      case's own applicant.
  - name: Decision
    description: |
      DMN decision definitions and evaluation. Definitions are templates, not
      cases, so these carry no organisation check.
  - name: Task
    description: |
      User tasks. Organisation-scoped throughout, with no applicant exception:
      a task is work for staff, not a view of the case.
  - name: Machine-to-machine
    description: |
      The surface for system actors, reached only by a client on
      `M2M_ALLOWED_CLIENTS` (#237). It mirrors Process, Decision and Task in
      shape but not in behaviour: no organisation is derived or checked
      anywhere, and it talks to a separate Operaton engine.
  - name: Documents
    description: |
      The eDOCS document library. A proxy onto an external system, so failures
      are 502 rather than 500, and responses carry a `timestamp`.
  - name: Delivery
    description: |
      Doccle delivery. Same envelope and failure model as Documents.
  - name: Signing
    description: |
      ValidSign. Two routers on one mount with opposite security: the callback
      and ceremony routes are unauthenticated and some answer HTML, while the
      three task operations are organisation-checked.
  - name: Policy analysis
    description: |
      Signals, dossiers, saved searches and the curation board. Every
      operation needs the `public-affairs` realm role on top of a valid
      token. Dossiers and searches are organisation-scoped; signals are not.
  - name: RIP
    description: |
      The RIP phase boards. Organisation-scoped; the document reads are
      checked through tenant-access.
  - name: Capacity
    description: Capacity claims, with the same shape and scoping as RIP.
  - name: Besluitvorming
    description: Besluitvorming onder gedelegeerde bevoegdheid, scoped by tenant like Capacity.
  - name: HR
    description: Onboarding runs and employee profiles.
  - name: Personal records
    description: |
      A pass-through proxy to the BRP Haal Centraal API. Carries
      burgerservicenummers; examples use the reserved test range.
  - name: Admin
    description: |
      The audit log. The only operations requiring the `admin` realm role.
  - name: MCP
    description: |
      Model Context Protocol sources and chat. Requires `caseworker` or
      `admin`. Chat is the only streaming operation in this API.
  - name: Media aggregator
    description: |
      Aggregated media articles for the PA cockpit. Conditionally
      authenticated, and the one group not using this API's response envelope.

paths:
  /openapi.json:
    get:
      operationId: getOpenApiDocument
      tags: [Discovery]
      summary: This API's OpenAPI description
      description: |
        Returns this document. Served with fully open CORS so a browser-based
        viewer on any origin can fetch it, as `/core/publish-openapi` requires.
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
                description: An OpenAPI 3.1 document.
                additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          $ref: '#/components/responses/Error'

  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service health and dependency latency
      description: |
        Reports the running build and the reachability of Operaton, Keycloak
        and the cache.

        Answers **503** when any dependency is down: problem details, with the
        same report, `status: degraded`, under the `data` extension member.
      security: []
      responses:
        '200':
          description: All dependencies are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '503':
          description: |
            A dependency is down (`SERVICE_DEGRADED`), or the check itself
            failed (`HEALTH_CHECK_FAILED`). Problem details, with the health
            report kept under the `data` extension member where it was before
            #216.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    required: [data]
                    properties:
                      code: { enum: [SERVICE_DEGRADED, HEALTH_CHECK_FAILED] }
                      data: { $ref: '#/components/schemas/HealthResponse/properties/data' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Liveness probe
      description: |
        Answers 200 whenever the process is running. Checks no dependency, so
        it stays 200 while the service is degraded -- use `/health/ready` to
        decide whether to send traffic.
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [status, timestamp]
                    properties:
                      status:
                        type: string
                        const: alive
                      timestamp:
                        type: string
                        format: date-time
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: |
        Answers 200 when the service can accept traffic, and 503 when it
        cannot -- today that means Operaton is unavailable.
      security: []
      responses:
        '200':
          description: Ready to accept traffic.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '503':
          description: |
            Not ready (`NOT_READY`). Problem details, with the readiness report
            under the `data` extension member.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Problem'
                  - type: object
                    required: [data]
                    properties:
                      code: { const: NOT_READY }
                      data:
                        type: object
                        required: [status, timestamp]
                        properties:
                          status:
                            type: string
                            const: not ready
                          reason:
                            type: string
                            description: Which dependency made it not ready.
                          error:
                            type: string
                            description: Why the check itself failed.
                          timestamp:
                            type: string
                            format: date-time
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /health/external:
    get:
      operationId: getExternalHealth
      tags: [Health]
      summary: Reachability of the external services this API depends on
      description: |
        HEAD-probes CPRMV, TriplyDB and the Linked Data Explorer with a 5 second
        timeout each, and reports status and latency per target.

        Always answers 200: an unreachable target is reported in the body as
        `down`, not as a failure of this endpoint.
      security: []
      responses:
        '200':
          description: Probe results, one entry per target.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/DependencyStatus'
                  timestamp:
                    type: string
                    format: date-time
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  # ── /v1/public ────────────────────────────────────────────────────────────
  #
  # Every operation below answers without a token. The three WRITE operations
  # additionally pass through publicWriteLimiter: 10 requests per 15 minutes per
  # IP, answering 429 with the usual envelope and a RATE_LIMIT_EXCEEDED code.
  #
  # `meta.generatedAt` on the read operations is the moment the response was
  # built, not the moment the upstream data was fetched -- these services cache.

  /public/altcha/challenge:
    get:
      operationId: getAltchaChallenge
      tags: [Public]
      summary: Issue a proof-of-work challenge
      description: |
        Issues a fresh ALTCHA challenge for the public write forms. The solved
        token is sent back as the `altcha` field on `POST /public/feedback` and
        `POST /public/use-case`.

        **This is the one public operation that does NOT use the
        `{ success, data }` envelope** -- it answers the ALTCHA challenge object
        directly, because the widget consumes it as-is.

        When the server has no ALTCHA HMAC key configured the verification step
        on the write operations is skipped entirely, and this endpoint answers
        503.
      security: []
      responses:
        '200':
          description: A challenge for the ALTCHA widget.
          content:
            application/json:
              schema:
                type: object
                description: An ALTCHA challenge, passed to the widget unaltered.
                additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '503':
          description: ALTCHA is not configured on this server.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /public/nieuws:
    get:
      operationId: listPublicNieuws
      tags: [Public]
      summary: Government news items
      security: []
      parameters:
        - name: limit
          in: query
          description: 'Items to return. Values above 20 are clamped to 20.'
          schema: { type: integer, default: 10, minimum: 1, maximum: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: A page of news items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicPagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/NieuwsItem' }
                          pagination: { $ref: '#/components/schemas/PublicPagination' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/Error'

  /public/nieuws/{slug}:
    get:
      operationId: getPublicNieuwsItem
      tags: [Public]
      summary: One news item from the federated index
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicSlug'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicIndexItem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No item of this type with that slug.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /public/berichten:
    get:
      operationId: listPublicBerichten
      tags: [Public]
      summary: Service announcements
      security: []
      parameters:
        - name: limit
          in: query
          description: 'Items to return. Values above 20 are clamped to 20.'
          schema: { type: integer, default: 10, minimum: 1, maximum: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: A page of announcements.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicPagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/BerichtItem' }
                          pagination: { $ref: '#/components/schemas/PublicPagination' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/Error'

  /public/berichten/{id}:
    get:
      operationId: getPublicBericht
      tags: [Public]
      summary: One announcement by id
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: The announcement's id, as returned by the list operation.
          schema: { type: string }
      responses:
        '200':
          description: The announcement.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BerichtItem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No announcement with that id.
          $ref: '#/components/responses/Error'

  /public/producten-diensten:
    get:
      operationId: listPublicProductenDiensten
      tags: [Public]
      summary: Products and services offered to citizens and businesses
      security: []
      parameters:
        - name: limit
          in: query
          description: 'Items to return. Values above 200 are clamped to 200.'
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: A page of products and services.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicPagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ProductDienstItem' }
                          pagination: { $ref: '#/components/schemas/PublicPagination' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/Error'

  /public/producten/{slug}:
    get:
      operationId: getPublicProduct
      tags: [Public]
      summary: One product from the federated index
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicSlug'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicIndexItem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No product with that slug.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /public/regelcatalogus:
    get:
      operationId: getPublicRegelcatalogus
      tags: [Public]
      summary: The rule catalogue
      description: |
        Served from a cache. `refresh=true` forces the upstream to be re-read
        rather than serving what is held.
      security: []
      parameters:
        - name: refresh
          in: query
          description: |
            `true` or `1` forces a refresh. Any other value, including absent,
            serves the cached copy.
          schema: { type: string, enum: ['true', '1'] }
      responses:
        '200':
          description: The catalogue, with cache metadata.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [services, organizations, concepts, rules]
                    properties:
                      services: { type: array, items: { type: object, additionalProperties: true } }
                      organizations:
                        { type: array, items: { type: object, additionalProperties: true } }
                      concepts: { type: array, items: { type: object, additionalProperties: true } }
                      rules: { type: array, items: { type: object, additionalProperties: true } }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PublicMeta'
                      - type: object
                        required: [cache]
                        properties:
                          cache:
                            type: object
                            description: |
                              Whether this response came from cache, and how old it is.
                              Only this operation reports it.
                            required: [cached, fetchedAt, ageMs]
                            properties:
                              cached: { type: boolean }
                              fetchedAt:
                                type: [string, 'null']
                                format: date-time
                                description: |
                                  NULL when nothing is cached yet, which is the
                                  state of the FIRST request after a deploy --
                                  `getRegelcatalogusCacheInfo()` returns
                                  `{ cached: false, fetchedAt: null, ageMs: null }`
                                  and its own signature says `string | null`.
                                  Typed non-nullable until #269.
                              ageMs:
                                type: [integer, 'null']
                                description: |
                                  Null on a cold cache, alongside `fetchedAt`.
                                  See above.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/Error'

  /public/regels/{slug}:
    get:
      operationId: getPublicRegel
      tags: [Public]
      summary: One rule from the federated index
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicSlug'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicIndexItem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No rule with that slug.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /public/processen:
    get:
      operationId: listPublicProcessen
      tags: [Public]
      summary: Publicly visible processes
      security: []
      responses:
        '200':
          description: Every published process.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          $ref: '#/components/responses/Error'

  /public/processen/{key}:
    get:
      operationId: getPublicProces
      tags: [Public]
      summary: One process by its definition key
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: |
            The process definition key. Any non-empty value is a legitimate
            lookup; a miss is a 404, never a 400.
          schema: { type: string }
      responses:
        '200':
          description: The process.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No published process with that key.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /public/zoeken:
    get:
      operationId: searchPublicIndex
      tags: [Public]
      summary: Search the federated public index
      description: |
        Searches across all five item types. Every term is regex-escaped before
        matching, so no value of `q` is invalid and this operation never answers
        400 -- an unmatched query returns an empty list.

        `soort`, `bron` and `doelgroep` are comma-separated lists.
      security: []
      parameters:
        - name: q
          in: query
          description: Free-text query. Absent or empty returns the unfiltered index.
          schema: { type: string }
        - name: soort
          in: query
          description: 'Comma-separated item types, e.g. `regel,product`.'
          schema: { type: string }
        - name: bron
          in: query
          description: Comma-separated source organisations.
          schema: { type: string }
        - name: doelgroep
          in: query
          description: Comma-separated audiences.
          schema: { type: string }
        - name: sort
          in: query
          description: 'Relevance, date, or alphabetical.'
          schema: { type: string, enum: [rel, date, az] }
      responses:
        '200':
          description: Matching items, with facet counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total, facets]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PublicIndexItem' }
                          total:
                            type: integer
                            description: Matches before any paging.
                          facets:
                            type: object
                            description: |
                              Counts per facet value, for the current result
                              set.

                              **Each facet is an ORDERED ARRAY of
                              `[value, count]` pairs, not an object.**
                              `facetCounts()` returns `[string, number][]`,
                              sorted by count descending -- the order is the
                              point, since the search page renders the
                              commonest values first. This described them as
                              objects keyed by value until #269, which would
                              have had a consumer iterate keys and lose the
                              ordering.
                            required: [soort, bron, doelgroep]
                            properties:
                              soort: { $ref: '#/components/schemas/FacetCounts' }
                              bron: { $ref: '#/components/schemas/FacetCounts' }
                              doelgroep: { $ref: '#/components/schemas/FacetCounts' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/Error'

  /public/use-cases:
    get:
      operationId: listPublicUseCases
      tags: [Public]
      summary: Submitted use cases
      description: |
        Read-only view of the use-case work items in the IOU Architecture
        GitLab project.
      security: []
      parameters:
        - name: state
          in: query
          description: |
            Any value other than `closed` is treated as `opened`, so this
            operation never answers 400 for this parameter.
          schema: { type: string, enum: [opened, closed], default: opened }
      responses:
        '200':
          description: The work items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: GitLab integration is not configured on this server.
          $ref: '#/components/responses/Error'
        '500':
          description: |
            GitLab was reachable but the listing failed
            (`USE_CASES_FETCH_FAILED`).
          $ref: '#/components/responses/Error'

  /public/use-case:
    post:
      operationId: submitPublicUseCase
      tags: [Public]
      summary: Submit a use case
      description: |
        Creates a work item in the IOU Architecture GitLab project. Open to
        external contributors, who have no GitLab account of their own.

        Rate limited to 10 requests per 15 minutes per IP. Requires a solved
        ALTCHA token in `altcha` **when the server has an ALTCHA key
        configured**; where it does not, the check is skipped.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title:
                  type: string
                  description: Issue title. Prefixed with `[Use Case]` server-side.
                description:
                  type: string
                  description: Full Markdown body.
                altcha:
                  type: string
                  description: A solved ALTCHA token from `/public/altcha/challenge`.
      responses:
        '201':
          description: The work item was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      iid: { type: integer, description: The work item's number. }
                      web_url: { type: string, format: uri }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            `title` or `description` missing or blank (`USE_CASE_INVALID`), or
            ALTCHA verification failed (`ALTCHA_MISSING`, `ALTCHA_INVALID`,
            `ALTCHA_ERROR`).
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: GitLab is not configured on this server.
          $ref: '#/components/responses/Error'
        '502':
          description: GitLab was unreachable or rejected the request.
          $ref: '#/components/responses/Error'

  /public/upload-file:
    post:
      operationId: uploadPublicFile
      tags: [Public]
      summary: Upload an attachment for a use-case submission
      description: |
        Uploads one file to the GitLab project and returns the Markdown
        reference to embed in a later `POST /public/use-case` body.

        **Limits, enforced server-side:** at most 10 MB, and the file must match
        both an allowed MIME type and an allowed extension —
        `jpg/jpeg, png, gif, webp, svg, pdf, txt, doc, docx, odt, xls, xlsx,
        xml`. Executables, scripts and HTML are rejected. A file failing the
        filter arrives as no file at all, so it answers `NO_FILE`.

        Rate limited to 10 requests per 15 minutes per IP. No ALTCHA check.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The attachment. Maximum 10 MB.
      responses:
        '200':
          description: The upload's Markdown reference.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: No file was provided, or it failed the type filter (`NO_FILE`).
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: GitLab integration is not configured on this server.
          $ref: '#/components/responses/Error'
        '502':
          description: GitLab was unreachable or rejected the upload.
          $ref: '#/components/responses/Error'

  /public/feedback:
    post:
      operationId: submitPublicFeedback
      tags: [Public]
      summary: Submit feedback, with optional screenshots
      description: |
        Creates a work item in the IOU Architecture GitLab project. Screenshots
        are uploaded to GitLab first and embedded in the body as Markdown.

        **Limits:** up to 5 files, 10 MB each, **images only** — a non-image is
        dropped by the filter rather than rejected with an error.

        Rate limited to 10 requests per 15 minutes per IP. Requires a solved
        ALTCHA token when the server has an ALTCHA key configured.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, contact, description]
              properties:
                name: { type: string }
                org: { type: string, description: Organisation. Optional. }
                role: { type: string, description: The submitter's role. Optional. }
                contact: { type: string, description: How to reach the submitter. }
                description: { type: string, description: The feedback itself. }
                altcha:
                  type: string
                  description: A solved ALTCHA token from `/public/altcha/challenge`.
                screenshots:
                  type: array
                  description: Up to 5 images, 10 MB each. Non-images are dropped.
                  items: { type: string, format: binary }
      responses:
        '201':
          description: The work item was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            `name`, `contact` or `description` missing or blank
            (`MISSING_FIELDS`), or ALTCHA verification failed.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: GitLab integration is not configured on this server.
          $ref: '#/components/responses/Error'
        '502':
          description: GitLab was unreachable or rejected the request.
          $ref: '#/components/responses/Error'

  # ── /v1/media-aggregator ──────────────────────────────────────────────────
  #
  # NOT unconditionally public, unlike everything above, and NOT using the
  # { success, data } envelope either. Both differences are in the handlers:
  #
  #   authorized(req) -> if MEDIA_AGGREGATOR_ACCEPT_KEY is unset, everything is
  #   allowed ("open in dev"); when it is set, /search requires
  #   `Authorization: Bearer <key>` and answers 401 otherwise.
  #
  # /health carries no such check at all -- only /search does.

  /media-aggregator/search:
    get:
      operationId: searchMediaAggregator
      tags: [Media aggregator]
      summary: Search aggregated media articles
      description: |
        The PA cockpit's only dependency on the aggregator.

        **Authentication is conditional.** When the server sets
        `MEDIA_AGGREGATOR_ACCEPT_KEY`, a matching bearer token is required and a
        mismatch answers 401. When it is unset the operation is open — the
        development default, intended for loopback only.

        Answers a bare `{ articles }` object, not the `{ success, data }`
        envelope the rest of this API uses.
      security:
        - {}
        - mediaAggregatorKey: []
      parameters:
        - name: q
          in: query
          description: Free-text query. Absent means unfiltered.
          schema: { type: string, default: '' }
        - name: region
          in: query
          schema: { type: string, default: '' }
        - name: sort
          in: query
          schema: { type: string, default: 'published_at:desc' }
        - name: top
          in: query
          description: Maximum articles to return.
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Matching articles.
          content:
            application/json:
              schema:
                type: object
                required: [articles]
                properties:
                  articles:
                    type: array
                    items:
                      type: object
                      description: An aggregated article.
                      additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            The bearer token was missing or did not match
            `MEDIA_AGGREGATOR_ACCEPT_KEY` (`UNAUTHORIZED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          description: The search failed (`SEARCH_FAILED`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /media-aggregator/health:
    get:
      operationId: getMediaAggregatorHealth
      tags: [Media aggregator]
      summary: Aggregator cache health
      description: |
        Reports whether the aggregator can read its store, and how many articles
        are cached. Unlike `/media-aggregator/search`, this carries no
        authentication check at all.

        Distinct from `/v1/health`, which answers for the service as a whole.
      security: []
      responses:
        '200':
          description: The store is readable.
          content:
            application/json:
              schema:
                type: object
                required: [ok, cached]
                properties:
                  ok: { type: boolean, const: true }
                  cached:
                    type: integer
                    description: Articles currently held.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '503':
          description: The store could not be read (`STORE_UNAVAILABLE`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  # ── /v1/process, /v1/decision, /v1/task ───────────────────────────────────
  #
  # The Operaton execution core. Unlike the public surface, EVERY operation here
  # is authenticated and organisation-scoped: all three routers apply
  # jwtMiddleware and tenantMiddleware at the mount, so the document-level
  # bearerAuth applies with no per-operation override.
  #
  # ORGANISATION ACCESS, settled in #218 and implemented in
  # src/auth/tenant-access.ts, which is the only place these decisions are made:
  #
  #   - The `municipality` process variable is the ONE label access is decided
  #     by. Operaton's own task.tenantId is read by no check.
  #   - 403 TENANT_MISMATCH means the resource belongs to another organisation,
  #     or carries no label at all. Failing closed on a missing label is
  #     deliberate.
  #   - The five process READS also admit the case's own applicant, so a citizen
  #     can follow a case an organisation is handling for them. DELETE does not:
  #     it admits the owning organisation alone.
  #   - 403 FORBIDDEN is now only for ROLE refusals. The two are different
  #     answers to different questions and no longer share a code.

  /process/{key}/start:
    post:
      operationId: startProcess
      tags: [Process]
      summary: Start a process instance
      description: |
        Starts the process deployed under the caller's own organisation.

        **Which organisation gets the case** depends on who is asking:

        - **Staff** may only start a process deployed under their own
          organisation. Starting another's answers `403 TENANT_MISMATCH`.
        - **Citizens** are not refused. Their case is assigned to the
          organisation the process is deployed under, and `originTenantId`
          records their own.

        Every instance is stamped with two variables that cannot be changed
        afterwards: `municipality` (the owning organisation, which every access
        check enforces) and `originTenantId` (the caller's organisation at
        start).

        A minted `businessKey` is prefixed with the OWNING organisation, so
        the case's human-facing handle names whoever is handling it (#234). A
        caller-supplied `businessKey` is kept exactly as given — a RIP phase
        inherits the key its R2.1 run minted, so every phase of one project
        shares it. Either way the key grants nothing: access runs on
        `municipality` alone.
      parameters:
        - $ref: '#/components/parameters/ProcessKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessKey:
                  type: string
                  description: |
                    Optional. When absent the service mints one, prefixed with the
                    OWNING organisation. When supplied it is kept verbatim, which is
                    how a RIP phase inherits the key its R2.1 run minted (#234).
                variables:
                  $ref: '#/components/schemas/PlainVariableMap'
      responses:
        '201':
          description: The instance was started.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ProcessStartResult' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '409':
          $ref: '#/components/responses/AmbiguousDeployment'
        '500':
          description: |
            Operaton refused the start (`PROCESS_START_FAILED`). Two extension
            members say why: `details`, Operaton's own message, and `engine`,
            the base URL of the engine that refused. (`engine` was
            `error.instance` before #216; `instance` is now the request path.)
          $ref: '#/components/responses/Error'

  /process/available:
    get:
      operationId: getAvailableCitizenServices
      tags: [Process]
      summary: The citizen services the caller may start
      description: |
        Derived from where each citizen service's process is deployed (#344):
        an own-tenant service when it is deployed under the caller's tenant,
        a cross-tenant service when it is deployed under exactly one tenant.
        An untenanted deployment never counts. Citizens only.
      responses:
        '200':
          description: The service ids, in registry order.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [services]
                    properties:
                      services:
                        type: array
                        items:
                          type: string
                          enum: [zorgtoeslag, vergunningen, subsidies, heusdenpas]
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not a citizen (`FORBIDDEN`).
          $ref: '#/components/responses/Error'
        '503':
          description: Operaton could not be asked (`SERVICES_UNAVAILABLE`).
          $ref: '#/components/responses/Error'

  /process/history:
    get:
      operationId: getProcessHistory
      tags: [Process]
      summary: Completed instances for one applicant
      description: |
        Requires `applicantId` — there is no unfiltered history.

        Restricted by ROLE, not by organisation, so it answers `403 FORBIDDEN`
        rather than `TENANT_MISMATCH`:

        - a citizen may request only their own history;
        - a caller who is neither a citizen nor a caseworker is refused
          outright.
      parameters:
        - name: applicantId
          in: query
          required: true
          description: The applicant whose history to return.
          schema: { type: string }
      responses:
        '200':
          description: The applicant's completed instances.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items:
                      type: object
                      description: A historic process instance as Operaton reports it.
                      additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`applicantId` was not supplied (`VALIDATION_ERROR`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            A role refusal (`FORBIDDEN`): a citizen asking for another
            applicant's history, or a caller who is neither citizen nor
            caseworker.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /process/{id}/status:
    get:
      operationId: getProcessStatus
      tags: [Process]
      summary: Whether an instance is running
      description: Admits the owning organisation and the case's own applicant.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The instance.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ProcessStatus' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: No such instance (`PROCESS_NOT_FOUND`).
          $ref: '#/components/responses/Error'

  /process/{id}/variables:
    get:
      operationId: getProcessVariables
      tags: [Process]
      summary: Current variables of a running instance
      description: |
        Admits the owning organisation and the case's own applicant.

        Values are returned PLAIN — Operaton's `{value, type}` wrapper is
        unwrapped. Requests that SET variables use the wrapped form; see
        `OperatonVariableMap`.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The variables.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PlainVariableMap' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: No such instance (`PROCESS_NOT_FOUND`).
          $ref: '#/components/responses/Error'

  /process/{id}/historic-variables:
    get:
      operationId: getProcessHistoricVariables
      tags: [Process]
      summary: Variables of a finished instance
      description: |
        The same shape as the live read, for an instance that has ended.
        Admits the owning organisation and the case's own applicant.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The variables.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PlainVariableMap' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: '`HISTORIC_VARIABLES_FAILED`.'
          $ref: '#/components/responses/Error'

  /process/{id}/activity-history:
    get:
      operationId: getProcessActivityHistory
      tags: [Process]
      summary: Which activities an instance has passed through
      description: Admits the owning organisation and the case's own applicant.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The activities, in Operaton's order.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityHistoryEntry' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: '`ACTIVITY_HISTORY_FAILED`.'
          $ref: '#/components/responses/Error'

  /process/{id}/lineage:
    get:
      operationId: getProcessLineage
      tags: [Process]
      summary: The instance's process and the instance that called it
      description: |
        Where an instance sits in a call chain: its own process and, for a
        subprocess started by a call activity, the calling instance
        (`superProcessInstanceId`, null at the top). Read from history, so it
        also answers for ended instances. Admits the owning organisation and
        the case's own applicant.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The lineage.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ProcessLineage' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: No such instance (`PROCESS_NOT_FOUND`).
          $ref: '#/components/responses/Error'
        '500':
          description: '`PROCESS_LINEAGE_FAILED`.'
          $ref: '#/components/responses/Error'

  /process/definition/key/{key}/swimlane:
    get:
      operationId: getProcessDefinitionSwimlaneByKey
      tags: [Process]
      summary: A process's model, as lanes, nodes and edges
      description: |
        The Infra-board's phase model (`/rip/phases/{code}/model`) for any
        process, keyed on its own process key, which is also the model's
        `phaseCode`. Resolved under the caller's organisation, falling back
        to a deployment without one, so another organisation's deployment is
        never reached. Draws the newest deployed version of the key.

        Carries what the caseworker process view needs: `script`, `rule` and
        `call` nodes with their `dmn` / `calls` / `formRef`, each lane's
        `candidateGroups`, and each node's `awbPhase` when the BPMN marks
        phases with `ronl:awbPhase`. A process without a laneSet answers
        `lanes: []`.
      parameters:
        - name: key
          in: path
          required: true
          description: The process definition key, e.g. `AwbShellProcess`.
          schema: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_.-]{0,254}$' }
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [phaseCode, lanes, nodes, edges]
                        properties:
                          phaseCode: { type: string }
                          processKey: { type: string }
                          processName: { type: string }
                          lanes:
                            { type: array, items: { type: object, additionalProperties: true } }
                          nodes:
                            { type: array, items: { type: object, additionalProperties: true } }
                          edges:
                            { type: array, items: { type: object, additionalProperties: true } }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: The key is not a process key (`INVALID_PROCESS_KEY`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            No deployment of the key under the caller's organisation, nor one
            without an organisation (`PROCESS_DEFINITION_NOT_FOUND`).
          $ref: '#/components/responses/Error'
        '500':
          description: '`SWIMLANE_MODEL_FAILED`.'
          $ref: '#/components/responses/Error'

  /process/{instanceId}/decision-document:
    get:
      operationId: getProcessDecisionDocument
      tags: [Process]
      summary: The decision document generated for a case
      description: |
        Admits the owning organisation and the case's own applicant. Most
        processes have no document template, in which case this answers 404
        rather than an empty document.

        **This operation does not use the `{ success, data }` envelope.** It
        answers `{ success, template }` -- `process.routes.ts` sends
        `res.json({ success: true, template })`. Published as `data` until
        #214, which is the kind of error only reading the handler finds: no
        test ever named the field.

        The value is the template WITH ITS BINDINGS, not a rendered document.
        Nothing here substitutes the placeholders.
      parameters:
        - name: instanceId
          in: path
          required: true
          description: The process instance id.
          schema: { type: string }
      responses:
        '200':
          description: The document template.
          content:
            application/json:
              schema:
                type: object
                required: [success, template]
                properties:
                  success: { type: boolean, const: true }
                  template: { $ref: '#/components/schemas/DocumentTemplate' }
