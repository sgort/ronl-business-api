            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`DECISION_EVALUATION_FAILED`.'
          $ref: '#/components/responses/Error'

