# packages/backend/openapi/openapi.yaml
#
# The published contract for the RONL Business API (#200). Hand-written, as in
# linked-data-explorer: this backend carries no decorators or schema
# annotations to generate from, and generating would mean adding them to 130
# handlers before anything could be published.
#
# Served as JSON at /v1/openapi.json. scripts/build-openapi.cjs builds
# openapi.json from this file and sets info.version from package.json, so the
# version is never edited here and never drifts from the release.
#
# EVERY /v1 operation must appear here or in openapi/pending.json:
# src/openapi/coverage.test.ts fails when a served operation is in neither, and
# when a documented operation is not served. pending.json may only shrink.
#
# After editing, run `npm run build:openapi` and restart the dev server -- the
# document is read once at module load, so a running process will not pick it
# up.
openapi: '3.1.0'

info:
  title: RONL Business API
  # NO `version` here, deliberately. scripts/build-openapi.cjs sets it from
  # package.json and REFUSES TO BUILD if this file sets one, so the published
  # document and the release can never disagree.
  summary: Process, decision and document services for Regels.overheid.nl
  contact:
    name: Steven Gort
    email: steven.gort@ictu.nl
    url: https://iou-architectuur.open-regels.nl/
  description: |
    Business API behind Regels.overheid.nl: Operaton process and decision
    execution, task handling, document generation and signing, and the
    machine-to-machine surface consumed outside the browser applications.

    ## Authentication

    Most operations require a Keycloak-issued JWT as a bearer token, applied by
    `jwtMiddleware` inside each router rather than at the mount. A tenant is
    derived from the token and enforced per operation; some operations
    additionally require a role.

    The unauthenticated surface is deliberate and small: `/v1/health`,
    `/v1/openapi.json`, `/v1/public`, `/v1/media-aggregator`, and the ValidSign
    callback, which carries no token because ValidSign does not send one.

    ## Error responses

    4xx and 5xx answer this service's own envelope,
    `{ "success": false, "error": { "code", "message" } }` -- NOT the
    `application/problem+json` of RFC 9457 that the NL API Design Rules
    require. That deviation is recorded as a Spectral exception rather than
    hidden, and migrating to problem details is tracked separately: it is a
    breaking change for every consumer, so it is not folded into publishing a
    description of what the API answers today.

    ## Coverage

    This document is being written per mount group. Operations not yet
    described are listed in `openapi/pending.json`, which only shrinks. A
    consumer should read an absent operation as undocumented, not as absent
    from the API.

# The major version lives in the server URL, so every path below is written
# without its /v1 prefix -- nlgov:include-major-version-in-uri requires the
# version in the URI, and putting it here rather than on 130 paths is how
# linked-data-explorer does it too.
servers:
  - url: https://api.open-regels.nl/v1
    description: Production
  - url: https://acc.api.open-regels.nl/v1
    description: Acceptance

tags:
  - name: Health
    description: Liveness, readiness and dependency checks. Unauthenticated.
  - name: Discovery
    description: What this service is and where its contract lives.
  - name: Public
    description: |
      The unauthenticated citizen-facing surface. Read operations are cached;
      the three write operations are rate limited and ALTCHA-protected.
  - name: Process
    description: |
      Starting, following and cancelling Operaton process instances. Every
      operation is organisation-scoped; the five instance reads also admit the
      case's own applicant.
  - name: Decision
    description: |
      DMN decision definitions and evaluation. Definitions are templates, not
      cases, so these carry no organisation check.
  - name: Task
    description: |
      User tasks. Organisation-scoped throughout, with no applicant exception:
      a task is work for staff, not a view of the case.
  - name: Documents
    description: |
      The eDOCS document library. A proxy onto an external system, so failures
      are 502 rather than 500, and responses carry a `timestamp`.
  - name: Delivery
    description: |
      Doccle delivery. Same envelope and failure model as Documents.
  - name: Signing
    description: |
      ValidSign. Two routers on one mount with opposite security: the callback
      and ceremony routes are unauthenticated and some answer HTML, while the
      three task operations are organisation-checked.
  - name: Policy analysis
    description: |
      Signals, dossiers, saved searches and the curation board. Every
      operation needs the `public-affairs` realm role on top of a valid
      token. Dossiers and searches are organisation-scoped; signals are not.
  - name: Media aggregator
    description: |
      Aggregated media articles for the PA cockpit. Conditionally
      authenticated, and the one group not using this API's response envelope.

paths:
  /openapi.json:
    get:
      operationId: getOpenApiDocument
      tags: [Discovery]
      summary: This API's OpenAPI description
      description: |
        Returns this document. Served with fully open CORS so a browser-based
        viewer on any origin can fetch it, as `/core/publish-openapi` requires.
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
                description: An OpenAPI 3.1 document.
                additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          $ref: '#/components/responses/Error'

  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service health and dependency latency
      description: |
        Reports the running build and the reachability of Operaton, Keycloak
        and the cache.

        Answers **503** when any dependency is down, with the same body shape
        and `status: degraded`. `success` mirrors that: it is `false` on a 503.
      security: []
      responses:
        '200':
          description: All dependencies are up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '503':
          description: A dependency is down, or the check itself failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Liveness probe
      description: |
        Answers 200 whenever the process is running. Checks no dependency, so
        it stays 200 while the service is degraded -- use `/health/ready` to
        decide whether to send traffic.
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    required: [status, timestamp]
                    properties:
                      status:
                        type: string
                        const: alive
                      timestamp:
                        type: string
                        format: date-time
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: |
        Answers 200 when the service can accept traffic, and 503 when it
        cannot -- today that means Operaton is unavailable.
      security: []
      responses:
        '200':
          description: Ready to accept traffic.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    const: false
                  data:
                    type: object
                    required: [status, timestamp]
                    properties:
                      status:
                        type: string
                        const: not ready
                      reason:
                        type: string
                        description: Which dependency made it not ready.
                      timestamp:
                        type: string
                        format: date-time
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /health/external:
    get:
      operationId: getExternalHealth
      tags: [Health]
      summary: Reachability of the external services this API depends on
      description: |
        HEAD-probes CPRMV, TriplyDB and the Linked Data Explorer with a 5 second
        timeout each, and reports status and latency per target.

        Always answers 200: an unreachable target is reported in the body as
        `down`, not as a failure of this endpoint.
      security: []
      responses:
        '200':
          description: Probe results, one entry per target.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, timestamp]
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/DependencyStatus'
                  timestamp:
                    type: string
                    format: date-time
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  # ── /v1/public ────────────────────────────────────────────────────────────
  #
  # Every operation below answers without a token. The three WRITE operations
  # additionally pass through publicWriteLimiter: 10 requests per 15 minutes per
  # IP, answering 429 with the usual envelope and a RATE_LIMIT_EXCEEDED code.
  #
  # `meta.generatedAt` on the read operations is the moment the response was
  # built, not the moment the upstream data was fetched -- these services cache.

  /public/altcha/challenge:
    get:
      operationId: getAltchaChallenge
      tags: [Public]
      summary: Issue a proof-of-work challenge
      description: |
        Issues a fresh ALTCHA challenge for the public write forms. The solved
        token is sent back as the `altcha` field on `POST /public/feedback` and
        `POST /public/use-case`.

        **This is the one public operation that does NOT use the
        `{ success, data }` envelope** -- it answers the ALTCHA challenge object
        directly, because the widget consumes it as-is.

        When the server has no ALTCHA HMAC key configured the verification step
        on the write operations is skipped entirely, and this endpoint answers
        503.
      security: []
      responses:
        '200':
          description: A challenge for the ALTCHA widget.
          content:
            application/json:
              schema:
                type: object
                description: An ALTCHA challenge, passed to the widget unaltered.
                additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '503':
          description: ALTCHA is not configured on this server.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /public/nieuws:
    get:
      operationId: listPublicNieuws
      tags: [Public]
      summary: Government news items
      security: []
      parameters:
        - name: limit
          in: query
          description: 'Items to return. Values above 20 are clamped to 20.'
          schema: { type: integer, default: 10, minimum: 1, maximum: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: A page of news items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicPagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/NieuwsItem' }
                          pagination: { $ref: '#/components/schemas/PublicPagination' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          $ref: '#/components/responses/Error'

  /public/nieuws/{slug}:
    get:
      operationId: getPublicNieuwsItem
      tags: [Public]
      summary: One news item from the federated index
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicSlug'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicIndexItem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '404':
          description: No item of this type with that slug.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /public/berichten:
    get:
      operationId: listPublicBerichten
      tags: [Public]
      summary: Service announcements
      security: []
      parameters:
        - name: limit
          in: query
          description: 'Items to return. Values above 20 are clamped to 20.'
          schema: { type: integer, default: 10, minimum: 1, maximum: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: A page of announcements.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicPagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/BerichtItem' }
                          pagination: { $ref: '#/components/schemas/PublicPagination' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          $ref: '#/components/responses/Error'

  /public/berichten/{id}:
    get:
      operationId: getPublicBericht
      tags: [Public]
      summary: One announcement by id
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: The announcement's id, as returned by the list operation.
          schema: { type: string }
      responses:
        '200':
          description: The announcement.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BerichtItem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '404':
          description: No announcement with that id.
          $ref: '#/components/responses/Error'

  /public/producten-diensten:
    get:
      operationId: listPublicProductenDiensten
      tags: [Public]
      summary: Products and services offered to citizens and businesses
      security: []
      parameters:
        - name: limit
          in: query
          description: 'Items to return. Values above 200 are clamped to 200.'
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        '200':
          description: A page of products and services.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicPagedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/ProductDienstItem' }
                          pagination: { $ref: '#/components/schemas/PublicPagination' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          $ref: '#/components/responses/Error'

  /public/producten/{slug}:
    get:
      operationId: getPublicProduct
      tags: [Public]
      summary: One product from the federated index
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicSlug'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicIndexItem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '404':
          description: No product with that slug.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /public/regelcatalogus:
    get:
      operationId: getPublicRegelcatalogus
      tags: [Public]
      summary: The rule catalogue
      description: |
        Served from a cache. `refresh=true` forces the upstream to be re-read
        rather than serving what is held.
      security: []
      parameters:
        - name: refresh
          in: query
          description: |
            `true` or `1` forces a refresh. Any other value, including absent,
            serves the cached copy.
          schema: { type: string, enum: ['true', '1'] }
      responses:
        '200':
          description: The catalogue, with cache metadata.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [services, organizations, concepts, rules]
                    properties:
                      services: { type: array, items: { type: object, additionalProperties: true } }
                      organizations:
                        { type: array, items: { type: object, additionalProperties: true } }
                      concepts: { type: array, items: { type: object, additionalProperties: true } }
                      rules: { type: array, items: { type: object, additionalProperties: true } }
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/PublicMeta'
                      - type: object
                        required: [cache]
                        properties:
                          cache:
                            type: object
                            description: |
                              Whether this response came from cache, and how old it is.
                              Only this operation reports it.
                            required: [cached, fetchedAt, ageMs]
                            properties:
                              cached: { type: boolean }
                              fetchedAt: { type: string, format: date-time }
                              ageMs: { type: integer }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          $ref: '#/components/responses/Error'

  /public/regels/{slug}:
    get:
      operationId: getPublicRegel
      tags: [Public]
      summary: One rule from the federated index
      security: []
      parameters:
        - $ref: '#/components/parameters/PublicSlug'
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicIndexItem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '404':
          description: No rule with that slug.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /public/processen:
    get:
      operationId: listPublicProcessen
      tags: [Public]
      summary: Publicly visible processes
      security: []
      responses:
        '200':
          description: Every published process.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          $ref: '#/components/responses/Error'

  /public/processen/{key}:
    get:
      operationId: getPublicProces
      tags: [Public]
      summary: One process by its definition key
      security: []
      parameters:
        - name: key
          in: path
          required: true
          description: |
            The process definition key. Any non-empty value is a legitimate
            lookup; a miss is a 404, never a 400.
          schema: { type: string }
      responses:
        '200':
          description: The process.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '404':
          description: No published process with that key.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /public/zoeken:
    get:
      operationId: searchPublicIndex
      tags: [Public]
      summary: Search the federated public index
      description: |
        Searches across all five item types. Every term is regex-escaped before
        matching, so no value of `q` is invalid and this operation never answers
        400 -- an unmatched query returns an empty list.

        `soort`, `bron` and `doelgroep` are comma-separated lists.
      security: []
      parameters:
        - name: q
          in: query
          description: Free-text query. Absent or empty returns the unfiltered index.
          schema: { type: string }
        - name: soort
          in: query
          description: 'Comma-separated item types, e.g. `regel,product`.'
          schema: { type: string }
        - name: bron
          in: query
          description: Comma-separated source organisations.
          schema: { type: string }
        - name: doelgroep
          in: query
          description: Comma-separated audiences.
          schema: { type: string }
        - name: sort
          in: query
          description: 'Relevance, date, or alphabetical.'
          schema: { type: string, enum: [rel, date, az] }
      responses:
        '200':
          description: Matching items, with facet counts.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total, facets]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PublicIndexItem' }
                          total:
                            type: integer
                            description: Matches before any paging.
                          facets:
                            type: object
                            description: Counts per facet value, for the current result set.
                            required: [soort, bron, doelgroep]
                            properties:
                              soort: { type: object, additionalProperties: { type: integer } }
                              bron: { type: object, additionalProperties: { type: integer } }
                              doelgroep: { type: object, additionalProperties: { type: integer } }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          $ref: '#/components/responses/Error'

  /public/use-cases:
    get:
      operationId: listPublicUseCases
      tags: [Public]
      summary: Submitted use cases
      description: |
        Read-only view of the use-case work items in the IOU Architecture
        GitLab project.
      security: []
      parameters:
        - name: state
          in: query
          description: |
            Any value other than `closed` is treated as `opened`, so this
            operation never answers 400 for this parameter.
          schema: { type: string, enum: [opened, closed], default: opened }
      responses:
        '200':
          description: The work items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PublicItemEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '503':
          description: GitLab integration is not configured on this server.
          $ref: '#/components/responses/Error'
        '500':
          description: |
            GitLab was reachable but the listing failed
            (`USE_CASES_FETCH_FAILED`).
          $ref: '#/components/responses/Error'

  /public/use-case:
    post:
      operationId: submitPublicUseCase
      tags: [Public]
      summary: Submit a use case
      description: |
        Creates a work item in the IOU Architecture GitLab project. Open to
        external contributors, who have no GitLab account of their own.

        Rate limited to 10 requests per 15 minutes per IP. Requires a solved
        ALTCHA token in `altcha` **when the server has an ALTCHA key
        configured**; where it does not, the check is skipped.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                title:
                  type: string
                  description: Issue title. Prefixed with `[Use Case]` server-side.
                description:
                  type: string
                  description: Full Markdown body.
                altcha:
                  type: string
                  description: A solved ALTCHA token from `/public/altcha/challenge`.
      responses:
        '201':
          description: The work item was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      iid: { type: integer, description: The work item's number. }
                      web_url: { type: string, format: uri }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            `title` or `description` missing or blank (`USE_CASE_INVALID`), or
            ALTCHA verification failed (`ALTCHA_MISSING`, `ALTCHA_INVALID`,
            `ALTCHA_ERROR`).
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: GitLab is not configured on this server.
          $ref: '#/components/responses/Error'
        '502':
          description: GitLab was unreachable or rejected the request.
          $ref: '#/components/responses/Error'

  /public/upload-file:
    post:
      operationId: uploadPublicFile
      tags: [Public]
      summary: Upload an attachment for a use-case submission
      description: |
        Uploads one file to the GitLab project and returns the Markdown
        reference to embed in a later `POST /public/use-case` body.

        **Limits, enforced server-side:** at most 10 MB, and the file must match
        both an allowed MIME type and an allowed extension —
        `jpg/jpeg, png, gif, webp, svg, pdf, txt, doc, docx, odt, xls, xlsx,
        xml`. Executables, scripts and HTML are rejected. A file failing the
        filter arrives as no file at all, so it answers `NO_FILE`.

        Rate limited to 10 requests per 15 minutes per IP. No ALTCHA check.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The attachment. Maximum 10 MB.
      responses:
        '200':
          description: The upload's Markdown reference.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: No file was provided, or it failed the type filter (`NO_FILE`).
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: GitLab integration is not configured on this server.
          $ref: '#/components/responses/Error'
        '502':
          description: GitLab was unreachable or rejected the upload.
          $ref: '#/components/responses/Error'

  /public/feedback:
    post:
      operationId: submitPublicFeedback
      tags: [Public]
      summary: Submit feedback, with optional screenshots
      description: |
        Creates a work item in the IOU Architecture GitLab project. Screenshots
        are uploaded to GitLab first and embedded in the body as Markdown.

        **Limits:** up to 5 files, 10 MB each, **images only** — a non-image is
        dropped by the filter rather than rejected with an error.

        Rate limited to 10 requests per 15 minutes per IP. Requires a solved
        ALTCHA token when the server has an ALTCHA key configured.
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, contact, description]
              properties:
                name: { type: string }
                org: { type: string, description: Organisation. Optional. }
                role: { type: string, description: The submitter's role. Optional. }
                contact: { type: string, description: How to reach the submitter. }
                description: { type: string, description: The feedback itself. }
                altcha:
                  type: string
                  description: A solved ALTCHA token from `/public/altcha/challenge`.
                screenshots:
                  type: array
                  description: Up to 5 images, 10 MB each. Non-images are dropped.
                  items: { type: string, format: binary }
      responses:
        '201':
          description: The work item was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            `name`, `contact` or `description` missing or blank
            (`MISSING_FIELDS`), or ALTCHA verification failed.
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: GitLab integration is not configured on this server.
          $ref: '#/components/responses/Error'
        '502':
          description: GitLab was unreachable or rejected the request.
          $ref: '#/components/responses/Error'

  # ── /v1/media-aggregator ──────────────────────────────────────────────────
  #
  # NOT unconditionally public, unlike everything above, and NOT using the
  # { success, data } envelope either. Both differences are in the handlers:
  #
  #   authorized(req) -> if MEDIA_AGGREGATOR_ACCEPT_KEY is unset, everything is
  #   allowed ("open in dev"); when it is set, /search requires
  #   `Authorization: Bearer <key>` and answers 401 otherwise.
  #
  # /health carries no such check at all -- only /search does.

  /media-aggregator/search:
    get:
      operationId: searchMediaAggregator
      tags: [Media aggregator]
      summary: Search aggregated media articles
      description: |
        The PA cockpit's only dependency on the aggregator.

        **Authentication is conditional.** When the server sets
        `MEDIA_AGGREGATOR_ACCEPT_KEY`, a matching bearer token is required and a
        mismatch answers 401. When it is unset the operation is open — the
        development default, intended for loopback only.

        Answers a bare `{ articles }` object, not the `{ success, data }`
        envelope the rest of this API uses.
      security:
        - {}
        - mediaAggregatorKey: []
      parameters:
        - name: q
          in: query
          description: Free-text query. Absent means unfiltered.
          schema: { type: string, default: '' }
        - name: region
          in: query
          schema: { type: string, default: '' }
        - name: sort
          in: query
          schema: { type: string, default: 'published_at:desc' }
        - name: top
          in: query
          description: Maximum articles to return.
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Matching articles.
          content:
            application/json:
              schema:
                type: object
                required: [articles]
                properties:
                  articles:
                    type: array
                    items:
                      type: object
                      description: An aggregated article.
                      additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          description: |
            The bearer token was missing or did not match
            `MEDIA_AGGREGATOR_ACCEPT_KEY`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAggregatorError' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          description: The search failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAggregatorError' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /media-aggregator/health:
    get:
      operationId: getMediaAggregatorHealth
      tags: [Media aggregator]
      summary: Aggregator cache health
      description: |
        Reports whether the aggregator can read its store, and how many articles
        are cached. Unlike `/media-aggregator/search`, this carries no
        authentication check at all.

        Distinct from `/v1/health`, which answers for the service as a whole.
      security: []
      responses:
        '200':
          description: The store is readable.
          content:
            application/json:
              schema:
                type: object
                required: [ok, cached]
                properties:
                  ok: { type: boolean, const: true }
                  cached:
                    type: integer
                    description: Articles currently held.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '503':
          description: The store could not be read.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: false }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  # ── /v1/process, /v1/decision, /v1/task ───────────────────────────────────
  #
  # The Operaton execution core. Unlike the public surface, EVERY operation here
  # is authenticated and organisation-scoped: all three routers apply
  # jwtMiddleware and tenantMiddleware at the mount, so the document-level
  # bearerAuth applies with no per-operation override.
  #
  # ORGANISATION ACCESS, settled in #218 and implemented in
  # src/auth/tenant-access.ts, which is the only place these decisions are made:
  #
  #   - The `municipality` process variable is the ONE label access is decided
  #     by. Operaton's own task.tenantId is read by no check.
  #   - 403 TENANT_MISMATCH means the resource belongs to another organisation,
  #     or carries no label at all. Failing closed on a missing label is
  #     deliberate.
  #   - The five process READS also admit the case's own applicant, so a citizen
  #     can follow a case an organisation is handling for them. DELETE does not:
  #     it admits the owning organisation alone.
  #   - 403 FORBIDDEN is now only for ROLE refusals. The two are different
  #     answers to different questions and no longer share a code.

  /process/{key}/start:
    post:
      operationId: startProcess
      tags: [Process]
      summary: Start a process instance
      description: |
        Starts the process deployed under the caller's own organisation.

        **Which organisation gets the case** depends on who is asking:

        - **Staff** may only start a process deployed under their own
          organisation. Starting another's answers `403 TENANT_MISMATCH`.
        - **Citizens** are not refused. Their case is assigned to the
          organisation the process is deployed under, and `originTenantId`
          records their own.

        Every instance is stamped with two variables that cannot be changed
        afterwards: `municipality` (the owning organisation, which every access
        check enforces) and `originTenantId` (the caller's organisation at
        start).

        A minted `businessKey` is prefixed with the OWNING organisation, so
        the case's human-facing handle names whoever is handling it (#234). A
        caller-supplied `businessKey` is kept exactly as given — a RIP phase
        inherits the key its R2.1 run minted, so every phase of one project
        shares it. Either way the key grants nothing: access runs on
        `municipality` alone.
      parameters:
        - $ref: '#/components/parameters/ProcessKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                businessKey:
                  type: string
                  description: |
                    Optional. When absent the service mints one, prefixed with the
                    OWNING organisation. When supplied it is kept verbatim, which is
                    how a RIP phase inherits the key its R2.1 run minted (#234).
                variables:
                  $ref: '#/components/schemas/OperatonVariableMap'
      responses:
        '201':
          description: The instance was started.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ProcessStartResult' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '409':
          $ref: '#/components/responses/AmbiguousDeployment'
        '500':
          description: Operaton refused the start (`PROCESS_START_FAILED`).
          $ref: '#/components/responses/Error'

  /process/history:
    get:
      operationId: getProcessHistory
      tags: [Process]
      summary: Completed instances for one applicant
      description: |
        Requires `applicantId` — there is no unfiltered history.

        Restricted by ROLE, not by organisation, so it answers `403 FORBIDDEN`
        rather than `TENANT_MISMATCH`:

        - a citizen may request only their own history;
        - a caller who is neither a citizen nor a caseworker is refused
          outright.
      parameters:
        - name: applicantId
          in: query
          required: true
          description: The applicant whose history to return.
          schema: { type: string }
      responses:
        '200':
          description: The applicant's completed instances.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items:
                      type: object
                      description: A historic process instance as Operaton reports it.
                      additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`applicantId` was not supplied (`VALIDATION_ERROR`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            A role refusal (`FORBIDDEN`): a citizen asking for another
            applicant's history, or a caller who is neither citizen nor
            caseworker.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /process/{id}/status:
    get:
      operationId: getProcessStatus
      tags: [Process]
      summary: Whether an instance is running
      description: Admits the owning organisation and the case's own applicant.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The instance.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ProcessStatus' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: No such instance (`PROCESS_NOT_FOUND`).
          $ref: '#/components/responses/Error'

  /process/{id}/variables:
    get:
      operationId: getProcessVariables
      tags: [Process]
      summary: Current variables of a running instance
      description: |
        Admits the owning organisation and the case's own applicant.

        Values are returned PLAIN — Operaton's `{value, type}` wrapper is
        unwrapped. Requests that SET variables use the wrapped form; see
        `OperatonVariableMap`.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The variables.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PlainVariableMap' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: No such instance (`PROCESS_NOT_FOUND`).
          $ref: '#/components/responses/Error'

  /process/{id}/historic-variables:
    get:
      operationId: getProcessHistoricVariables
      tags: [Process]
      summary: Variables of a finished instance
      description: |
        The same shape as the live read, for an instance that has ended.
        Admits the owning organisation and the case's own applicant.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The variables.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PlainVariableMap' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: '`HISTORIC_VARIABLES_FAILED`.'
          $ref: '#/components/responses/Error'

  /process/{id}/activity-history:
    get:
      operationId: getProcessActivityHistory
      tags: [Process]
      summary: Which activities an instance has passed through
      description: Admits the owning organisation and the case's own applicant.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The activities, in Operaton's order.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ActivityHistoryEntry' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: '`ACTIVITY_HISTORY_FAILED`.'
          $ref: '#/components/responses/Error'

  /process/{instanceId}/decision-document:
    get:
      operationId: getProcessDecisionDocument
      tags: [Process]
      summary: The decision document generated for a case
      description: |
        Admits the owning organisation and the case's own applicant. Most
        processes have no document template, in which case this answers 404
        rather than an empty document.
      parameters:
        - name: instanceId
          in: path
          required: true
          description: The process instance id.
          schema: { type: string }
      responses:
        '200':
          description: The generated document.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    description: The rendered document.
                    additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: |
            No document template for this process (`DOCUMENT_NOT_FOUND`). The
            usual answer for a process that generates none.
          $ref: '#/components/responses/Error'
        '500':
          description: '`DOCUMENT_FETCH_FAILED`.'
          $ref: '#/components/responses/Error'

  /process/{key}/start-form:
    get:
      operationId: getProcessStartForm
      tags: [Process]
      summary: The deployed start form for a process
      description: |
        Returns the form-js schema a caller renders to start this process.

        No organisation check: a form is a template, not a case. It can still
        answer `409` when the key is deployed under several organisations and
        none is the caller's, because there is then no form to choose.
      parameters:
        - $ref: '#/components/parameters/ProcessKey'
      responses:
        '200':
          description: The form schema.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/FormSchema' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The process has no deployed start form (`FORM_NOT_FOUND`).
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/AmbiguousDeployment'
        '415':
          description: |
            The deployed form is not a form-js schema — an embedded or external
            form this service cannot serve (`UNSUPPORTED_FORM_TYPE`).
          $ref: '#/components/responses/Error'
        '500':
          description: '`FORM_FETCH_FAILED`.'
          $ref: '#/components/responses/Error'

  /process/{key}/variable-hints:
    get:
      operationId: getProcessVariableHints
      tags: [Process]
      summary: Variable names and types a process expects
      description: |
        **This operation does not use the `{ success, data }` envelope.** It
        answers `{ success, variables }`. Recorded as it is rather than
        normalised, because a consumer reads what the handler sends.
      parameters:
        - $ref: '#/components/parameters/ProcessKey'
      responses:
        '200':
          description: The hints.
          content:
            application/json:
              schema:
                type: object
                required: [success, variables]
                properties:
                  success: { type: boolean, const: true }
                  variables:
                    type: array
                    items:
                      type: object
                      required: [name, type]
                      properties:
                        name: { type: string }
                        type: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`VARIABLE_HINTS_FAILED`.'
          $ref: '#/components/responses/Error'

  /process/{id}:
    delete:
      operationId: deleteProcessInstance
      tags: [Process]
      summary: Cancel a running instance
      description: |
        Admits the OWNING organisation only. Unlike the five reads above, the
        case's own applicant is refused — withdrawing a case is not the same as
        following it.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The instance was cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [message, processInstanceId]
                    properties:
                      message: { type: string }
                      processInstanceId: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: '`PROCESS_DELETE_FAILED`.'
          $ref: '#/components/responses/Error'

  /decision/{key}:
    get:
      operationId: getDecisionDefinition
      tags: [Decision]
      summary: A DMN decision definition
      description: |
        No organisation check: a decision definition is a template, not a case.
      parameters:
        - name: key
          in: path
          required: true
          description: The DMN decision key, for example `TreeFellingDecision`.
          schema: { type: string }
      responses:
        '200':
          description: The definition.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/DecisionDefinition' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such decision (`DECISION_NOT_FOUND`).
          $ref: '#/components/responses/Error'

  /decision/{key}/evaluate:
    post:
      operationId: evaluateDecision
      tags: [Decision]
      summary: Evaluate a DMN decision
      description: |
        Evaluates the decision against the supplied variables and returns
        Operaton's result rows unaltered.

        Input uses Operaton's WRAPPED variable form (`{value, type}`), and the
        output keeps it too — unlike the variable reads elsewhere, which unwrap.
        An input set that matches no rule answers `200` with an empty array, not
        a 404.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables: { $ref: '#/components/schemas/OperatonVariableMap' }
      responses:
        '200':
          description: |
            The matched rules, one object per row. Empty when nothing matched.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items:
                      type: object
                      description: One result row, keyed by output name.
                      additionalProperties:
                        $ref: '#/components/schemas/OperatonVariable'
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`DECISION_EVALUATION_FAILED`.'
          $ref: '#/components/responses/Error'

  /task:
    get:
      operationId: listTasks
      tags: [Task]
      summary: Tasks the caller can work on
      description: |
        Filtered by the caller's organisation AND by their realm roles, which
        map one-to-one to the candidate groups in the BPMN.

        Both filters matter: until #219 only the role filter was applied, so
        this listed tasks that `GET /task/{id}` then refused.
      responses:
        '200':
          description: The caller's tasks.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`TASK_LIST_FAILED`.'
          $ref: '#/components/responses/Error'

  /task/history:
    get:
      operationId: listCompletedTasks
      tags: [Task]
      summary: Tasks the caller has completed
      responses:
        '200':
          description: Completed tasks.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/HistoricTask' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`TASK_HISTORY_FAILED`.'
          $ref: '#/components/responses/Error'

  /task/{id}:
    get:
      operationId: getTask
      tags: [Task]
      summary: One task
      description: |
        Admits the owning organisation only. The applicant exception that
        applies to the process reads does not apply to tasks: a task is work
        for staff, not a view of the case.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Task' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: No such task (`TASK_NOT_FOUND`).
          $ref: '#/components/responses/Error'

  /task/{id}/variables:
    get:
      operationId: getTaskVariables
      tags: [Task]
      summary: Variables visible to a task
      description: |
        The variables of the task's process instance, returned PLAIN. Admits the
        owning organisation only.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The variables.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PlainVariableMap' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: '`TASK_VARIABLES_FAILED`.'
          $ref: '#/components/responses/Error'

  /task/{id}/form-schema:
    get:
      operationId: getTaskFormSchema
      tags: [Task]
      summary: The deployed form for a task
      description: Admits the owning organisation only.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The form schema.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/FormSchema' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: The task has no deployed form (`FORM_NOT_FOUND`).
          $ref: '#/components/responses/Error'
        '415':
          description: |
            The deployed form is not a form-js schema
            (`UNSUPPORTED_FORM_TYPE`).
          $ref: '#/components/responses/Error'
        '500':
          description: '`FORM_FETCH_FAILED`.'
          $ref: '#/components/responses/Error'

  /task/{id}/claim:
    post:
      operationId: claimTask
      tags: [Task]
      summary: Claim a task for the caller
      description: |
        Assigns the task to the calling user. Admits the owning organisation
        only. The body is ignored; the assignee is taken from the token.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The task was claimed.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [taskId, assignee]
                    properties:
                      taskId: { type: string }
                      assignee:
                        type: string
                        description: The Keycloak subject the task is now assigned to.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: '`TASK_CLAIM_FAILED`.'
          $ref: '#/components/responses/Error'

  /task/{id}/complete:
    post:
      operationId: completeTask
      tags: [Task]
      summary: Complete a task
      description: |
        Completes the task with the supplied variables, advancing the process.
        Admits the owning organisation only.

        **Three variables are set once at start and can never be written here**:
        `municipality`, `originTenantId` and `applicantId`. A body containing any
        of them is refused with `400 RESERVED_VARIABLE`, naming the offender —
        rewriting the organisation label would move a case between
        organisations.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables: { $ref: '#/components/schemas/OperatonVariableMap' }
      responses:
        '200':
          description: The task was completed.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [taskId, status]
                    properties:
                      taskId: { type: string }
                      status: { type: string, const: completed }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            The body tried to write `municipality`, `originTenantId` or
            `applicantId` (`RESERVED_VARIABLE`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: |
            Operaton refused the completion (`TASK_COMPLETE_FAILED`) — for
            example when a required form field is missing, or a downstream
            gateway cannot evaluate.
          $ref: '#/components/responses/Error'

  # ── /v1/edocs and /v1/doccle ──────────────────────────────────────────────
  #
  # Both are proxies onto external systems, and both answer a THIRD envelope
  # shape: { success, data, timestamp }. The public surface uses
  # { success, data, meta.generatedAt }, the execution core uses
  # { success, data } alone. Three variants in one API; each is recorded as it
  # is rather than normalised.
  #
  # Both routers apply jwtMiddleware but NOT tenantMiddleware: a document
  # library and a delivery channel are infrastructure, not cases, so there is no
  # organisation label to check. `502` means the upstream refused or could not
  # be reached -- it is the usual failure here, not `500`.
  #
  # ON ACCEPTANCE BOTH RUN IN STUB MODE (`status: "stub"`), so the shapes below
  # were captured from stubs. The envelope and the status codes are the
  # service's own and are real; the payloads a live eDOCS returns may carry more
  # fields than the examples suggest.

  /edocs/status:
    get:
      operationId: getEdocsStatus
      tags: [Documents]
      summary: Whether the document library is reachable
      responses:
        '200':
          description: The library's state, including whether it is stubbed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, library, baseUrl, stubMode, reachable, authenticated]
                        properties:
                          status:
                            {
                              type: string,
                              description: '`stub` when no live library is configured.',
                            }
                          library: { type: string }
                          baseUrl: { type: string }
                          stubMode: { type: boolean }
                          reachable: { type: boolean }
                          authenticated: { type: boolean }
                          latencyMs: { type: integer, description: Present only when measured. }
                          error: { type: string, description: Present only when the check failed. }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /edocs/workspaces:
    get:
      operationId: listEdocsWorkspaces
      tags: [Documents]
      summary: Workspaces in the document library
      responses:
        '200':
          description: The workspaces.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EdocsWorkspace' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/workspaces/ensure:
    post:
      operationId: ensureEdocsWorkspace
      tags: [Documents]
      summary: Create a workspace for a project, or return the existing one
      description: Idempotent — an existing workspace for the project is returned
        rather than duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectNumber, projectName]
              properties:
                projectNumber: { type: string }
                projectName: { type: string }
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [workspaceId, workspaceName, created]
                        properties:
                          workspaceId: { type: string }
                          workspaceName: { type: string }
                          created:
                            type: boolean
                            description: |
                              False when the workspace already existed — this
                              operation is idempotent.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`projectNumber` or `projectName` missing (`MISSING_FIELDS`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/documents:
    post:
      operationId: createEdocsDocument
      tags: [Documents]
      summary: Store a document in the library
      description: |
        The content is sent base64-encoded in the JSON body, not as multipart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentBase64, metadata]
              properties:
                filename: { type: string }
                contentBase64: { type: string, format: byte }
                metadata:
                  type: object
                  required: [docName, department]
                  properties:
                    docName: { type: string }
                    department: { type: string }
                  additionalProperties: true
      responses:
        '200':
          description: |
            The stored document. Note 200, not 201 — this proxies the library's
            own answer.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [documentId, documentNumber]
                        properties:
                          documentId: { type: string }
                          documentNumber:
                            type: string
                            description: The library's own reference for the document.
                          workspaceId:
                            type: [string, 'null']
                            description: Null when the document is not filed in a workspace.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            `filename`, `contentBase64`, `metadata.docName` or
            `metadata.department` missing (`MISSING_FIELDS`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/workspaces/{workspaceId}/documents:
    get:
      operationId: listEdocsWorkspaceDocuments
      tags: [Documents]
      summary: Documents in a workspace
      description: |
        `data` is an OBJECT carrying the workspace id alongside the list, not a
        bare array.
      parameters:
        - $ref: '#/components/parameters/EdocsWorkspaceId'
      responses:
        '200':
          description: The workspace's documents.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [workspaceId, documents]
                        properties:
                          workspaceId: { type: string }
                          documents:
                            type: array
                            items: { $ref: '#/components/schemas/EdocsDocument' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/documents/{documentId}/profile:
    get:
      operationId: getEdocsDocumentProfile
      tags: [Documents]
      summary: A document's metadata profile
      description: |
        The library's own field names, in its own casing (`DOCNAME`,
        `DOCNUMBER`, `APP_ID`). Passed through unaltered rather than mapped, so
        the set of fields depends on the library's configuration.
      parameters:
        - $ref: '#/components/parameters/EdocsDocumentId'
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: The library's profile fields, verbatim.
                        additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/documents/{documentId}/versions:
    get:
      operationId: listEdocsDocumentVersions
      tags: [Documents]
      summary: A document's versions
      description: '`data` wraps the list with the document id, as the workspace read does.'
      parameters:
        - $ref: '#/components/parameters/EdocsDocumentId'
      responses:
        '200':
          description: The versions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [documentId, versions]
                        properties:
                          documentId: { type: string }
                          versions:
                            type: array
                            items:
                              type: object
                              required: [id, version]
                              properties:
                                id: { type: string }
                                version: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/documents/{documentId}/versions/{version}:
    get:
      operationId: getEdocsDocumentVersion
      tags: [Documents]
      summary: The content of one document version
      description: |
        The bytes come back base64-encoded inside the JSON envelope, not as a
        binary body — a caller decodes `data.contentBase64` itself.
      parameters:
        - $ref: '#/components/parameters/EdocsDocumentId'
        - name: version
          in: path
          required: true
          description: The version identifier, as the versions list reports it.
          schema: { type: string }
      responses:
        '200':
          description: The content.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [contentBase64]
                        properties:
                          contentBase64: { type: string, format: byte }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/documents/{documentId}:
    delete:
      operationId: deleteEdocsDocument
      tags: [Documents]
      summary: Remove a document from the library
      parameters:
        - $ref: '#/components/parameters/EdocsDocumentId'
      responses:
        '200':
          description: The document was removed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [documentId, deleted]
                        properties:
                          documentId: { type: string }
                          deleted: { type: boolean }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/workspaces/{workspaceId}:
    delete:
      operationId: deleteEdocsWorkspace
      tags: [Documents]
      summary: Remove a workspace from the library
      parameters:
        - $ref: '#/components/parameters/EdocsWorkspaceId'
      responses:
        '200':
          description: The workspace was removed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [workspaceId, deleted]
                        properties:
                          workspaceId: { type: string }
                          deleted: { type: boolean }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /doccle/status:
    get:
      operationId: getDoccleStatus
      tags: [Delivery]
      summary: Whether the delivery channel is reachable
      responses:
        '200':
          description: The channel's state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, stubMode, reachable]
                        properties:
                          status: { type: string }
                          stubMode: { type: boolean }
                          reachable: { type: boolean }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /doccle/senders/{senderName}/receivers/{externalReference}:
    put:
      operationId: upsertDoccleReceiver
      tags: [Delivery]
      summary: Register or update a receiver
      description: |
        `externalReference` is the sender's own identifier for the recipient.
        Note the spelling differs from the delivery operations below, which use
        `externalReferenceId` for the same thing.
      parameters:
        - $ref: '#/components/parameters/DoccleSenderName'
        - name: externalReference
          in: path
          required: true
          description: The sender's identifier for this receiver.
          schema: { type: string }
      requestBody:
        required: true
        description: |
          The body IS the receiver — it is not wrapped in a `receiver` key.
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
              additionalProperties: true
      responses:
        '200':
          description: The receiver was registered or updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [created]
                        properties:
                          created:
                            type: boolean
                            description: False when the receiver already existed.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`receiver.id` missing (`MISSING_FIELDS`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /doccle/senders/{senderName}/receivers/{externalReferenceId}/documents/{documentId}:
    post:
      operationId: deliverDoccleDocument
      tags: [Delivery]
      summary: Deliver a document to a receiver
      parameters:
        - $ref: '#/components/parameters/DoccleSenderName'
        - $ref: '#/components/parameters/DoccleExternalReferenceId'
        - $ref: '#/components/parameters/DoccleDocumentId'
      requestBody:
        required: true
        description: |
          The body IS the document — it is not wrapped in a `document` key.
        content:
          application/json:
            schema:
              type: object
              required: [documentFile]
              properties:
                documentFile:
                  type: object
                  required: [contentBase64, mimeType]
                  properties:
                    contentBase64: { type: string, format: byte }
                    mimeType: { type: string }
              additionalProperties: true
      responses:
        '200':
          description: The document was delivered.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [documentUri, remPickupUrl]
                        properties:
                          documentUri: { type: string }
                          remPickupUrl:
                            type: string
                            format: uri
                            description: Where the receiver collects the document.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            `document.documentFile.contentBase64` or `.mimeType` missing
            (`MISSING_FIELDS`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /doccle/senders/{senderName}/receivers/{externalReferenceId}/documents/{documentId}/paid:
    post:
      operationId: markDoccleDocumentPaid
      tags: [Delivery]
      summary: Mark a delivered document as paid
      parameters:
        - $ref: '#/components/parameters/DoccleSenderName'
        - $ref: '#/components/parameters/DoccleExternalReferenceId'
        - $ref: '#/components/parameters/DoccleDocumentId'
      responses:
        '200':
          description: |
            The document was marked paid. **This response carries no `data`** —
            just `success` and `timestamp`.
          content:
            application/json:
              schema:
                type: object
                required: [success, timestamp]
                properties:
                  success: { type: boolean, const: true }
                  timestamp: { type: string, format: date-time }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  # ── /v1/validsign ─────────────────────────────────────────────────────────
  #
  # TWO routers answer on this mount, with opposite security, and
  # routes/registry.ts mounts the callback one FIRST because ValidSign sends no
  # token and the authenticated router would reject its callback.
  #
  #   callbackRouter   POST /callback, GET /ceremony/complete,
  #                    GET+POST /stub/ceremony/*        — no bearer token
  #   router           GET /task/{taskId}/spec, /status,
  #                    POST /task/{taskId}/package      — bearer + organisation
  #
  # Unlike eDOCS and Doccle these use the PLAIN { success, data } envelope, with
  # no `timestamp`. Three ceremony routes answer text/html rather than JSON.
  #
  # The three authenticated operations gained an organisation check in #227.
  # They had none, and /package could send a real signature request on another
  # organisation's case.

  /validsign/callback:
    post:
      operationId: receiveValidsignCallback
      tags: [Signing]
      summary: ValidSign delivers a signing event
      description: |
        A webhook, not an operation a consumer calls. **Deliberately
        unauthenticated**: ValidSign sends no bearer token. It is rate limited,
        and the JSON body parser is bypassed for this path so an oversized or
        malformed body cannot silently drop a signature.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ValidSign's event payload.
              additionalProperties: true
      responses:
        '200':
          description: The event was accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: The body could not be read (`INVALID_BODY`).
          $ref: '#/components/responses/Error'
        '401':
          description: |
            The callback's own shared-secret check failed (`UNAUTHORIZED`) —
            not a bearer token.
          $ref: '#/components/responses/Error'

  /validsign/ceremony/complete:
    get:
      operationId: getValidsignCeremonyComplete
      tags: [Signing]
      summary: The page a signer lands on after signing
      description: |
        Returns an HTML page, not JSON. Unauthenticated, because the signer
        arrives from ValidSign's own ceremony with no token.
      security: []
      responses:
        '200':
          description: The confirmation page.
          content:
            text/html:
              schema: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /validsign/stub/ceremony/{packageId}:
    get:
      operationId: getValidsignStubCeremony
      tags: [Signing]
      summary: A stand-in signing ceremony, for stub mode
      description: |
        Only meaningful when `VALIDSIGN_STUB_MODE` is on, which it is on
        acceptance. Returns an HTML page standing in for ValidSign's own
        ceremony. **Not part of the production contract** — a live tier sends
        signers to ValidSign.

        Note the content type varies by outcome: the page is `text/html`, but
        an unknown package answers JSON.
      security: []
      parameters:
        - $ref: '#/components/parameters/ValidsignPackageId'
      responses:
        '200':
          description: The stand-in ceremony page.
          content:
            text/html:
              schema: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '404':
          description: No such package (`NOT_FOUND`). Answered as JSON.
          $ref: '#/components/responses/Error'

  /validsign/stub/ceremony/{packageId}/sign:
    post:
      operationId: signValidsignStubCeremony
      tags: [Signing]
      summary: Complete or decline a stand-in ceremony
      description: |
        The stub counterpart to signing in ValidSign. **Not part of the
        production contract.** Answers HTML on both the success and failure
        paths, and JSON for an unknown package.
      security: []
      parameters:
        - $ref: '#/components/parameters/ValidsignPackageId'
      responses:
        '200':
          description: The ceremony was completed or declined.
          content:
            text/html:
              schema: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '404':
          description: No such package (`NOT_FOUND`). Answered as JSON.
          $ref: '#/components/responses/Error'
        '500':
          description: The stand-in ceremony failed. Answered as HTML.
          content:
            text/html:
              schema: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /validsign/task/{taskId}/spec:
    get:
      operationId: getValidsignTaskSpec
      tags: [Signing]
      summary: Whether a task needs a signature, and its state
      description: |
        **The response shape is fixed by contract with the frontend** — the
        handler carries a comment saying not to rename or add fields:

        ```
        { required: false }
        { required: true, templateId, status, packageId?, signingUrl? }
        ```

        Organisation-checked since #227.
      parameters:
        - $ref: '#/components/parameters/ValidsignTaskId'
      responses:
        '200':
          description: Whether a signature is required, and where it stands.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ValidsignSpec' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: '`SIGNATURE_SPEC_FAILED`.'
          $ref: '#/components/responses/Error'

  /validsign/task/{taskId}/status:
    get:
      operationId: getValidsignTaskStatus
      tags: [Signing]
      summary: The signing status of a task
      description: Organisation-checked since #227.
      parameters:
        - $ref: '#/components/parameters/ValidsignTaskId'
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { $ref: '#/components/schemas/ValidsignStatus' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: '`SIGNATURE_STATUS_NOT_FOUND`.'
          $ref: '#/components/responses/Error'
        '500':
          description: '`SIGNATURE_STATUS_FAILED`.'
          $ref: '#/components/responses/Error'

  /validsign/task/{taskId}/package:
    post:
      operationId: createValidsignPackage
      tags: [Signing]
      summary: Create a signature request for a task
      description: |
        **This sends a real signature request** on a live tier, which is why
        #227 gave it an organisation check: before that it could send one on
        another organisation's case.

        It is the operation with the most distinct refusals in this API, and
        each means something different — see the responses.

        Organisation-checked since #227.
      parameters:
        - $ref: '#/components/parameters/ValidsignTaskId'
      responses:
        '200':
          description: The signature request was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            The delivery details are not usable (`INVALID_DELIVERY`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: |
            The task carries no signature template, so there is nothing to sign
            (`NOT_SIGNATURE_TASK`).
          $ref: '#/components/responses/Error'
        '409':
          description: |
            A signature request already exists for this task
            (`VALIDSIGN_PACKAGE_EXISTS`). Creating a second would send the
            signer a duplicate.
          $ref: '#/components/responses/Error'
        '422':
          description: |
            The signer has no e-mail address, so the request cannot be
            delivered (`MISSING_SIGNER_EMAIL`). The only 422 in this API.
          $ref: '#/components/responses/Error'
        '500':
          description: '`SIGNATURE_PACKAGE_FAILED`.'
          $ref: '#/components/responses/Error'

  # ── /v1/pa ────────────────────────────────────────────────────────────────
  #
  # Policy analysis: two routers on one mount, pa.routes.ts and
  # pa-dossiers.routes.ts. Thirty-three operations, a quarter of this API.
  #
  # SECURITY. Both routers apply jwtMiddleware, tenantMiddleware and
  # requireRoles('public-affairs'), so every operation below needs that realm
  # role on top of a valid token. That is a different posture from the
  # execution core, which is organisation-scoped but not role-gated.
  #
  # THREE OPERATIONS ARE DECLARED BEFORE THAT MIDDLEWARE and do not get all of
  # it -- pa.routes.ts lines 33, 43 and 88 against `router.use` at 126-128:
  #
  #   POST /pa/curator/run      jwt + role inline, NO tenantMiddleware
  #   GET  /pa/curator/status   jwt + role inline, NO tenantMiddleware
  #   GET  /pa/signals.rss      NO middleware at all -- a query-parameter token
  #
  # WHAT IS AND IS NOT ORGANISATION-SCOPED. Dossiers, searches and feed tokens
  # are: their queries filter on tenant_id. SIGNALS ARE NOT -- pa_signals has
  # no tenant_id column at all, which the code states at
  # pa-dossiers.routes.ts:593. So a signal is shared across organisations by
  # design, and /pa/signals.rss returning every confirmed signal to any valid
  # token holder follows from that rather than being a leak.
  #
  # ENVELOPES. This mount uses three of its own on top of the four elsewhere:
  # { success, data }, { success, data, meta } with a DIFFERENT meta per
  # operation, and a bare { success } with no data at all on several writes.

  /pa/curator/run:
    post:
      operationId: runPaCurator
      tags: [Policy analysis]
      summary: Trigger a curation cycle
      description: |
        Starts curation in the background and returns immediately — the work is
        not awaited, and a failure after this response is logged rather than
        reported.

        **It runs for `flevoland` regardless of the caller.** The organisation
        is hardcoded in the handler, and the response says `flevoland` whoever
        asked. This operation also skips `tenantMiddleware`.

        Not exercised when this was written: it fetches from external sources
        and writes signals. The shape below is read from the handler.
      responses:
        '200':
          description: Curation was started.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [started, tenantId]
                    properties:
                      started: { type: boolean, const: true }
                      tenantId:
                        type: string
                        const: flevoland
                        description: Always `flevoland`, whoever called.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pa/curator/status:
    get:
      operationId: getPaCuratorStatus
      tags: [Policy analysis]
      summary: How many signals and searches exist
      description: Skips `tenantMiddleware`; counts are across the whole table.
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [signals, searches]
                    properties:
                      signals:
                        type: object
                        description: Totals as strings, straight from the count query.
                        additionalProperties: true
                      searches:
                        type: object
                        additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`STATUS_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals.rss:
    get:
      operationId: getPaSignalsRss
      tags: [Policy analysis]
      summary: Confirmed signals as an RSS feed
      description: |
        **Authenticated by a `token` QUERY PARAMETER, not a bearer token** —
        this is the one operation in the API that works that way. It carries no
        `jwtMiddleware`, and RSS readers cannot send headers, which is why.

        The token comes from `GET /pa/feed-token`, which hands back a URL with
        it already embedded. It does not expire and is not rotated.

        **Its refusals are plain text, not JSON** — `Missing token`,
        `Invalid token`, `Internal error` — so a consumer cannot parse them as
        the error envelope.

        Any valid token reads every confirmed signal. That follows from signals
        not being organisation-scoped, rather than from a missing check.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: |
            A feed token from `GET /pa/feed-token`. A long-lived secret in a
            URL: it will appear in logs, browser history and referrers.
          schema: { type: string }
        - name: tab
          in: query
          description: Restrict to one tab, for example `politiek`.
          schema: { type: string }
        - name: dossierId
          in: query
          description: Restrict to signals linked to one dossier.
          schema: { type: string }
      responses:
        '200':
          description: 'Up to 100 confirmed signals, newest and most relevant first.'
          content:
            application/rss+xml:
              schema: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          description: |
            The token was missing or unknown. **Plain text**, not JSON.
          content:
            text/plain:
              schema: { type: string, examples: ['Missing token', 'Invalid token'] }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          description: Plain text, not JSON.
          content:
            text/plain:
              schema: { type: string, examples: ['Internal error'] }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /pa/feed-token:
    get:
      operationId: getPaFeedToken
      tags: [Policy analysis]
      summary: The caller's RSS feed token and URL
      description: |
        Returns the caller's token, minting one on first use and returning the
        same one thereafter — **one per user and organisation, never rotated
        and with no expiry**. Anyone holding the URL can read the feed until
        the row is deleted.
      responses:
        '200':
          description: The token and a ready-made feed URL.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [token, url]
                    properties:
                      token: { type: string, description: 48 hex characters. }
                      url:
                        type: string
                        format: uri
                        description: The feed URL with the token already in the query string.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`FEED_TOKEN_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/types:
    get:
      operationId: getPaTypes
      tags: [Policy analysis]
      summary: The document types each source publishes
      description: A static map, used to populate filters. Takes no parameters and
        cannot fail.
      responses:
        '200':
          description: Types per source.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    description: 'Keyed by source (`tk`, `ob`, `media`, `eu`), each a list of type
                      names.'
                    additionalProperties:
                      type: array
                      items: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /pa/sources/status:
    get:
      operationId: getPaSourcesStatus
      tags: [Policy analysis]
      summary: Which upstream sources are configured
      responses:
        '200':
          description: Per-source state.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    description: 'Keyed by source: `tk`, `ob`, `eu`, `epTeksten`, `media`, `feeds`.'
                    additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /pa/feed:
    get:
      operationId: getPaFeed
      tags: [Policy analysis]
      summary: Items from the upstream sources, before curation
      description: |
        The raw feed a curator promotes from. Paged in the upstream's own style:
        `data` carries `items` with `total`, `skip` and `top`.
      responses:
        '200':
          description: A page of feed items.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [items, total, skip, top]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PaFeedItem' }
                      total: { type: integer }
                      skip: { type: integer }
                      top: { type: integer }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: The upstream source failed (`UPSTREAM_ERROR`).
          $ref: '#/components/responses/Error'

  /pa/agenda:
    get:
      operationId: getPaAgenda
      tags: [Policy analysis]
      summary: Upcoming parliamentary agenda items
      responses:
        '200':
          description: The agenda.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaAgendaItem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: '`AGENDA_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals:
    get:
      operationId: listPaSignals
      tags: [Policy analysis]
      summary: Curated signals
      description: |
        `meta` reports whether the result hit the cap: `{ total, cap, capped }`.
        A different `meta` from `/pa/notifications` on the same mount.
      responses:
        '200':
          description: The signals.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaSignal' }
                  meta:
                    type: object
                    required: [total, cap, capped]
                    properties:
                      total: { type: integer }
                      cap: { type: integer, description: The maximum this operation will return. }
                      capped:
                        { type: boolean, description: True when results were truncated at `cap`. }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`SIGNALS_ERROR`.'
          $ref: '#/components/responses/Error'
    post:
      operationId: promotePaSignal
      tags: [Policy analysis]
      summary: Promote a feed item to a signal
      description: |
        Takes a feed item and creates a signal from it. The signal's id is
        derived from the item's, so promoting the same item twice is not
        idempotent — check before calling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, title, source]
              properties:
                id: { type: string, description: The feed item's id. }
                title: { type: string }
                source: { type: string }
              additionalProperties: true
      responses:
        '201':
          description: The signal that was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaSignal' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`id`, `title` or `source` missing (`MISSING_FIELDS`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`PROMOTE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals/counts:
    get:
      operationId: getPaSignalCounts
      tags: [Policy analysis]
      summary: Signal counts per tab
      responses:
        '200':
          description: Counts keyed by tab.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    description: 'For example `{ media, politiek, regionaal }`.'
                    additionalProperties: { type: integer }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`SIGNAL_COUNTS_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals/{id}/confirm:
    post:
      operationId: confirmPaSignal
      tags: [Policy analysis]
      summary: Confirm a signal
      description: |
        Moves the signal to `confirmed`, which is what puts it in the RSS feed.
        There is no operation that undoes this; `dismiss` is the way back.
      parameters:
        - $ref: '#/components/parameters/PaSignalId'
      responses:
        '200':
          description: The updated signal.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaSignal' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`CONFIRM_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals/{id}/dismiss:
    post:
      operationId: dismissPaSignal
      tags: [Policy analysis]
      summary: Dismiss a signal
      parameters:
        - $ref: '#/components/parameters/PaSignalId'
      responses:
        '200':
          description: The updated signal.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaSignal' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`DISMISS_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals/{id}:
    patch:
      operationId: linkPaSignalToDossier
      tags: [Policy analysis]
      summary: Link a signal to a dossier
      description: The only field this accepts is the dossier to link to.
      parameters:
        - $ref: '#/components/parameters/PaSignalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dossierId]
              properties:
                dossierId: { type: string }
      responses:
        '200':
          description: The updated signal.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaSignal' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`dossierId` missing (`MISSING_DOSSIER_ID`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`LINK_DOSSIER_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/searches:
    get:
      operationId: listPaSearches
      tags: [Policy analysis]
      summary: Saved searches
      description: |
        **This operation answers snake_case** — `tenant_id`, `user_id`,
        `dossier_id`, `created_at`, `updated_at` — where `/pa/signals` on the
        same mount answers camelCase. It also returns `tenant_id` and `user_id`
        in the payload.
      responses:
        '200':
          description: The caller's organisation's saved searches.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaSearch' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`SEARCHES_ERROR`.'
          $ref: '#/components/responses/Error'
    post:
      operationId: createPaSearch
      tags: [Policy analysis]
      summary: Save a search
      description: '`query` is an OBJECT, not a string.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: object
                  required: [q]
                  properties:
                    q: { type: string }
                    types: { type: array, items: { type: string } }
                    source: { type: array, items: { type: string } }
                scope:
                  type: string
                  enum: [tenant, user]
                  description: Whether the search is shared with the organisation or private.
                tags: { type: array, items: { type: string } }
                dossierId: { type: string }
      responses:
        '201':
          description: The new search's id.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`query.q` missing (`MISSING_QUERY`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`SEARCH_CREATE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/searches/{id}:
    patch:
      operationId: updatePaSearch
      tags: [Policy analysis]
      summary: Change a saved search
      description: |
        The body is validated BEFORE the search is looked up, so a bad `scope`
        or an empty query answers 400 even for an id that does not exist.
      parameters:
        - $ref: '#/components/parameters/PaSearchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  properties:
                    q: { type: string }
                scope: { type: string, enum: [tenant, user] }
                tags: { type: array, items: { type: string } }
                notify: { type: boolean }
      responses:
        '200':
          description: |
            Updated. **No `data`** — the response is `{ success: true }` alone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BareSuccess' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            Nothing to change (`MISSING_FIELDS`), an unknown `scope`
            (`BAD_SCOPE`), or a blank query (`EMPTY_QUERY`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deletePaSearch
      tags: [Policy analysis]
      summary: Remove a saved search
      parameters:
        - $ref: '#/components/parameters/PaSearchId'
      responses:
        '200':
          description: 'Removed. **No `data`.**'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BareSuccess' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`SEARCH_DELETE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/notifications:
    get:
      operationId: listPaNotifications
      tags: [Policy analysis]
      summary: The caller's notifications
      description: '`meta` is `{ unseenCount }` — a different `meta` from `/pa/signals`.'
      responses:
        '200':
          description: The notifications.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
                  meta:
                    type: object
                    required: [unseenCount]
                    properties:
                      unseenCount: { type: integer }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`NOTIFICATIONS_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/notifications/ack:
    post:
      operationId: ackPaNotifications
      tags: [Policy analysis]
      summary: Mark the caller's notifications as seen
      responses:
        '200':
          description: 'Acknowledged. **No `data`.**'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BareSuccess' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`NOTIFICATIONS_ACK_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/dossiers:
    get:
      operationId: listPaDossiers
      tags: [Policy analysis]
      summary: Dossiers for the caller's organisation
      description: |
        Organisation-scoped, unlike signals: the query filters on `tenant_id`.

        Returns the READ model — a different shape from what `POST` and `PATCH`
        answer. See `PaDossier` and `PaDossierAuthoring`.
      responses:
        '200':
          description: The dossiers.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaDossier' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`DOSSIERS_ERROR`.'
          $ref: '#/components/responses/Error'
    post:
      operationId: createPaDossier
      tags: [Policy analysis]
      summary: Create a dossier
      description: |
        The id is slugified from `naam`, so two dossiers with the same name
        collide — that is the 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [naam, onderwerp]
              properties:
                naam: { type: string, minLength: 3 }
                onderwerp: { type: string, minLength: 1 }
                status: { type: string, enum: [actief, sluimerend], default: actief }
                momentum: { type: string, default: flat }
                gepubliceerd:
                  type: boolean
                  description: Requires the publish capability; otherwise 403.
                kompas: { type: object, additionalProperties: true }
                md: { type: object, additionalProperties: true }
      responses:
        '201':
          description: 'The new dossier, in the AUTHORING shape.'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaDossierAuthoring' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            `naam` shorter than 3 characters, or `onderwerp` empty
            (`INVALID_FIELDS`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `gepubliceerd` was true and the caller lacks the publish capability
            (`FORBIDDEN_PUBLISH`). A capability refusal, not an organisation
            one — it is not `TENANT_MISMATCH`.
          $ref: '#/components/responses/Error'
        '409':
          description: |
            A dossier with the same slugified name already exists
            (`ID_CONFLICT`).
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /pa/dossiers/{id}:
    get:
      operationId: getPaDossier
      tags: [Policy analysis]
      summary: One dossier
      description: Returns the READ model, as the list does.
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      responses:
        '200':
          description: The dossier.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaDossier' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`DOSSIER_ERROR`.'
          $ref: '#/components/responses/Error'
    patch:
      operationId: updatePaDossier
      tags: [Policy analysis]
      summary: Change a dossier
      description: Answers the AUTHORING shape, as create does.
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                naam: { type: string, minLength: 3 }
                onderwerp: { type: string, minLength: 1 }
                status: { type: string, enum: [actief, sluimerend] }
                momentum: { type: string }
                gepubliceerd: { type: boolean }
                kompas: { type: object, additionalProperties: true }
                md: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The updated dossier.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaDossierAuthoring' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            An unknown `status` (`INVALID_STATUS`), or a name or subject that
            fails the same rules as create (`INVALID_FIELDS`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN_PUBLISH`, as on create.'
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '409':
          description: A concurrent change was detected.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deletePaDossier
      tags: [Policy analysis]
      summary: Delete a dossier
      description: |
        Reports how many linked rows it touched — signals are unlinked rather
        than deleted, since a signal is not owned by one dossier.
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      responses:
        '200':
          description: Deleted, with a count of what was unlinked.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [signals, searches]
                    properties:
                      signals: { type: integer }
                      searches: { type: integer }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`DOSSIER_DELETE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/dossiers/{id}/watch:
    post:
      operationId: watchPaDossier
      tags: [Policy analysis]
      summary: Follow a dossier
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      responses:
        '201':
          description: The watch that was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`DOSSIER_WATCH_ERROR`.'
          $ref: '#/components/responses/Error'
    delete:
      operationId: unwatchPaDossier
      tags: [Policy analysis]
      summary: Stop following a dossier
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      responses:
        '200':
          description: 'Removed. **No `data`.**'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BareSuccess' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`DOSSIER_WATCH_DELETE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/dossiers/{id}/archive:
    post:
      operationId: archivePaDossier
      tags: [Policy analysis]
      summary: Archive a dossier
      description: |
        Archiving requires retention metadata — the Archives Act classification
        and term, and a reason. All three are mandatory and constrained.
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classificatie, bewaartermijn, reden]
              properties:
                classificatie: { type: string, enum: [openbaar, intern, vertrouwelijk] }
                bewaartermijn:
                  type: string
                  enum: [V5, V10, V20, B]
                  description: 'Retention: five, ten or twenty years, or permanent.'
                reden: { type: string, minLength: 1 }
      responses:
        '200':
          description: 'The archived dossier, status `gearchiveerd`.'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaDossierAuthoring' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            A missing, blank or unrecognised value among the three
            (`INVALID_ARCHIVE_METADATA`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`DOSSIER_ARCHIVE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/dossiers/{id}/unarchive:
    post:
      operationId: unarchivePaDossier
      tags: [Policy analysis]
      summary: Return an archived dossier to active
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      responses:
        '200':
          description: 'The dossier, status `actief`.'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaDossierAuthoring' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: The dossier is not archived (`NOT_ARCHIVED`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`DOSSIER_UNARCHIVE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/templates:
    get:
      operationId: listPaTemplates
      tags: [Policy analysis]
      summary: Document templates
      responses:
        '200':
          description: The templates.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaTemplate' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          description: '`TEMPLATES_ERROR`.'
          $ref: '#/components/responses/Error'
    post:
      operationId: createPaTemplate
      tags: [Policy analysis]
      summary: Add a template
      description: There is no operation to delete or change a template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [naam]
              properties:
                naam: { type: string }
                cat: { type: string }
                beschrijving: { type: string }
      responses:
        '201':
          description: The template that was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaTemplate' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`naam` missing (`MISSING_NAAM`).'
          $ref: '#/components/responses/Error'
        '500':
          description: '`TEMPLATE_CREATE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/snippets:
    get:
      operationId: listPaSnippets
      tags: [Policy analysis]
      summary: Reusable text snippets
      responses:
        '200':
          description: The snippets.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaSnippet' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '500':
          description: '`SNIPPETS_ERROR`.'
          $ref: '#/components/responses/Error'
    post:
      operationId: createPaSnippet
      tags: [Policy analysis]
      summary: Add a snippet
      description: There is no operation to delete or change a snippet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [naam, md]
              properties:
                naam: { type: string }
                md: { type: string, description: The snippet body, in Markdown. }
                cat: { type: string }
      responses:
        '201':
          description: The snippet that was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaSnippet' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`naam` or `md` missing (`MISSING_FIELDS`).'
          $ref: '#/components/responses/Error'
        '500':
          description: '`SNIPPET_CREATE_ERROR`.'
          $ref: '#/components/responses/Error'

components:
  headers:
    ApiVersion:
      description: |
        The full released version of this API, set on every response by
        version.middleware.ts. NL API Design Rules, API-57.
      schema:
        type: string
        examples: ['2026.09.11']

  securitySchemes:
    mediaAggregatorKey:
      type: http
      scheme: bearer
      description: |
        A shared secret for the media aggregator, NOT a Keycloak token. Checked
        only when the server sets MEDIA_AGGREGATOR_ACCEPT_KEY; when it does not,
        /media-aggregator/search is open. Applies to that operation alone.

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Keycloak-issued access token. Verified against the realm's JWKS by
        `jwtMiddleware`; the tenant and roles are read from its claims.

  parameters:
    PaSignalId:
      name: id
      in: path
      required: true
      description: The signal's id.
      schema: { type: string }

    PaSearchId:
      name: id
      in: path
      required: true
      description: The saved search's id.
      schema: { type: string }

    PaDossierId:
      name: id
      in: path
      required: true
      description: The dossier's id, slugified from its name at creation.
      schema: { type: string }

    EdocsWorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: The workspace's id in the document library.
      schema: { type: string }

    EdocsDocumentId:
      name: documentId
      in: path
      required: true
      description: The document's id in the library, not its documentNumber.
      schema: { type: string }

    DoccleSenderName:
      name: senderName
      in: path
      required: true
      description: The sending organisation, as Doccle knows it.
      schema: { type: string }

    DoccleExternalReferenceId:
      name: externalReferenceId
      in: path
      required: true
      description: |
        The sender's own identifier for the receiver. Spelled
        `externalReference` on the receiver upsert -- the same thing under two
        names.
      schema: { type: string }

    DoccleDocumentId:
      name: documentId
      in: path
      required: true
      description: The sender's own identifier for the document.
      schema: { type: string }

    ValidsignPackageId:
      name: packageId
      in: path
      required: true
      description: The signature package's id.
      schema: { type: string }

    ValidsignTaskId:
      name: taskId
      in: path
      required: true
      description: The task the signature belongs to.
      schema: { type: string }

    ProcessKey:
      name: key
      in: path
      required: true
      description: |
        The process definition key. Resolved against the deployment for the
        caller's organisation; see the 409 on the operations that can raise it.
      schema: { type: string }

    ProcessInstanceId:
      name: id
      in: path
      required: true
      description: The process instance id.
      schema: { type: string }

    TaskId:
      name: id
      in: path
      required: true
      description: The task id.
      schema: { type: string }

    PublicSlug:
      name: slug
      in: path
      required: true
      description: |
        The item's slug, as returned by /public/zoeken. Any non-empty value is a
        legitimate lookup, so a miss is a 404 rather than a 400.
      schema: { type: string }

  schemas:
    DependencyStatus:
      type: object
      description: Reachability of one external dependency.
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        latency:
          type: integer
          description: Round-trip time in milliseconds.
        error:
          type: string
          description: Present only when the probe failed.

    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          description: False when any dependency is down; mirrors the 503.
        data:
          type: object
          required: [name, version, status, timestamp, uptime, environment]
          properties:
            name:
              type: string
            version:
              type: string
              description: The released version, from package.json.
            build:
              description: |
                Which BUILD is running, as opposed to which release. Null in a
                working tree; the deploy workflow writes it into the artifact
                and reads it back to prove the deploy took effect.
              oneOf:
                - type: 'null'
                - type: object
                  properties:
                    sha:
                      type: string
                    run:
                      type: string
                    runId:
                      type: string
            status:
              type: string
              enum: [healthy, degraded, unhealthy]
            timestamp:
              type: string
              format: date-time
            uptime:
              type: number
              description: Process uptime in seconds.
            environment:
              type: string
            duration:
              type: integer
              description: How long the check took, in milliseconds.
            dependencies:
              type: object
              properties:
                keycloak:
                  $ref: '#/components/schemas/DependencyStatus'
                operaton:
                  $ref: '#/components/schemas/DependencyStatus'
                cache:
                  $ref: '#/components/schemas/DependencyStatus'

    ErrorEnvelope:
      type: object
      description: |
        This service's error shape. NOT RFC 9457 problem details, which the NL
        API Design Rules require -- see the deviation recorded in the
        description above.
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: A stable, machine-readable code.
            message:
              type: string
              description: A human-readable explanation.

    PublicMeta:
      type: object
      description: |
        Built when the response is assembled, NOT when the upstream data was
        fetched -- these services cache, so `generatedAt` can be newer than the
        data it accompanies.
      required: [generatedAt]
      properties:
        generatedAt: { type: string, format: date-time }

    PublicPagination:
      type: object
      description: |
        Paging state for the three paged lists. `total` counts everything
        available upstream, not the page.
      required: [limit, offset, total, hasMore]
      properties:
        limit: { type: integer, description: The clamped limit actually applied. }
        offset: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }

    PublicPagedEnvelope:
      type: object
      description: |
        The shape the three PAGED lists answer: `data` is an OBJECT carrying
        `items` and `pagination`, not a bare array. `/public/processen` differs
        -- it answers a bare array, because it is not paged.
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, pagination]
          properties:
            items: { type: array, items: { type: object } }
            pagination: { $ref: '#/components/schemas/PublicPagination' }
        meta: { $ref: '#/components/schemas/PublicMeta' }

    PublicItemEnvelope:
      type: object
      description: The unpaged shape the public read operations answer.
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta: { $ref: '#/components/schemas/PublicMeta' }

    NieuwsItem:
      type: object
      required: [id, title, summary, category, publishedAt, url, source]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        category: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }
        url: { type: [string, 'null'], format: uri }
        source:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }

    BerichtItem:
      type: object
      required:
        [
          id,
          subject,
          preview,
          content,
          type,
          status,
          audience,
          sender,
          publishedAt,
          expiresAt,
          priority,
          isRead,
          action,
        ]
      properties:
        id: { type: string }
        subject: { type: string }
        preview: { type: string }
        content: { type: [string, 'null'] }
        type: { type: string, enum: [announcement, maintenance, update] }
        status: { type: string, const: published }
        audience: { type: string, const: all }
        sender:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        publishedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        priority: { type: string, enum: [low, normal, high] }
        isRead:
          type: boolean
          description: |
            Always false on this unauthenticated surface: there is no user to
            have read it. Present because the shape is shared with the
            authenticated view.
        action:
          description: An optional call to action. Null when there is none.
          oneOf:
            - type: 'null'
            - type: object
              required: [label, url]
              properties:
                label: { type: string }
                url: { type: string, format: uri }

    ProductDienstItem:
      type: object
      required: [id, title, description, url, audience, onlineAanvragen, modified, soort]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        audience:
          type: array
          items: { type: string, enum: [ondernemer, particulier] }
        onlineAanvragen:
          type: boolean
          description: Whether the product can be applied for online.
        modified: { type: [string, 'null'], format: date-time }
        soort: { type: string }

    PublicIndexItem:
      type: object
      description: |
        One entry in the federated index that `/public/zoeken` searches and the
        three `{slug}` reads resolve against.
      required: [id, slug, type, title, summary, org, date, audience, external, facts, tech]
      properties:
        id:
          type: string
          description: 'Unique across the whole federated index, e.g. `regel-zorgtoeslag`.'
        slug:
          type: string
          description: Path segment for this item's per-type detail route.
        type: { type: string, enum: [bericht, nieuws, product, regel, proces] }
        title: { type: string }
        summary: { type: string }
        org: { type: string, description: The source organisation. }
        date: { type: [string, 'null'], format: date-time }
        audience: { type: array, items: { type: string } }
        external: { type: [string, 'null'], format: uri }
        facts:
          type: array
          description: Label/value pairs shown to a reader.
          items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        tech:
          type: array
          description: Label/value pairs of technical detail.
          items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        rules:
          type: array
          description: Present on `regel` items.
          items:
            type: object
            properties:
              naam: { type: string }
              geldig: { type: [string, 'null'] }

    OperatonVariable:
      type: object
      description: |
        Operaton's wrapped variable form. Used when SENDING variables (start,
        evaluate, complete) and in decision RESULTS. The variable reads unwrap
        it; see PlainVariableMap.
      required: [value]
      properties:
        value:
          description: The value itself. Any JSON type.
        type:
          type: string
          description: "Operaton's type name, for example String, Integer, Boolean."
        valueInfo:
          type: object
          additionalProperties: true

    OperatonVariableMap:
      type: object
      description: Variables to send, keyed by name, in Operaton's wrapped form.
      additionalProperties: { $ref: '#/components/schemas/OperatonVariable' }

    PlainVariableMap:
      type: object
      description: |
        Variables as the READ operations return them: keyed by name, with the
        value only. Operaton's `{value, type}` wrapper is removed.

        Every instance started since #218 carries `municipality` (the owning
        organisation, which access checks enforce) and `originTenantId` (the
        caller's organisation at start). Both, with `applicantId`, are
        rejected if a task completion tries to write them.
      additionalProperties: true

    ProcessStartResult:
      type: object
      description: |
        Deliberately not the full instance — a start returns what a caller needs
        to follow the case.
      required: [processInstanceId, businessKey, status, startTime]
      properties:
        processInstanceId: { type: string }
        businessKey:
          type: string
          description: |
            When minted by this service, prefixed with the OWNING organisation
            and a timestamp (#234). When supplied by the caller it is kept
            verbatim, so it may follow any convention. Never an access
            control: that is `municipality`.
        status: { type: string, enum: [active, suspended, ended] }
        startTime: { type: string, format: date-time }

    ProcessStatus:
      type: object
      required: [processInstanceId, definitionId, businessKey, status, ended, suspended]
      properties:
        processInstanceId: { type: string }
        definitionId:
          type: string
          description: 'The versioned definition, for example
            `AwbShellProcess:2:5235cc40-…`.'
        businessKey: { type: string }
        status: { type: string, enum: [active, suspended, ended] }
        ended: { type: boolean }
        suspended: { type: boolean }

    ActivityHistoryEntry:
      type: object
      description: One activity an instance passed through, as Operaton reports it.
      required: [id, activityId, activityType, startTime]
      properties:
        id: { type: string }
        activityId: { type: string }
        activityName: { type: [string, 'null'] }
        activityType: { type: string }
        assignee: { type: [string, 'null'] }
        startTime: { type: string, format: date-time }
        endTime: { type: [string, 'null'], format: date-time }
        durationInMillis:
          type:
            - integer
            - 'null'
        canceled:
          type: boolean

    FormSchema:
      type: object
      description: |
        A form-js schema, served unaltered for a renderer to consume. Its
        `components` are the fields; a form of any other kind answers 415
        rather than being converted.
      required: [id, type, components]
      properties:
        id: { type: string }
        type: { type: string }
        components:
          type: array
          items:
            type: object
            additionalProperties: true
        schemaVersion: { type: integer }
        executionPlatform: { type: string }
        executionPlatformVersion: { type: string }

    DecisionDefinition:
      type: object
      description: A DMN decision definition as Operaton reports it.
      required: [id, key, name, version]
      properties:
        id: { type: string }
        key: { type: string }
        category: { type: [string, 'null'] }
        name: { type: string }
        version: { type: integer }
        resource: { type: string }
        deploymentId: { type: string }
        tenantId: { type: [string, 'null'] }
        versionTag:
          type:
            - string
            - 'null'
        historyTimeToLive:
          type:
            - integer
            - 'null'
        decisionRequirementsDefinitionId:
          type:
            - string
            - 'null'
        decisionRequirementsDefinitionKey:
          type:
            - string
            - 'null'

    Task:
      type: object
      description: |
        A live Operaton task. `tenantId` is present but is NOT what access is
        decided by — since #218 that is the instance's `municipality` variable.

        Operaton's CMMN fields (`caseInstanceId`, `caseExecutionId`,
        `caseDefinitionId`) are passed through and are always null here: this
        platform deploys BPMN only.
      required: [id, name, created, processInstanceId, taskDefinitionKey]
      properties:
        id: { type: string }
        name: { type: string }
        assignee: { type: [string, 'null'] }
        created: { type: string, format: date-time }
        due: { type: [string, 'null'], format: date-time }
        followUp: { type: [string, 'null'], format: date-time }
        description: { type: [string, 'null'] }
        owner: { type: [string, 'null'] }
        priority: { type: integer }
        executionId: { type: string }
        processDefinitionId: { type: string }
        processDefinitionKey: { type: [string, 'null'] }
        processInstanceId: { type: string }
        taskDefinitionKey: { type: string }
        suspended: { type: boolean }
        formKey: { type: [string, 'null'] }
        tenantId:
          type: [string, 'null']
          description: Operaton's deployment tenant. Read by no access check.
        taskState:
          type:
            - string
            - 'null'
        parentTaskId:
          type:
            - string
            - 'null'
        delegationState:
          type:
            - string
            - 'null'
        lastUpdated:
          type:
            - string
            - 'null'
          format: date-time
        operatonFormRef:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: A reference to a deployed form, when the task uses one.
        caseInstanceId:
          type:
            - string
            - 'null'
          description: 'CMMN. Always null: this platform deploys BPMN only.'
        caseExecutionId:
          type:
            - string
            - 'null'
          description: CMMN. Always null.
        caseDefinitionId:
          type:
            - string
            - 'null'
          description: CMMN. Always null.

    HistoricTask:
      type: object
      description: |
        A completed task, as Operaton's history reports it. Carries more than
        the live Task — timing, the reason it ended, and the business key.
      required: [id, processInstanceId, taskDefinitionKey, startTime]
      properties:
        id: { type: string }
        name: { type: [string, 'null'] }
        assignee: { type: [string, 'null'] }
        owner: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        deleteReason: { type: [string, 'null'] }
        startTime: { type: string, format: date-time }
        endTime: { type: [string, 'null'], format: date-time }
        duration: { type: [integer, 'null'] }
        priority: { type: integer }
        due: { type: [string, 'null'], format: date-time }
        followUp: { type: [string, 'null'], format: date-time }
        parentTaskId: { type: [string, 'null'] }
        processDefinitionKey: { type: [string, 'null'] }
        processDefinitionId: { type: string }
        processInstanceId: { type: string }
        executionId: { type: string }
        taskDefinitionKey: { type: string }
        taskState: { type: [string, 'null'] }
        businessKey: { type: [string, 'null'] }
        tenantId: { type: [string, 'null'] }
        removalTime: { type: [string, 'null'], format: date-time }
        rootProcessInstanceId: { type: [string, 'null'] }
        activityInstanceId:
          type:
            - string
            - 'null'
        boardOwner:
          type:
            - string
            - 'null'
          description: 'Added by this service, not Operaton: which board the task belongs
            to, read from the process-definition XML and cached per definition
            key.'
        caseDefinitionKey:
          type:
            - string
            - 'null'
          description: CMMN. Always null.
        caseDefinitionId:
          type:
            - string
            - 'null'
          description: CMMN. Always null.
        caseInstanceId:
          type:
            - string
            - 'null'
          description: CMMN. Always null.
        caseExecutionId:
          type:
            - string
            - 'null'
          description: CMMN. Always null.

    TimestampedEnvelope:
      type: object
      description: |
        The envelope /v1/edocs and /v1/doccle answer on SUCCESS. `timestamp` is
        when this service built the response, not when the upstream acted.

        A third variant: the public surface carries `meta.generatedAt`, the
        execution core carries neither. ERROR responses on these two mounts
        drop `timestamp` and use the plain error envelope.
      required: [success, data, timestamp]
      properties:
        success: { type: boolean, const: true }
        data: {}
        timestamp: { type: string, format: date-time }

    EdocsWorkspace:
      type: object
      description: A workspace in the document library.
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    EdocsDocument:
      type: object
      description: |
        A document as the library lists it. `documentNumber` is the library's
        own reference, distinct from `id`.
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        documentNumber: { type: string }

    ValidsignStatus:
      type: string
      description: |
        Where a task's signature stands. `none` means no signature has been
        requested — it is the answer for every task that needs none.
      enum: [none, sent, completed, declined, failed]

    ValidsignSpec:
      type: object
      description: |
        Whether a task needs a signature. The shape is FIXED BY CONTRACT with
        the frontend; the handler carries a comment saying not to rename or add
        fields. Two forms, discriminated by `required`.
      required: [required]
      properties:
        required:
          type: boolean
          description: False for a task that needs no signature, and then nothing else is
            present.
        templateId:
          type: string
          description: Present when `required` is true.
        status:
          $ref: '#/components/schemas/ValidsignStatus'
        packageId:
          type: string
          description: Present once a signature request exists.
        signingUrl:
          type: string
          format: uri
          description: Where the signer completes the ceremony. Present once a request
            exists.

    BareSuccess:
      type: object
      description: |
        Several /v1/pa writes answer this and nothing else — no `data`, no
        `meta`, no `timestamp`. A sixth response shape in this API.
      required: [success]
      properties:
        success: { type: boolean, const: true }

    PaSignal:
      type: object
      description: |
        A curated signal. NOT organisation-scoped: `pa_signals` carries no
        tenant column, so a signal is shared across organisations by design.
      required: [id, tab, title, status]
      properties:
        id: { type: string }
        tab:
          { type: string, description: 'Which board the signal sits on, for example `politiek`.' }
        dossierId: { type: [string, 'null'], description: The dossier it is linked to, if any. }
        title: { type: string }
        src: { type: [string, 'null'], description: The source system's display name. }
        bron: { type: [string, 'null'] }
        subbron: { type: [string, 'null'] }
        commissie: { type: [string, 'null'] }
        regio: { type: [string, 'null'] }
        sentiment: { type: [string, 'null'] }
        ref: { type: [string, 'null'] }
        rel: { type: [number, 'null'], description: Relevance, used for ordering. }
        impact: { type: [number, 'null'] }
        impactLabel: { type: [string, 'null'] }
        duiding: { type: [string, 'null'], description: The curator's interpretation. }
        status:
          type: string
          enum: [candidate, ai_drafted, confirmed, dismissed]
          description: Only `confirmed` signals reach the RSS feed.
        aiDraft: { type: [string, 'null'] }
        confirmedBy: { type: [string, 'null'] }
        confirmedAt: { type: [string, 'null'], format: date-time }
        routing: { type: [object, 'null'], additionalProperties: true }

    PaFeedItem:
      type: object
      description: An uncurated item from an upstream source.
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: [string, 'null'] }
        number: { type: [string, 'null'] }
        date:
          {
            type: [string, 'null'],
            format: date-time,
            description: 'A full timestamp with offset, despite the field name — for
              example 2026-09-25T22:47:20.137+02:00.',
          }
        url: { type: [string, 'null'], format: uri }
        source: { type: [string, 'null'] }

    PaAgendaItem:
      type: object
      description: A parliamentary agenda entry.
      required: [id, titel]
      properties:
        id: { type: string }
        nummer: { type: [string, 'null'] }
        soort: { type: [string, 'null'] }
        soortLabel: { type: [string, 'null'] }
        titel: { type: string }
        iso: { type: [string, 'null'], description: The date, ISO-formatted. }
        tijd: { type: [string, 'null'] }
        commissie: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        dossier: { type: [string, 'null'] }
        matchTerm: { type: [string, 'null'], description: Which saved-search term matched. }
        url: { type: [string, 'null'], format: uri }
        live: { type: [boolean, 'null'] }
        stream: { type: [string, 'null'], format: uri }

    PaSearch:
      type: object
      description: |
        A saved search. **This schema is snake_case**, because the operation
        answers the database row rather than a mapped object — unlike
        `PaSignal` on the same mount. It also exposes `tenant_id` and
        `user_id`.
      required: [id, query]
      properties:
        id: { type: string }
        tenant_id: { type: [string, 'null'] }
        user_id: { type: [string, 'null'] }
        scope: { type: [string, 'null'], enum: [tenant, user, null] }
        dossier_id: { type: [string, 'null'] }
        query: { type: object, additionalProperties: true }
        tags: { type: [array, 'null'], items: { type: string } }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        notify: { type: [boolean, 'null'] }

    PaDossier:
      type: object
      description: |
        A dossier as the READS return it — the rendered view, with the
        narrative and planning fields the cockpit displays.

        `POST` and `PATCH` answer a DIFFERENT shape; see `PaDossierAuthoring`.
        One resource, two representations.
      required: [id, naam, status]
      properties:
        id: { type: string }
        naam: { type: string }
        onderwerp: { type: [string, 'null'] }
        doel: { type: [string, 'null'] }
        next: { type: [string, 'null'] }
        status: { type: string }
        momentum: { type: [string, 'null'] }
        progressPct: { type: [number, 'null'] }
        ritme: { type: [object, 'null'], additionalProperties: true }
        kompas: { type: [object, 'null'], additionalProperties: true }
        kompasLog: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        overleg: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        timeline: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        mijlpalen: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        interventies: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        intervLog: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        stakeholders: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        waaromNu: { type: [string, 'null'] }
        waarover: { type: [string, 'null'] }
        narratief: { type: [string, 'null'] }

    PaDossierAuthoring:
      type: object
      description: |
        A dossier as the WRITES return it — what was stored, rather than the
        rendered view. Returned by create, update, archive and unarchive.
      required: [id, naam, onderwerp, status]
      properties:
        id: { type: string, description: Slugified from `naam` at creation. }
        naam: { type: string }
        onderwerp: { type: string }
        status: { type: string, enum: [actief, sluimerend, gearchiveerd] }
        momentum: { type: [string, 'null'] }
        eigenaar: { type: [string, 'null'], description: Who created it. }
        kompas: { type: [object, 'null'], additionalProperties: true }
        md: { type: [object, 'null'], additionalProperties: true }
      additionalProperties: true

    PaTemplate:
      type: object
      required: [id, naam]
      properties:
        id: { type: string }
        naam: { type: string }
        cat: { type: [string, 'null'] }
        beschrijving: { type: [string, 'null'] }
        versie: { type: [string, 'null'] }
        eigenaar: { type: [string, 'null'] }
        gebruikt: { type: [integer, 'null'], description: How often it has been used. }
        seed: { type: [boolean, 'null'], description: True for the rows shipped with the platform. }

    PaSnippet:
      type: object
      required: [id, naam, md]
      properties:
        id: { type: string }
        naam: { type: string }
        cat: { type: [string, 'null'] }
        md: { type: string, description: The snippet body, in Markdown. }

    MediaAggregatorError:
      type: object
      description: |
        The media aggregator's own error shape. Neither RFC 9457 problem details
        NOR this API's `{ success, error }` envelope -- a bare `{ error }` with a
        machine-readable slug. Recorded as it is rather than tidied, because a
        consumer reads what the handler sends.
      required: [error]
      properties:
        error: { type: string, enum: [unauthorized, search_failed] }

  responses:
    PaNotFound:
      description: |
        No such signal, search or dossier for this organisation (`NOT_FOUND`).
        Dossiers and searches are organisation-scoped, so a row belonging to
        another organisation is reported as absent rather than forbidden.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    UpstreamFailed:
      description: |
        The external system refused the request or could not be reached
        (`EDOCS_ERROR`, `DOCCLE_ERROR`). A 502 rather than a 500: the fault is
        upstream, not in this service.

        Error responses on these mounts carry no `timestamp`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    Unauthorized:
      description: |
        No bearer token, or one this service could not verify against the
        realm's JWKS (`UNAUTHORIZED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    TenantMismatch:
      description: |
        The resource belongs to another organisation, or carries no
        organisation label at all (`TENANT_MISMATCH`, message
        "Access denied: organisation mismatch").

        Failing closed on a missing label is deliberate (#218). This is NOT
        used for role refusals, which answer `FORBIDDEN`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    AmbiguousDeployment:
      description: |
        The process key is deployed under several organisations and none of
        them is the caller's, so there is no basis for choosing which one
        handles the case (`AMBIGUOUS_DEPLOYMENT`). The message names the
        organisations. When the caller's own organisation is among them, it
        wins and no 409 is raised.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    RateLimited:
      description: |
        More than 10 requests in 15 minutes from this IP. Sent by
        publicWriteLimiter, which answers before the handler runs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
      headers:
        API-Version:
          $ref: '#/components/headers/ApiVersion'

# Applied to every operation that does not override it with `security: []`.
# The unauthenticated surface is the exception and says so per operation.
security:
  - bearerAuth: []
