          $ref: '#/components/responses/Error'
        '500':
          description: '`FORM_FETCH_FAILED`.'
          $ref: '#/components/responses/Error'

  /process/{key}/variable-hints:
    get:
      operationId: getProcessVariableHints
      tags: [Process]
      summary: Variable names and types a process expects
      description: |
        **This operation does not use the `{ success, data }` envelope.** It
