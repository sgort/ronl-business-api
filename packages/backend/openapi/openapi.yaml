              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BesluitListItem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`BESLUIT_LIST_FAILED`.'
          $ref: '#/components/responses/Error'

  /besluitvorming/completed:
    get:
      operationId: listBesluitenCompleted
      tags: [Besluitvorming]
      summary: Completed besluiten
      description: Completed GedelegeerdBesluitProcess instances of the caller's tenant, most recently completed first, each with its outcome.
      responses:
        '200':
          description: The besluiten.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BesluitListItem' }
