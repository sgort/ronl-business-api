                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/HrOnboarding' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`ONBOARDING_LIST_FAILED`.'
          $ref: '#/components/responses/Error'

  /hr/onboarding/profile:
    get:
      operationId: getHrOnboardingProfile
      tags: [HR]
      summary: One employee's onboarding profile
      parameters:
        - name: employeeId
          in: query
          required: true
          description: Required — there is no unfiltered profile read.
          schema: { type: string }
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data: { type: object, additionalProperties: true }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`employeeId` was not supplied (`VALIDATION_ERROR`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`HR_PROFILE_FAILED`.'
          $ref: '#/components/responses/Error'

  # ── /v1/brp ───────────────────────────────────────────────────────────────

  /brp/personen:
    post:
      operationId: searchBrpPersonen
      tags: [Personal records]
      summary: Look up a person in the municipal records
      description: |
        A pass-through proxy to the BRP Haal Centraal API, so the frontend does
        not have to reach it across origins. The request and response are the
        upstream's own shapes, forwarded unaltered.

        **This carries a burgerservicenummer**, a national identifier. Examples
        here use the reserved `99999xxxx` test range, never a real one.

        `jwtMiddleware` is applied on the route rather than the router, so this
        is authenticated — there is no `router.use` on this mount.
      requestBody:
        required: true
        description: The upstream's request shape, forwarded as sent.
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  description: 'The BRP query type, for example
                    `RaadpleegMetBurgerservicenummer`.'
                burgerservicenummer:
                  type: array
                  items: { type: string }
                  description: 'One or more BSNs. Use the reserved 99999xxxx range in examples.'
                fields:
                  type: array
                  items: { type: string }
                  description: Which fields to return.
              additionalProperties: true
      responses:
        '200':
          description: The upstream's answer, forwarded.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: The BRP response, unaltered.
                        additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            The upstream rejected the query (`BRP_API_ERROR`). **This error
            carries an extra `details`** holding the upstream's own
            `invalidParams`, which no other error in this API does.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/BrpProblem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The upstream could not be reached (`BRP_API_ERROR`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/BrpProblem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        default:
          description: |
            **Any other status the upstream returned, forwarded verbatim.** Both
            failure branches of this handler answer
            `res.status(<the BRP API's status>)`, so the status on this
            operation is the upstream's rather than this service's -- a `404`
            for an unknown burgerservicenummer and a `502` from the gateway in
            front of it are both reachable. The body is always this service's
            own `BrpProblem`.

            Documented as `default` rather than as a longer list, because the
            list is not this service's to close. #269's conformance check
            surfaced it: two route tests asserted statuses the document did not
            have.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/BrpProblem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  # ── /v1/admin ─────────────────────────────────────────────────────────────

  /admin/audit:
    get:
      operationId: getAuditLog
      tags: [Admin]
      summary: Recent audit entries
      description: |
        The in-memory audit queue. **Requires the `admin` realm role** — the
        only operation in this API that does — and answers `403 FORBIDDEN` to
        anyone else, a ROLE refusal rather than an organisation one.

        Entries carry `userId`, `tenantId`, `azp`, IP addresses and user
        agents, which is why the role gate is here.
      responses:
        '200':
          description: The most recent entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: |
                          A PAGED envelope, not a bare array. `admin.routes.ts`
                          answers `data: { items, pagination }`; this said
                          `data` WAS the array until #269, whose conformance
                          check is what compared the two.
                        required: [items, pagination]
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              description: One audit entry.
                              additionalProperties: true
                          pagination:
                            type: object
                            required: [limit, offset, total, hasMore]
                            properties:
                              limit: { type: integer }
                              offset: { type: integer }
                              total: { type: integer }
                              hasMore:
                                type: boolean
                                description: Whether another page follows.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            The caller lacks the `admin` role (`FORBIDDEN`). Not
            `TENANT_MISMATCH`: this is about role, not organisation.
          $ref: '#/components/responses/Error'
        '500':
          description: '`DB_ERROR`.'
          $ref: '#/components/responses/Error'

  # ── /v1/mcp ───────────────────────────────────────────────────────────────
  #
  # Requires `caseworker` OR `admin`. /chat is the only streaming operation in
  # this API.

  /mcp/sources:
    get:
      operationId: listMcpSources
      tags: [MCP]
      summary: The MCP sources this service can reach
      responses:
        '200':
          description: The sources and whether each is connected.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/McpSource' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller has neither `caseworker` nor `admin` (`FORBIDDEN`).
          $ref: '#/components/responses/Error'

  /mcp/models:
    get:
      operationId: listMcpModels
      tags: [MCP]
      summary: The language models available for chat
      responses:
        '200':
          description: The models.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/McpModel' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller has neither `caseworker` nor `admin` (`FORBIDDEN`).
          $ref: '#/components/responses/Error'

  /mcp/chat:
    post:
      operationId: mcpChat
      tags: [MCP]
      summary: Ask a question across the connected MCP sources
      description: |
        **The only streaming operation in this API.** A successful call answers
        `text/event-stream` with `Cache-Control: no-cache` and
        `X-Accel-Buffering: no`, then writes one SSE `data:` line per event:

        ```
        data: {"type":"delta","text":"ok"}

        data: {"type":"done"}
        ```

        A `delta` carries the next fragment of the answer; `done` ends the
        stream. OpenAPI cannot describe an event sequence, so the 200 below
        types the body as a string and the framing is given here.

        The REFUSALS are ordinary JSON, not events — they are sent before the
        stream begins, so a caller must check the status and content type
        before reading.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, modelId]
              properties:
                message: { type: string, description: The question. Must not be blank. }
                modelId:
                  type: string
                  description: 'One of the ids from `GET /mcp/models`.'
                history:
                  type: array
                  description: Earlier turns, oldest first.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      content: { type: string }
                sources:
                  type: array
                  description: |
                    Restrict to these source ids. Absent or empty means every
                    connected source.
                  items: { type: string }
      responses:
        '200':
          description: The answer, streamed as server-sent events.
          content:
            text/event-stream:
              schema:
                type: string
                description: 'A sequence of `data:` lines; see the description for the event
                  shapes.'
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            `message` is blank or `modelId` is absent (`INVALID_REQUEST`). The
            message names which.
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller has neither `caseworker` nor `admin` (`FORBIDDEN`).
          $ref: '#/components/responses/Error'
        '503':
          description: |
            MCP is switched off (`MCP_DISABLED`), or none of the selected
            sources is connected (`MCP_NOT_CONNECTED`).
          $ref: '#/components/responses/Error'

components:
  headers:
    ApiVersion:
      description: |
        The full released version of this API, set on every response by
        version.middleware.ts. NL API Design Rules, API-57.
      schema:
        type: string
        examples: ['2026.09.11']

  securitySchemes:
    m2mOAuth:
      type: oauth2
      description: |
        The machine-to-machine surface, `/v1/m2m`.

        The token is obtained with a CLIENT CREDENTIALS grant against the same
        realm the rest of the API uses, and is validated the same way: same
        issuer, `ronl-business-api` audience, RS256. It is a separate scheme
        here because the CALLER is checked as well as the token.

        **The client must be allow-listed.** `requireM2mClient` requires the
        token's `azp` -- the party it was issued to -- to appear on the server's
        `M2M_ALLOWED_CLIENTS`, which is `operaton-mcp-client` alone today.
        Anything else is refused with `403 M2M_CLIENT_NOT_ALLOWED` before any
        handler runs. Adding a consumer means adding its client id to that
        variable; nothing changes in Keycloak.

        `azp` rather than the audience, because every person in the realm holds
        a token for `ronl-business-api`: the audience cannot distinguish a
        machine from a citizen, and before #237 that meant any authenticated
        user reached all 18 operations.

        OpenAPI cannot express the allow-list condition, so it is stated here
        and carried by the 403 on every operation. A bearer token that is
        merely valid is NOT sufficient.

        `tokenUrl` below is production's. Acceptance issues tokens at
        `https://acc.keycloak.open-regels.nl/realms/ronl/protocol/openid-connect/token`.
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.open-regels.nl/realms/ronl/protocol/openid-connect/token
          scopes: {}

    mediaAggregatorKey:
      type: http
      scheme: bearer
      description: |
        A shared secret for the media aggregator, NOT a Keycloak token. Checked
        only when the server sets MEDIA_AGGREGATOR_ACCEPT_KEY; when it does not,
        /media-aggregator/search is open. Applies to that operation alone.

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Keycloak-issued access token. Verified against the realm's JWKS by
        `jwtMiddleware`; the tenant and roles are read from its claims.

  parameters:
    RipPhaseCode:
      name: code
      in: path
      required: true
      description: |
        The phase code, dotted -- `R2.1`, not `R21`. An unrecognised code
        answers 404 UNKNOWN_PHASE.
      schema: { type: string, examples: ['R2.1'] }

    PaSignalId:
      name: id
      in: path
      required: true
      description: The signal's id.
      schema: { type: string }

    PaSearchId:
      name: id
      in: path
      required: true
      description: The saved search's id.
      schema: { type: string }

    PaDossierId:
      name: id
      in: path
      required: true
      description: The dossier's id, slugified from its name at creation.
      schema: { type: string }

    EdocsWorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: The workspace's id in the document library.
      schema: { type: string }

    EdocsDocumentId:
      name: documentId
      in: path
      required: true
      description: The document's id in the library, not its documentNumber.
      schema: { type: string }

    DoccleSenderName:
      name: senderName
      in: path
      required: true
      description: The sending organisation, as Doccle knows it.
      schema: { type: string }

    DoccleExternalReferenceId:
      name: externalReferenceId
      in: path
      required: true
      description: |
        The sender's own identifier for the receiver. Spelled
        `externalReference` on the receiver upsert -- the same thing under two
        names.
      schema: { type: string }

    DoccleDocumentId:
      name: documentId
      in: path
      required: true
      description: The sender's own identifier for the document.
      schema: { type: string }

    ValidsignPackageId:
      name: packageId
      in: path
      required: true
      description: The signature package's id.
      schema: { type: string }

    ValidsignTaskId:
      name: taskId
      in: path
      required: true
      description: The task the signature belongs to.
      schema: { type: string }

    M2mProcessKey:
      name: key
      in: path
      required: true
      description: |
        The process definition key. Unlike `ProcessKey` on the `/v1`
        operations, this is NOT resolved against a caller's organisation --
        there is none -- so a key deployed under several organisations resolves
        here regardless of which, and no `409 AMBIGUOUS_DEPLOYMENT` can arise.
      schema: { type: string }

    M2mDecisionKey:
      name: key
      in: path
      required: true
      description: The DMN decision key, for example `AwbCompletenessCheck`.
      schema: { type: string }

    ProcessKey:
      name: key
      in: path
      required: true
      description: |
        The process definition key. Resolved against the deployment for the
        caller's organisation; see the 409 on the operations that can raise it.
      schema: { type: string }

    ProcessInstanceId:
      name: id
      in: path
      required: true
      description: The process instance id.
      schema: { type: string }

    TaskId:
      name: id
      in: path
      required: true
      description: The task id.
      schema: { type: string }

    PublicSlug:
      name: slug
      in: path
      required: true
      description: |
        The item's slug, as returned by /public/zoeken. Any non-empty value is a
        legitimate lookup, so a miss is a 404 rather than a 400.
      schema: { type: string }

  schemas:
    DependencyStatus:
      type: object
      description: Reachability of one external dependency.
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
        latency:
          type: integer
          description: Round-trip time in milliseconds.
        error:
          type: string
          description: Present only when the probe failed.

    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          description: False when any dependency is down; mirrors the 503.
        data:
          type: object
          # `uptime` and `environment` are NOT required, and neither are
          # `dependencies` or `duration`. health.routes.ts has TWO 503 paths and
          # they answer different bodies: when a dependency is down it sends the
          # full report, but when the check itself THROWS, the catch branch
          # sends only { name, version, status, timestamp, error }.
          #
          # Listing them as required described the first path and not the
          # second, so the document was wrong for every 503 raised by a failing
          # CHECK rather than a failing dependency. #269's conformance check
          # found it; the route test for that branch had been green throughout.
          required: [name, version, status, timestamp]
          properties:
            error:
              type: string
              description: |
                Present ONLY on the catch-branch 503, carrying the message of
                the error that stopped the check. The fields reporting on
                dependencies are absent on that path.
            name:
              type: string
            version:
              type: string
              description: The released version, from package.json.
            build:
              description: |
                Which BUILD is running, as opposed to which release. Null in a
                working tree; the deploy workflow writes it into the artifact
                and reads it back to prove the deploy took effect.
              oneOf:
                - type: 'null'
                - type: object
                  properties:
                    sha:
                      type: string
                    run:
                      type: string
                    runId:
                      type: string
            status:
              type: string
              enum: [healthy, degraded, unhealthy]
            timestamp:
              type: string
              format: date-time
            uptime:
              type: number
              description: Process uptime in seconds.
            environment:
              type: string
            duration:
              type: integer
              description: How long the check took, in milliseconds.
            dependencies:
              type: object
              properties:
                keycloak:
                  $ref: '#/components/schemas/DependencyStatus'
                operaton:
                  $ref: '#/components/schemas/DependencyStatus'
                cache:
                  $ref: '#/components/schemas/DependencyStatus'

    Problem:
      type: object
      description: |
        RFC 9457 problem details, served as `application/problem+json` (#216).
        Every 4xx and 5xx this API answers has this shape.

        `code` is an extension member: the stable, machine-readable identifier
        a consumer should branch on, the same value the pre-#216 envelope
        carried as `error.code`. `title` is derived from it, so the same code
        always has the same title. An operation may document further extension
        members (`reserved`, `tenants`, ...).
      required: [type, status, title, detail, instance]
      properties:
        type:
          type: string
          description: Always `about:blank`; this API has no page per problem kind.
          examples: [about:blank]
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: The HTTP status, repeated.
        title:
          type: string
          description: A short summary of the kind of problem, derived from `code`.
        detail:
          type: string
          description: What went wrong with this request.
        instance:
          type: string
          description: The request path, without its query string.
        code:
          type: string
          description: A stable, machine-readable code, e.g. `TENANT_MISMATCH`.
      additionalProperties: true

    PublicMeta:
      type: object
      description: |
        Built when the response is assembled, NOT when the upstream data was
        fetched -- these services cache, so `generatedAt` can be newer than the
        data it accompanies.
      required: [generatedAt]
      properties:
        generatedAt: { type: string, format: date-time }

    PublicPagination:
      type: object
      description: |
        Paging state for the three paged lists. `total` counts everything
        available upstream, not the page.
      required: [limit, offset, total, hasMore]
      properties:
        limit: { type: integer, description: The clamped limit actually applied. }
        offset: { type: integer }
        total: { type: integer }
        hasMore: { type: boolean }

    PublicPagedEnvelope:
      type: object
      description: |
        The shape the three PAGED lists answer: `data` is an OBJECT carrying
        `items` and `pagination`, not a bare array. `/public/processen` differs
        -- it answers a bare array, because it is not paged.
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items, pagination]
          properties:
            items: { type: array, items: { type: object } }
            pagination: { $ref: '#/components/schemas/PublicPagination' }
        meta: { $ref: '#/components/schemas/PublicMeta' }

    PublicItemEnvelope:
      type: object
      description: The unpaged shape the public read operations answer.
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data: {}
        meta: { $ref: '#/components/schemas/PublicMeta' }

    NieuwsItem:
      type: object
      required: [id, title, summary, category, publishedAt, url, source]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        category: { type: [string, 'null'] }
        publishedAt: { type: string, format: date-time }
        url: { type: [string, 'null'], format: uri }
        source:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }

    BerichtItem:
      type: object
      required:
        [
          id,
          subject,
          preview,
          content,
          type,
          status,
          audience,
          sender,
          publishedAt,
          expiresAt,
          priority,
          isRead,
          action,
        ]
      properties:
        id: { type: string }
        subject: { type: string }
        preview: { type: string }
        content: { type: [string, 'null'] }
        type: { type: string, enum: [announcement, maintenance, update] }
        status: { type: string, const: published }
        audience: { type: string, const: all }
        sender:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        publishedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        priority: { type: string, enum: [low, normal, high] }
        isRead:
          type: boolean
          description: |
            Always false on this unauthenticated surface: there is no user to
            have read it. Present because the shape is shared with the
            authenticated view.
        action:
          description: An optional call to action. Null when there is none.
          oneOf:
            - type: 'null'
            - type: object
              required: [label, url]
              properties:
                label: { type: string }
                url: { type: string, format: uri }

    ProductDienstItem:
      type: object
      required: [id, title, description, url, audience, onlineAanvragen, modified, soort]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        url: { type: string, format: uri }
        audience:
          type: array
          items: { type: string, enum: [ondernemer, particulier] }
        onlineAanvragen:
          type: boolean
          description: Whether the product can be applied for online.
        modified: { type: [string, 'null'], format: date-time }
        soort: { type: string }

    FacetCounts:
      type: array
      description: |
        One facet's values with their counts, ordered by count descending. Each
        entry is a two-element tuple: the value, then how many items carry it.
      items:
        type: array
        minItems: 2
        maxItems: 2
        prefixItems:
          - type: string
            description: The facet value.
          - type: integer
            description: How many items in the result set carry it.

    PublicIndexItem:
      type: object
      description: |
        One entry in the federated index that `/public/zoeken` searches and the
        three `{slug}` reads resolve against.
      required: [id, slug, type, title, summary, org, date, audience, external, facts, tech]
      properties:
        id:
          type: string
          description: 'Unique across the whole federated index, e.g. `regel-zorgtoeslag`.'
        slug:
          type: string
          description: Path segment for this item's per-type detail route.
        type: { type: string, enum: [bericht, nieuws, product, regel, proces] }
        title: { type: string }
        summary: { type: string }
        org: { type: string, description: The source organisation. }
        date: { type: [string, 'null'], format: date-time }
        audience: { type: array, items: { type: string } }
        external: { type: [string, 'null'], format: uri }
        facts:
          type: array
          description: Label/value pairs shown to a reader.
          items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        tech:
          type: array
          description: Label/value pairs of technical detail.
          items: { type: array, items: { type: string }, minItems: 2, maxItems: 2 }
        rules:
          type: array
          description: Present on `regel` items.
          items:
            type: object
            properties:
              naam: { type: string }
              geldig: { type: [string, 'null'] }

    OperatonVariable:
      type: object
      description: |
        Operaton's wrapped variable form. Used when SENDING variables (start,
        evaluate, complete) and in decision RESULTS. The variable reads unwrap
        it; see PlainVariableMap.
      required: [value]
      properties:
        value:
          description: The value itself. Any JSON type.
        type:
          type: string
          description: "Operaton's type name, for example String, Integer, Boolean."
        valueInfo:
          type: object
          additionalProperties: true

    OperatonVariableMap:
      type: object
      description: Variables to send, keyed by name, in Operaton's wrapped form.
      additionalProperties: { $ref: '#/components/schemas/OperatonVariable' }

    PlainVariableMap:
      type: object
      description: |
        Variables keyed by name, with the value only -- Operaton's
        `{value, type}` wrapper removed.

        **Used in both directions**, which is easy to get wrong. Every variable
        READ returns this shape. So do the two writes that take variables from
        a caller: `POST /process/{key}/start` and `POST /task/{id}/complete`
        wrap the plain values themselves with `inferType`, so sending them
        `OperatonVariableMap` double-wraps it into
        `{value: {value, type}, type: "Json"}`. Both were published as
        `OperatonVariableMap` until #214.

        `OperatonVariableMap` is genuinely the input of exactly one operation,
        `POST /decision/{key}/evaluate`, which accepts either form.

        Every instance started since #218 carries `municipality` (the owning
        organisation, which access checks enforce) and `originTenantId` (the
        caller's organisation at start). Both, with `applicantId`, are
        rejected if a task completion tries to write them, on `/v1` and on
        `/v1/m2m` alike; an M2M start also refuses the first two (#261).
      additionalProperties: true

    ProcessStartResult:
      type: object
      description: |
        Deliberately not the full instance — a start returns what a caller needs
        to follow the case.
      required: [processInstanceId, businessKey, status, startTime]
      properties:
        processInstanceId: { type: string }
        businessKey:
          type: string
          description: |
            When minted by this service, prefixed with the OWNING organisation
            and a timestamp (#234). When supplied by the caller it is kept
            verbatim, so it may follow any convention. Never an access
            control: that is `municipality`.
        status: { type: string, enum: [active, suspended, ended] }
        startTime: { type: string, format: date-time }

    ProcessInstanceSummary:
      type: object
      description: |
        A running instance as Operaton's own `/process-instance` list reports
        it, passed through unaltered. NOT `ProcessStatus`: there is no
        `processInstanceId` (the field is `id`) and no derived `status` -- read
        `ended` and `suspended` instead.
      required: [id, definitionId, definitionKey, ended, suspended]
      properties:
        id:
          type: string
          description: |
            The process instance id. `ProcessStatus` calls the same value
            `processInstanceId`.
        definitionId:
          type: string
          description: |
            The definition this instance runs. Usually `key:version:uuid`, but a
            bare uuid for an instance raised by a call activity -- the engine's
            own inconsistency, passed through.
        definitionKey: { type: string }
        businessKey: { type: [string, 'null'] }
        caseInstanceId:
          type: [string, 'null']
          description: 'CMMN. Always null: this platform deploys BPMN only.'
        ended: { type: boolean }
        suspended: { type: boolean }
        tenantId:
          type: [string, 'null']
          description: Operaton's deployment tenant. Read by no access check.
        links:
          type: array
          description: Operaton's HAL links. Always empty here.
          items: { type: object, additionalProperties: true }

    M2mVariableMap:
      type: object
      description: |
        Variables to send on the M2M surface, keyed by name. **Either form is
        accepted**: a plain value (`{"amount": 42}`) or Operaton's wrapped form
        (`{"amount": {"value": 42, "type": "Integer"}}`). `toOperatonVariables`
        passes a `{value, type}` through and wraps anything else, and both land
        identically -- verified by reading them back from the engine.

        That is the difference from `PlainVariableMap`, which the `/v1` writes
        use: those wrap unconditionally, so the wrapped form double-wraps there.
      additionalProperties: true

    DocumentTemplate:
      type: object
      description: |
        A `DocumentTemplate` resource, as bundled in the deployment and served
        unaltered. The template WITH ITS BINDINGS -- not a rendered document:
        the placeholders are still placeholders.
      required: [id, name, processKey, bindings]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        processKey:
          type: string
          description: |
            The process the template was authored for. May differ from the
            instance's own definition key -- a template bundled with a parent
            process is reachable from a sub-process instance.
        serviceId: { type: [string, 'null'] }
        schemaVersion: { type: integer }
        readonly: { type: boolean }
        status:
          type: string
          description: For example `example` for the templates shipped as fixtures.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        bindings:
          type: array
          description: Each placeholder in the template, and the variable that fills it.
          items:
            type: object
            required: [id, placeholder, variableKey]
            properties:
              id: { type: string }
              placeholder:
                type: string
                description: |
                  The literal token in the template, for example
                  `{{dossierReference}}`.
              variableKey: { type: string }
              source:
                type: string
                description: Where the value comes from, for example `process`.
              label: { type: string }
        zones:
          type: array
          description: The template's layout zones.
          items: { type: object, additionalProperties: true }
        assets:
          type: array
          description: Images and other resources the template references.
          items: { type: object, additionalProperties: true }

    ProcessStatus:
      type: object
      required: [processInstanceId, definitionId, businessKey, status, ended, suspended]
      properties:
        processInstanceId: { type: string }
        definitionId:
          type: string
          description: 'The versioned definition, for example
            `AwbShellProcess:2:5235cc40-…`.'
        businessKey:
          type: [string, 'null']
          description: |
            NULL for an instance that has none. `POST /process/{key}/start`
            always mints one, so a case started through this API has a key --
            but this field is the ENGINE's value, passed straight through, and
            the engine holds instances started other ways: through `/v1/m2m`
            with no key in the body, or directly against Operaton.

            Was `type: string` until #269. The first thing the response
            conformance check caught.
        status: { type: string, enum: [active, suspended, ended] }
        ended: { type: boolean }
        suspended: { type: boolean }

    ProcessLineage:
      type: object
      description: An instance's place in a call chain.
      required:
        [processInstanceId, processDefinitionKey, processDefinitionId, superProcessInstanceId]
      properties:
        processInstanceId: { type: string }
        processDefinitionKey: { type: string }
        processDefinitionId: { type: string }
        superProcessInstanceId:
          type: [string, 'null']
          description: The instance whose call activity started this one; null at the top.

    ActivityHistoryEntry:
      type: object
      description: One activity an instance passed through, as Operaton reports it.
      required: [id, activityId, activityType, startTime]
      properties:
        id: { type: string }
        activityId: { type: string }
        activityName: { type: [string, 'null'] }
        activityType: { type: string }
        assignee: { type: [string, 'null'] }
        startTime: { type: string, format: date-time }
        endTime: { type: [string, 'null'], format: date-time }
        durationInMillis:
          type:
            - integer
            - 'null'
        canceled:
          type: boolean
        processDefinitionKey:
          type: [string, 'null']
          description: Key of the process this step ran in.
        processDefinitionId:
          type: [string, 'null']
          description: Definition (version) of the process this step ran in.
        calledProcessInstanceId:
          type: [string, 'null']
          description: For a `callActivity`, the child instance it started; null otherwise.

    FormSchema:
      type: object
      description: |
        A form-js schema, served unaltered for a renderer to consume. Its
        `components` are the fields; a form of any other kind answers 415
        rather than being converted.
      required: [id, type, components]
      properties:
        id: { type: string }
        type: { type: string }
        components:
          type: array
          items:
            type: object
            additionalProperties: true
        schemaVersion: { type: integer }
        executionPlatform: { type: string }
        executionPlatformVersion: { type: string }

    DecisionDefinition:
      type: object
      description: A DMN decision definition as Operaton reports it.
      required: [id, key, name, version]
      properties:
        id: { type: string }
        key: { type: string }
        category: { type: [string, 'null'] }
        name: { type: string }
        version: { type: integer }
        resource: { type: string }
        deploymentId: { type: string }
        tenantId: { type: [string, 'null'] }
        versionTag:
          type:
            - string
            - 'null'
        historyTimeToLive:
          type:
            - integer
            - 'null'
        decisionRequirementsDefinitionId:
          type:
            - string
            - 'null'
        decisionRequirementsDefinitionKey:
          type:
            - string
            - 'null'

    Task:
      type: object
      description: |
        A live Operaton task. `tenantId` is present but is NOT what access is
        decided by — since #218 that is the instance's `municipality` variable.

        Operaton's CMMN fields (`caseInstanceId`, `caseExecutionId`,
        `caseDefinitionId`) are passed through and are always null here: this
        platform deploys BPMN only.
      required: [id, name, created, processInstanceId, taskDefinitionKey]
      properties:
        id: { type: string }
        name: { type: string }
        assignee: { type: [string, 'null'] }
        created: { type: string, format: date-time }
        due: { type: [string, 'null'], format: date-time }
        followUp: { type: [string, 'null'], format: date-time }
        description: { type: [string, 'null'] }
        owner: { type: [string, 'null'] }
        priority: { type: integer }
        executionId: { type: string }
        processDefinitionId: { type: string }
        processDefinitionKey: { type: [string, 'null'] }
        processInstanceId: { type: string }
        taskDefinitionKey: { type: string }
        suspended: { type: boolean }
        formKey: { type: [string, 'null'] }
        tenantId:
          type: [string, 'null']
          description: Operaton's deployment tenant. Read by no access check.
        taskState:
          type:
            - string
            - 'null'
        parentTaskId:
          type:
            - string
            - 'null'
        delegationState:
          type:
            - string
            - 'null'
        lastUpdated:
          type:
            - string
            - 'null'
          format: date-time
        operatonFormRef:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: A reference to a deployed form, when the task uses one.
        caseInstanceId:
          type:
            - string
            - 'null'
          description: 'CMMN. Always null: this platform deploys BPMN only.'
        caseExecutionId:
          type:
            - string
            - 'null'
          description: CMMN. Always null.
        caseDefinitionId:
          type:
            - string
            - 'null'
          description: CMMN. Always null.

    HistoricTask:
      type: object
      description: |
        A completed task, as Operaton's history reports it. Carries more than
        the live Task — timing, the reason it ended, and the business key.
      required: [id, processInstanceId, taskDefinitionKey, startTime]
      properties:
        id: { type: string }
        name: { type: [string, 'null'] }
        assignee: { type: [string, 'null'] }
        owner: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        deleteReason: { type: [string, 'null'] }
        startTime: { type: string, format: date-time }
        endTime: { type: [string, 'null'], format: date-time }
        duration: { type: [integer, 'null'] }
        priority: { type: integer }
        due: { type: [string, 'null'], format: date-time }
        followUp: { type: [string, 'null'], format: date-time }
        parentTaskId: { type: [string, 'null'] }
        processDefinitionKey: { type: [string, 'null'] }
        processDefinitionId: { type: string }
        processInstanceId: { type: string }
        executionId: { type: string }
        taskDefinitionKey: { type: string }
        taskState: { type: [string, 'null'] }
        businessKey: { type: [string, 'null'] }
        tenantId: { type: [string, 'null'] }
        removalTime: { type: [string, 'null'], format: date-time }
        rootProcessInstanceId: { type: [string, 'null'] }
        activityInstanceId:
          type:
            - string
            - 'null'
        boardOwner:
          type:
            - string
            - 'null'
          description: 'Added by this service, not Operaton: which board the task belongs
            to, read from the process-definition XML and cached per definition
            key.'
        caseDefinitionKey:
          type:
            - string
            - 'null'
          description: CMMN. Always null.
        caseDefinitionId:
          type:
            - string
            - 'null'
          description: CMMN. Always null.
        caseInstanceId:
          type:
            - string
            - 'null'
          description: CMMN. Always null.
        caseExecutionId:
          type:
            - string
            - 'null'
          description: CMMN. Always null.

    TimestampedEnvelope:
      type: object
      description: |
        The envelope /v1/edocs and /v1/doccle answer on SUCCESS. `timestamp` is
        when this service built the response, not when the upstream acted.

        A third variant: the public surface carries `meta.generatedAt`, the
        execution core carries neither. ERROR responses on these two mounts
        drop `timestamp` and use the plain error envelope.
      required: [success, data, timestamp]
      properties:
        success: { type: boolean, const: true }
        data: {}
        timestamp: { type: string, format: date-time }

    EdocsWorkspace:
      type: object
      description: A workspace in the document library.
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    EdocsDocument:
      type: object
      description: |
        A document as the library lists it. `documentNumber` is the library's
        own reference, distinct from `id`.
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        documentNumber: { type: string }

    ValidsignStatus:
      type: string
      description: |
        Where a task's signature stands. `none` means no signature has been
        requested — it is the answer for every task that needs none.
      enum: [none, sent, completed, declined, failed]

    ValidsignSpec:
      type: object
      description: |
        Whether a task needs a signature. The shape is FIXED BY CONTRACT with
        the frontend; the handler carries a comment saying not to rename or add
        fields. Two forms, discriminated by `required`.
      required: [required]
      properties:
        required:
          type: boolean
          description: False for a task that needs no signature, and then nothing else is
            present.
        templateId:
          type: string
          description: Present when `required` is true.
        status:
          $ref: '#/components/schemas/ValidsignStatus'
        packageId:
          type: string
          description: Present once a signature request exists.
        signingUrl:
          type: string
          format: uri-reference
          description: |
            Where the signer completes the ceremony. Present once a request
            exists.

            A `uri-reference`, not an absolute `uri`: against a live ValidSign
            this is that service's absolute URL, but in STUB MODE -- which is
            what acceptance runs -- it is the relative
            `/v1/validsign/stub/ceremony/{packageId}` served by this API's own
            callback router. Declared `format: uri` until #269, which would
            have had a consumer validating the document reject the acceptance
            value.

    BareSuccess:
      type: object
      description: |
        Several /v1/pa writes answer this and nothing else — no `data`, no
        `meta`, no `timestamp`. A sixth response shape in this API.
      required: [success]
      properties:
        success: { type: boolean, const: true }

    PaSignal:
      type: object
      description: |
        A curated signal. NOT organisation-scoped: `pa_signals` carries no
        tenant column, so a signal is shared across organisations by design.
      required: [id, tab, title, status]
      properties:
        id: { type: string }
        tab:
          { type: string, description: 'Which board the signal sits on, for example `politiek`.' }
        dossierId: { type: [string, 'null'], description: 'The dossier it is linked to, if any.' }
        title: { type: string }
        src: { type: [string, 'null'], description: The source system's display name. }
        bron: { type: [string, 'null'] }
        subbron: { type: [string, 'null'] }
        commissie: { type: [string, 'null'] }
        regio: { type: [string, 'null'] }
        sentiment: { type: [string, 'null'] }
        ref: { type: [string, 'null'] }
        rel: { type: [number, 'null'], description: 'Relevance, used for ordering.' }
        impact:
          type: [string, 'null']
          description: |
            The analyst's impact judgement, a free-text label such as `kans`
            or `risico` -- NOT a number. `PATCH /pa/signals/{id}` types the
            field it writes as `impact?: string`. Typed as a number until #269.
        impactLabel: { type: [string, 'null'] }
        duiding: { type: [string, 'null'], description: The curator's interpretation. }
        status:
          type: string
          enum: [candidate, ai_drafted, confirmed, dismissed]
          description: Only `confirmed` signals reach the RSS feed.
        aiDraft: { type: [string, 'null'] }
        confirmedBy: { type: [string, 'null'] }
        confirmedAt: { type: [string, 'null'], format: date-time }
        routing:
          type: [string, 'null']
          description: |
            Where a confirmed signal was routed. A STRING, not an object: the
            only value the SQL ever writes is `watchlist`, set when a signal is
            confirmed without a dossier
            (`routing = CASE WHEN dossier_id IS NULL THEN 'watchlist' ELSE NULL END`),
            and cleared to null on dismissal or when a dossier is linked.
            Typed as an object until #269.
          enum: [watchlist, null]

    PaFeedItem:
      type: object
      description: An uncurated item from an upstream source.
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: [string, 'null'] }
        number: { type: [string, 'null'] }
        date:
          {
            type: [string, 'null'],
            format: date-time,
            description: 'A full timestamp with offset, despite the field name — for example
              2026-09-25T22:47:20.137+02:00.',
          }
        url: { type: [string, 'null'], format: uri }
        source: { type: [string, 'null'] }

    PaAgendaItem:
      type: object
      description: A parliamentary agenda entry.
      required: [id, titel]
      properties:
        id: { type: string }
        nummer: { type: [string, 'null'] }
        soort: { type: [string, 'null'] }
        soortLabel: { type: [string, 'null'] }
        titel: { type: string }
        iso: { type: [string, 'null'], description: 'The date, ISO-formatted.' }
        tijd: { type: [string, 'null'] }
        commissie: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        dossier: { type: [string, 'null'] }
        matchTerm: { type: [string, 'null'], description: Which saved-search term matched. }
        url: { type: [string, 'null'], format: uri }
        live: { type: [boolean, 'null'] }
        stream: { type: [string, 'null'], format: uri }

    PaSearch:
      type: object
      description: |
        A saved search. **This schema is snake_case**, because the operation
        answers the database row rather than a mapped object — unlike
        `PaSignal` on the same mount. It also exposes `tenant_id` and
        `user_id`.
      required: [id, query]
      properties:
        id: { type: string }
        tenant_id: { type: [string, 'null'] }
        user_id: { type: [string, 'null'] }
        scope: { type: [string, 'null'], enum: [tenant, user, null] }
        dossier_id: { type: [string, 'null'] }
        query: { type: object, additionalProperties: true }
        tags: { type: [array, 'null'], items: { type: string } }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        notify: { type: [boolean, 'null'] }

    PaDossier:
      type: object
      description: |
        A dossier as the READS return it — the rendered view, with the
        narrative and planning fields the cockpit displays.

        `POST` and `PATCH` answer a DIFFERENT shape; see `PaDossierAuthoring`.
        One resource, two representations.
      required: [id, naam, status]
      properties:
        id: { type: string }
        naam: { type: string }
        onderwerp: { type: [string, 'null'] }
        doel: { type: [string, 'null'] }
        next: { type: [string, 'null'] }
        status: { type: string }
        momentum: { type: [string, 'null'] }
        progressPct: { type: [number, 'null'] }
        ritme: { type: [object, 'null'], additionalProperties: true }
        kompas: { type: [object, 'null'], additionalProperties: true }
        kompasLog: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        overleg: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        timeline: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        mijlpalen: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        interventies: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        intervLog: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        stakeholders: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        waaromNu: { type: [string, 'null'] }
        waarover: { type: [string, 'null'] }
        narratief: { type: [string, 'null'] }

    PaDossierAuthoring:
      type: object
      description: |
        A dossier as the WRITES return it — what was stored, rather than the
        rendered view. Returned by create, update, archive and unarchive.
      required: [id, naam, onderwerp, status]
      properties:
        id: { type: string, description: Slugified from `naam` at creation. }
        naam: { type: string }
        onderwerp: { type: string }
        status: { type: string, enum: [actief, sluimerend, gearchiveerd] }
        momentum: { type: [string, 'null'] }
        eigenaar: { type: [string, 'null'], description: Who created it. }
        kompas: { type: [object, 'null'], additionalProperties: true }
        md: { type: [object, 'null'], additionalProperties: true }
      additionalProperties: true

    PaTemplate:
      type: object
      required: [id, naam]
      properties:
        id: { type: string }
        naam: { type: string }
        cat: { type: [string, 'null'] }
        beschrijving: { type: [string, 'null'] }
        versie: { type: [string, 'null'] }
        eigenaar: { type: [string, 'null'] }
        gebruikt: { type: [integer, 'null'], description: How often it has been used. }
        seed:
          type: [object, 'null']
          additionalProperties: true
          description: |
            The template's SEED CONTENT -- the fields a new dossier starts
            with, for example
            `{ onderwerp, waaromNu, waarover, onsVerhaal }`. Stored as JSONB
            (`JSON.stringify(seed ?? {})` on write) and returned as an object.

            Documented as a boolean meaning "shipped with the platform" until
            #269. That was doubly wrong: the type, and the meaning -- which
            belongs to `status`, not to this field.

    PaSnippet:
      type: object
      required: [id, naam, md]
      properties:
        id: { type: string }
        naam: { type: string }
        cat: { type: [string, 'null'] }
        md: { type: string, description: 'The snippet body, in Markdown.' }

    PlainEnvelope:
      type: object
      description: |
        The plainest envelope in this API: success and a payload, with no
        `meta` and no `timestamp`. Used by the execution core and by the board
        views here.
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}

    RipInstance:
      type: object
      description: |
        A RIP phase instance as the boards show it. `endTime` is present on
        completed instances and absent on active ones.
      required: [id, businessKey, startTime]
      properties:
        id: { type: string }
        businessKey: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: [string, 'null'], format: date-time }
        projectNumber: { type: [string, 'null'] }
        projectName: { type: [string, 'null'] }
        edocsWorkspaceId: { type: [string, 'null'] }
        leadRole: { type: [string, 'null'] }
        phaseCode:
          type:
            - string
            - 'null'
          description: Which phase the instance belongs to. Present on the cross-phase
            aggregate; the per-phase reads already have it in the path.

    CapacityClaim:
      type: object
      description: A capacity claim as the board shows it.
      required: [id, startTime]
      properties:
        id: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: [string, 'null'], format: date-time }
        jobTitle: { type: [string, 'null'] }
        requestType: { type: [string, 'null'] }
        boardDecision: { type: [string, 'null'] }
        advisoryGroup: { type: [string, 'null'] }

    BesluitListItem:
      type: object
      description: A besluit (GedelegeerdBesluitProcess instance) as the Besluitvorming overview lists it.
      required: [id, startTime]
      properties:
        id: { type: string }
        businessKey: { type: [string, 'null'] }
        startTime: { type: string, format: date-time }
        endTime: { type: [string, 'null'], format: date-time }
        onderwerp: { type: [string, 'null'] }
        besluitType: { type: [string, 'null'] }
        financieleGevolgen: { type: [number, 'null'] }
        uitkomst:
          type: [string, 'null']
          description: ondertekend, or geëscaleerd — genomen/afgewezen; null while undecided.
        huidigeStap:
          type: [string, 'null']
          description: The open task while running; null once completed.
        kenmerk: { type: [string, 'null'] }
        zaaknummer: { type: [string, 'null'] }
        motivering: { type: [string, 'null'] }
        voorgesteldBesluit: { type: [string, 'null'] }
        escalatieReden: { type: [string, 'null'] }

    HrOnboarding:
      type: object
      description: A completed onboarding run.
      required: [id, startTime]
      properties:
        id: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: [string, 'null'], format: date-time }
        employeeId: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }

    McpSource:
      type: object
      required: [id, displayName, connected]
      properties:
        id: { type: string }
        displayName: { type: string }
        description: { type: [string, 'null'] }
        connected:
          type: boolean
          description: |
            False means chat cannot use it; selecting only disconnected
            sources answers 503.
        actsAsPerson:
          type: boolean
          description: |
            Present and true when the source acts as the signed-in person, with
            their own rights (eDOCS), rather than as a service account.

    McpModel:
      type: object
      required: [id, displayName, providerId]
      properties:
        id: { type: string, description: 'Pass to `POST /mcp/chat` as `modelId`.' }
        displayName: { type: string }
        providerId: { type: string }
        providerDisplayName: { type: [string, 'null'] }

    BrpProblem:
      description: |
        Problem details, always `BRP_API_ERROR`. When the upstream rejected the
        query, a `details` extension member carries its own validation report.
        No other error in this API has that member.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            code: { const: BRP_API_ERROR }
            details:
              type: object
              description: "The upstream's report, typically `{ invalidParams: [...] }`."
              additionalProperties: true

  requestBodies:
    M2mHistoryQuery:
      required: false
      description: An Operaton history query.
      content:
        application/json:
          schema:
            type: object
            description: |
              Passed to Operaton's history query unaltered. Not enumerated
              here: this service neither validates nor constrains it.
            additionalProperties: true

  responses:
    M2mHistory:
      description: The matching historic instances; all of them when no body was sent.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { type: boolean, const: true }
              data:
                type: array
                items:
                  type: object
                  description: A historic process instance as Operaton reports it.
                  additionalProperties: true
      headers:
        API-Version:
          $ref: '#/components/headers/ApiVersion'

    UnknownPhase:
      description: |
        No RIP phase with that code (`UNKNOWN_PHASE`). Codes are dotted --
        `R2.1`, not `R21`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PaNotFound:
      description: |
        No such signal, search or dossier for this organisation (`NOT_FOUND`).
        Dossiers and searches are organisation-scoped, so a row belonging to
        another organisation is reported as absent rather than forbidden.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    UpstreamFailed:
      description: |
        The external system refused the request or could not be reached
        (`EDOCS_ERROR`, `DOCCLE_ERROR`). A 502 rather than a 500: the fault is
        upstream, not in this service.

        Error responses on these mounts carry no `timestamp`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    EdocsForbidden:
      description: |
        Refused before or by eDOCS. The codes:

        - **`FORBIDDEN`** -- a person without the `caseworker` or `admin` realm role.
        - **`EDOCS_CLIENT_NOT_ALLOWED`** -- a machine client not on `EDOCS_ALLOWED_CLIENTS`.
        - **`EDOCS_USER_TOKEN_UNAVAILABLE`** -- a person with no Entra ID token
          (a Keycloak account, or signed in before tokens were stored).
        - **`EDOCS_ACCESS_DENIED`** -- eDOCS refused the person's token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    EdocsUnauthorized:
      description: |
        `MISSING_TOKEN` / `INVALID_TOKEN` as everywhere, or **`EDOCS_REAUTH_REQUIRED`**:
        the person's Entra session can no longer be refreshed -- sign in again.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Unauthorized:
      description: |
        No usable bearer token. Two codes, both from `jwtMiddleware`:
        **`MISSING_TOKEN`** when the `Authorization` header is absent or is not
        a bearer, and **`INVALID_TOKEN`** when a token is present but does not
        verify against the realm's JWKS -- expired, wrong issuer or audience,
        bad signature.

        Said `UNAUTHORIZED` until #214. That code is real, but it comes from
        the role and assurance guards further in, never from the token check
        this response describes.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    M2mForbidden:
      description: |
        Refused before the handler ran. Two distinct codes share this status, so
        a consumer should read `code` rather than the status alone:

        - **`M2M_CLIENT_NOT_ALLOWED`** -- the token's `azp` is not on
          `M2M_ALLOWED_CLIENTS`, or the token carries no `azp` at all. The
          ordinary refusal: every realm token is valid for this audience, and
          this is what stops a citizen's or a caseworker's from reaching the
          machine surface (#237).
        - **`OPERATION_NOT_PERMITTED`** -- the curation gate. The operation is
          not on `M2M_ALLOWED_OPERATIONS` in `m2m.routes.ts`. All 18 are listed
          today, so it cannot occur unless one is deliberately withdrawn from
          machine consumers.

        `TENANT_MISMATCH` never appears on this group: no organisation is
        derived, so there is nothing to mismatch.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      headers:
        API-Version:
          $ref: '#/components/headers/ApiVersion'

    PaForbidden:
      description: |
        A CAPABILITY refusal, not an organisation one -- it is never
        `TENANT_MISMATCH`. Two codes reach it:

        - **`FORBIDDEN`** -- the token lacks the `public-affairs` realm role.
          `pa.routes.ts` applies `requireRoles('public-affairs')` with a
          `router.use`, so this is reachable on EVERY operation in this group,
          before the handler runs.
        - **`FORBIDDEN_PUBLISH`** -- on the two operations that can publish a
          dossier, when the caller holds the role but not the publish
          capability.

        Only the second was documented, on two operations, until #269 -- so the
        role refusal that guards all 33 appeared nowhere.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      headers:
        API-Version:
          $ref: '#/components/headers/ApiVersion'

    TenantMismatch:
      description: |
        The resource belongs to another organisation, or carries no
        organisation label at all (`TENANT_MISMATCH`, detail
        "Access denied: organisation mismatch").

        Failing closed on a missing label is deliberate (#218). This is NOT
        used for role refusals, which answer `FORBIDDEN`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    AmbiguousDeployment:
      description: |
        The process key is deployed under several organisations and none of
        them is the caller's, so there is no basis for choosing which one
        handles the case (`AMBIGUOUS_DEPLOYMENT`). The `detail` names the
        organisations. When the caller's own organisation is among them, it
        wins and no 409 is raised.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    RateLimited:
      description: |
        More than 10 requests in 15 minutes from this IP. Sent by
        publicWriteLimiter, which answers before the handler runs.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    BadRequest:
      description: |
        The request body is not valid JSON (`MALFORMED_BODY`). Refused before
        routing by the app-wide parser, so any operation can answer it, whatever
        its method -- see "Error responses" above. Operations that validate
        their own input document their own 400 instead.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
      headers:
        API-Version:
          $ref: '#/components/headers/ApiVersion'

    Error:
      description: The request failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        API-Version:
          $ref: '#/components/headers/ApiVersion'

# Applied to every operation that does not override it with `security: []`.
# The unauthenticated surface is the exception and says so per operation.
security:
  - bearerAuth: []
