  # ── /v1/hr ────────────────────────────────────────────────────────────────

  /hr/onboarding/completed:
    get:
      operationId: listHrOnboardingCompleted
      tags: [HR]
      summary: Completed onboarding runs
      responses:
        '200':
          description: The completed runs.
