  /task/{id}/complete:
    post:
      operationId: completeTask
      tags: [Task]
      summary: Complete a task
      description: |
        Completes the task with the supplied variables, advancing the process.
        Admits the owning organisation only.

        **Three variables are set once at start and can never be written here**:
        `municipality`, `originTenantId` and `applicantId`. A body containing any
        of them is refused with `400 RESERVED_VARIABLE`, naming the offender —
        rewriting the organisation label would move a case between
        organisations.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variables]
              properties:
                variables: { $ref: '#/components/schemas/PlainVariableMap' }
      responses:
        '200':
          description: The task was completed.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [taskId, status]
                    properties:
                      taskId: { type: string }
                      status: { type: string, const: completed }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            The body tried to write `municipality`, `originTenantId` or
            `applicantId` (`RESERVED_VARIABLE`).
            The offending names are in the `reserved` extension member.
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: |
            Operaton refused the completion (`TASK_COMPLETE_FAILED`) — for
            example when a required form field is missing, or a downstream
            gateway cannot evaluate.
          $ref: '#/components/responses/Error'

  # ── /v1/m2m ───────────────────────────────────────────────────────────────
  #
  # THE ONE GROUP WITH CONSUMERS OUTSIDE THIS REPOSITORY, which is why a
  # published contract matters most here and why the divergences below are
  # written out rather than smoothed over.
  #
  # It reads like the machine-facing twin of /v1/process, /v1/decision and
  # /v1/task, and the RESPONSE schemas genuinely are the same objects -- Task,
  # ProcessStatus, FormSchema and DecisionDefinition are $ref'd straight from
  # the groups above, each checked field-for-field against a live response.
  # Almost everything else differs.
  #
  # WHO MAY CALL. Two checks run before any handler, in this order:
  #
  #   1. jwtMiddleware        401 MISSING_TOKEN / INVALID_TOKEN
  #   2. requireM2mClient     403 M2M_CLIENT_NOT_ALLOWED
  #
  # The second is the whole security model of this group (#237, fixed by #259).
  # The token is an ordinary realm token -- same issuer, same
  # `ronl-business-api` audience, same RS256 -- so the AUDIENCE cannot tell a
  # machine from a person: every citizen and caseworker in the realm holds one
  # for it. The AUTHORISED PARTY can. `requireM2mClient` requires the token's
  # `azp` to be on `M2M_ALLOWED_CLIENTS`, which is `operaton-mcp-client` alone
  # today. Adding a consumer means adding its client id to that variable on the
  # App Service; nothing changes in Keycloak.
  #
  # OpenAPI has no way to express "and the azp must be on a list", so these 18
  # carry `m2mOAuth` -- a clientCredentials flow, distinct from the bearerAuth
  # the rest of the API uses -- and the condition itself lives in that scheme's
  # description and in the 403.
  #
  # NO CALLER ORGANISATION. There is no tenantMiddleware here. An M2M client is
  # a system actor, so no organisation is derived from its token, and
  # consequently:
  #
  #   - nothing answers TENANT_MISMATCH -- the 11 operations that do on /v1
  #     have no equivalent check here;
  #   - `GET /m2m/task` and `GET /m2m/process` are unfiltered, where their /v1
  #     twins are narrowed to the caller's organisation and roles.
  #
  # THE CASES ARE STILL REAL CASES, THOUGH. Having no caller organisation is
  # not the same as the cases having none. `operaton.service.ts` labels an
  # M2M start with the PROCESS DEFINITION'S OWN deployed tenant, so a case
  # started through this surface normally belongs to a real organisation and is
  # visible to that organisation's staff through /v1. Verified on a running
  # backend across all three branches:
  #
  #   ZorgtoeslagProvisionalSubProcessE2E (toeslagen)  ->  municipality=toeslagen
  #   RipR21Process (flevoland)                        ->  municipality=flevoland
  #   ReviewInvoice (no tenant)                        ->  municipality=m2m
  #
  # So `m2m` is the FALLBACK for an untenanted definition, not the label M2M
  # cases carry. `originTenantId` is never set by this surface.
  #
  # A body cannot override that: `municipality` and `originTenantId` are
  # refused at start, and all three reserved names at completion (#261).
  #
  # WHICH ENGINE. The same one the rest of the API uses, on every tier (#262):
  # an id obtained here resolves through /v1 and vice versa. Until 3 October
  # 2026 ACC and PROD pointed these routes at a separate engine (operaton-doc).
  # `OPERATON_M2M_BASE_URL` can still set one aside, so a consumer should not
  # build on the two surfaces sharing instances.
  #
  # DIVERGENCES FROM THE /v1 TWINS, all verified against a running backend:
  #
  #   POST …/start              200 here, 201 on /v1
  #   POST …/start              businessKey kept verbatim; /v1 prefixes a
  #                             minted one with the owning organisation (#234)
  #   POST …/task/{id}/claim    { taskId, claimed }; /v1 sends { taskId, assignee }
  #   POST …/task/{id}/claim    an optional body `userId` sets the assignee;
  #                             /v1 ignores the body and uses the token
  #   POST …/task/{id}/complete { taskId, completed }; /v1 sends { taskId, status }
  #   GET  /m2m/process         exists; there is no bare `GET /v1/process`
  #   POST …/process/history    takes a filter BODY (the GET spelling was
  #                             removed, #263, #312); /v1's is a GET with a
  #                             required `applicantId` query parameter
  #   —                         403 OPERATION_NOT_PERMITTED, the curation gate
  #
  # VARIABLES GO IN EITHER FORM. `toOperatonVariables` passes a `{value,type}`
  # through and wraps anything else, so plain and wrapped bodies land
  # identically. On /v1 only `decision/{key}/evaluate` does this; start and
  # complete there wrap unconditionally.
  #
  # THE CURATION GATE. Every operation first checks its name against
  # `M2M_ALLOWED_OPERATIONS` in m2m.routes.ts and answers
  # `403 OPERATION_NOT_PERMITTED` if it is absent. All 18 are listed today, so
  # that 403 is unreachable without editing the file -- it is a kill switch for
  # withdrawing one operation from machine consumers without touching a route.
  # It is documented on every operation because it applies to every operation.

  /m2m/process:
    get:
      operationId: listM2mProcessInstances
      tags: [Machine-to-machine]
      summary: All running process instances
      security: [{ m2mOAuth: [] }]
      description: |
        Unfiltered: every running instance on the M2M engine, with no
        organisation narrowing. There is no `GET /v1/process` twin — the
        browser applications reach instances through the task lists and the
        RIP and capacity boards instead, all of which are organisation-scoped.

        Query parameters are passed to Operaton's `GET /process-instance`
        unaltered, so its filters (`processDefinitionKey`, `businessKey`,
        `variables`, `firstResult`, `maxResults`, …) all work. They are not
        enumerated here because this service neither validates nor constrains
        them; the engine's own reference is authoritative.
      responses:
        '200':
          description: The running instances.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProcessInstanceSummary' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '500':
          description: '`PROCESS_LIST_FAILED`.'
          $ref: '#/components/responses/Error'

  /m2m/process/{key}/start:
    post:
      operationId: startM2mProcess
      tags: [Machine-to-machine]
      summary: Start a process instance
      security: [{ m2mOAuth: [] }]
      description: |
        **Answers 200, where `POST /v1/process/{key}/start` answers 201.** The
        difference is not meaningful — both created an instance — but it is
        real, and a consumer checking for 201 would be wrong here.

        **Which organisation gets the case.** When the body supplies no
        `municipality`, the instance is labelled with the PROCESS DEFINITION'S
        own deployed tenant — so starting a `toeslagen` process here produces a
        `toeslagen` case, visible to that organisation's staff through `/v1`
        like any other. A definition carrying no tenant falls back to the
        literal `m2m`. `originTenantId` is never set.

        **The caller cannot choose the organisation.** A body supplying
        `municipality` or `originTenantId` is refused with
        `400 RESERVED_VARIABLE` (#261): the deployed tenant is the only source
        of the label on this surface. `applicantId` is accepted — a machine may
        start a case on a citizen's behalf.

        A `businessKey` is kept **verbatim**. `/v1` prefixes a minted one with
        the owning organisation (#234); there is no organisation here to prefix
        with, and none is minted when the field is omitted.

        `variables` may be sent plain (`{"amount": 42}`) or in Operaton's
        wrapped form (`{"amount": {"value": 42, "type": "Integer"}}`) — both
        land identically. Neither `409 AMBIGUOUS_DEPLOYMENT` nor
        `403 TENANT_MISMATCH` can occur: both come from resolving a key against
        the caller's organisation, and there is none.
      parameters:
        - $ref: '#/components/parameters/M2mProcessKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                businessKey:
                  type: string
                  description: |
                    Optional, and kept exactly as given. Unlike `/v1`, nothing
                    is minted when it is absent — the instance then has none.
                variables: { $ref: '#/components/schemas/M2mVariableMap' }
      responses:
        '200':
          description: The instance was started.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [processInstanceId, businessKey]
                    properties:
                      processInstanceId: { type: string }
                      businessKey:
                        type: [string, 'null']
                        description: Null when the request supplied none.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            The body tried to set `municipality` or `originTenantId`
            (`RESERVED_VARIABLE`).
            The offending names are in the `reserved` extension member.
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '500':
          description: |
            Operaton refused the start (`PROCESS_START_FAILED`) — an unknown
            key, a suspended definition, or a variable the process rejects.
            There is no 404: an unknown key fails here.
          $ref: '#/components/responses/Error'

  /m2m/process/history:
    post:
      operationId: queryM2mProcessHistory
      tags: [Machine-to-machine]
      summary: Query instance history
      security: [{ m2mOAuth: [] }]
      description: |
        A query, not a write: POST because the filter is a body. The body is
        handed to Operaton's `POST /history/process-instance` unaltered, so
        every filter that query supports works: `processDefinitionKey`,
        `variables`, `finished`, `startedAfter`, sorting, paging. An empty body,
        or none at all, returns the unfiltered history.

        Until #263 this was a GET carrying a body. That spelling answered,
        deprecated, for one release (v2026.10.0) and is removed (#312): RFC 9110
        gives a body on GET no meaning, and clients, proxies and generated SDKs
        drop it, so a caller whose filter was dropped silently received the
        unfiltered history.

        `GET /v1/process/history` is not this operation under another name. It
        takes a **required `applicantId` query parameter**, returns one
        applicant's completed instances, and is role-checked.
      requestBody:
        $ref: '#/components/requestBodies/M2mHistoryQuery'
      responses:
        '200':
          $ref: '#/components/responses/M2mHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '500':
          description: '`PROCESS_HISTORY_FAILED`.'
          $ref: '#/components/responses/Error'

  /m2m/process/{id}/status:
    get:
      operationId: getM2mProcessStatus
      tags: [Machine-to-machine]
      summary: Whether an instance is running
      security: [{ m2mOAuth: [] }]
      description: |
        The same object `GET /v1/process/{id}/status` returns, with no
        organisation check.

        An instance that has ENDED answers 404, not a status of `ended`: the
        lookup goes to Operaton's runtime endpoint, which forgets a finished
        instance. Use `process/history` for one that has ended.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The instance.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ProcessStatus' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '404':
          description: |
            No such RUNNING instance (`PROCESS_NOT_FOUND`) — including one that
            has ended.
          $ref: '#/components/responses/Error'

  /m2m/process/{id}/variables:
    get:
      operationId: getM2mProcessVariables
      tags: [Machine-to-machine]
      summary: Current variables of a running instance
      security: [{ m2mOAuth: [] }]
      description: |
        Values are returned PLAIN — Operaton's `{value, type}` wrapper is
        unwrapped. Requests that SET variables may use either form; see
        `M2mVariableMap`.

        Like `status` above this reads the runtime, so it answers 404 for an
        instance that has ended; `historic-variables` is the one to use then.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The variables.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PlainVariableMap' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '404':
          description: No such running instance (`PROCESS_NOT_FOUND`).
          $ref: '#/components/responses/Error'

  /m2m/process/{id}/historic-variables:
    get:
      operationId: getM2mProcessHistoricVariables
      tags: [Machine-to-machine]
      summary: Variables of an instance, live or finished
      security: [{ m2mOAuth: [] }]
      description: |
        The same plain shape as the live read, and it works for an instance
        that has ended — which is what the two reads above cannot do.

        **An unknown id answers `200` with an empty object, not `404`.** The
        history query returns no rows rather than failing, and no row is not an
        error. The 404 below is reachable only when the engine itself refuses
        the query. Verified against a running backend; a consumer treating `{}`
        as "no such instance" is guessing, because a real instance carrying no
        variables answers the same way.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: |
            The variables. Empty for an unknown id, and for a real instance
            carrying none.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PlainVariableMap' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '404':
          description: |
            `PROCESS_NOT_FOUND`, raised when the engine refuses the history
            query. NOT the answer for an unknown id; see the 200.
          $ref: '#/components/responses/Error'

  /m2m/process/{id}/decision-document:
    get:
      operationId: getM2mProcessDecisionDocument
      tags: [Machine-to-machine]
      summary: The decision document template linked to a case
      security: [{ m2mOAuth: [] }]
      description: |
        **This operation does not use the `{ success, data }` envelope.** It
        answers `{ success, template }`, and so does its `/v1` twin — recorded
        as it is rather than normalised, because a consumer reads what the
        handler sends.

        The template is the `DocumentTemplate` resource bundled in the
        deployment, found by following `ronl:documentRef` on a user task in the
        instance's BPMN. It is the template WITH ITS BINDINGS, not a rendered
        document. Works for instances that have ended.

        Most processes carry no `ronl:documentRef`, in which case this answers
        404 — the usual outcome, not an error worth alerting on.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      responses:
        '200':
          description: The document template.
          content:
            application/json:
              schema:
                type: object
                required: [success, template]
                properties:
                  success: { type: boolean, const: true }
                  template: { $ref: '#/components/schemas/DocumentTemplate' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '404':
          description: |
            No `ronl:documentRef` on this process, no matching `.document`
            resource in the deployment, or no such instance
            (`DOCUMENT_NOT_FOUND` for all three).
          $ref: '#/components/responses/Error'

  /m2m/process/{key}/start-form:
    get:
      operationId: getM2mProcessStartForm
      tags: [Machine-to-machine]
      summary: The deployed start form for a process
      security: [{ m2mOAuth: [] }]
      description: |
        The form-js schema a caller renders to start this process, served
        unaltered.

        Unlike its `/v1` twin this cannot answer `409 AMBIGUOUS_DEPLOYMENT`:
        that arises from resolving a key against the caller's organisation, and
        there is none. A key deployed under several organisations resolves
        through the M2M surface regardless of which.
      parameters:
        - $ref: '#/components/parameters/M2mProcessKey'
      responses:
        '200':
          description: The form schema.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/FormSchema' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '404':
          description: |
            No such process, or it has no start-event form (`FORM_NOT_FOUND`).
            A process started through the API rather than a form answers this
            normally.
          $ref: '#/components/responses/Error'
        '415':
          description: |
            The deployed form is not a form-js schema — an embedded or external
            form this service cannot serve (`UNSUPPORTED_FORM_TYPE`).
          $ref: '#/components/responses/Error'

  /m2m/process/{key}/variable-hints:
    get:
      operationId: getM2mProcessVariableHints
      tags: [Machine-to-machine]
      summary: Variable names and types a process expects
      security: [{ m2mOAuth: [] }]
      description: |
        **This operation does not use the `{ success, data }` envelope.** It
        answers `{ success, variables }`, the same as its `/v1` twin.

        The hints are derived from the deployed BPMN, so they describe what the
        process reads — useful for assembling a `start` body without a form.

        **An unknown key answers `200` with an empty array, not `404`.**
        Verified against a running backend. A process that genuinely declares
        no variables answers the same way, so an empty array does not
        distinguish the two.
      parameters:
        - $ref: '#/components/parameters/M2mProcessKey'
      responses:
        '200':
          description: |
            The hints. Empty for an unknown key, and for a process declaring
            none.
          content:
            application/json:
              schema:
                type: object
                required: [success, variables]
                properties:
                  success: { type: boolean, const: true }
                  variables:
                    type: array
                    items:
                      type: object
                      required: [name, type]
                      properties:
                        name: { type: string }
                        type:
                          type: string
                          description: |
                            Operaton's type name, for example String, Integer,
                            Boolean, Object.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '500':
          description: '`VARIABLE_HINTS_FAILED`.'
          $ref: '#/components/responses/Error'

  /m2m/process/{id}:
    delete:
      operationId: deleteM2mProcessInstance
      tags: [Machine-to-machine]
      summary: Cancel a running instance
      security: [{ m2mOAuth: [] }]
      description: |
        Cancels the instance, with no organisation check — where `/v1` admits
        the owning organisation only and refuses even the case's own applicant.

        An instance that has already ended or been cancelled answers **500**,
        not 404: the engine's refusal is reported as a failure to cancel.
        Verified against a running backend.
      parameters:
        - $ref: '#/components/parameters/ProcessInstanceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Recorded on the instance as Operaton's delete reason.
      responses:
        '200':
          description: The instance was cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [message, processInstanceId]
                    properties:
                      message: { type: string, const: Process instance cancelled }
                      processInstanceId: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '500':
          description: |
            `PROCESS_DELETE_FAILED`. Also the answer for an unknown id and for
            one that has already ended.
          $ref: '#/components/responses/Error'

  /m2m/task:
    get:
      operationId: listM2mTasks
      tags: [Machine-to-machine]
      summary: All open tasks
      security: [{ m2mOAuth: [] }]
      description: |
        Every open task on the M2M engine, across all organisations and all
        candidate groups.

        `GET /v1/task` is narrowed twice — by the caller's organisation and by
        their realm roles, which map one-to-one to the BPMN candidate groups.
        Neither filter applies here, so this list is a superset of what any
        person would see.
      responses:
        '200':
          description: The open tasks.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '500':
          description: '`TASK_LIST_FAILED`.'
          $ref: '#/components/responses/Error'

  /m2m/task/{id}:
    get:
      operationId: getM2mTask
      tags: [Machine-to-machine]
      summary: One task
      security: [{ m2mOAuth: [] }]
      description: |
        The same object `GET /v1/task/{id}` returns, with no organisation
        check.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/Task' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '404':
          description: |
            No such task (`TASK_NOT_FOUND`). A completed task answers this too.
          $ref: '#/components/responses/Error'

  /m2m/task/{id}/variables:
    get:
      operationId: getM2mTaskVariables
      tags: [Machine-to-machine]
      summary: Variables visible to a task
      security: [{ m2mOAuth: [] }]
      description: |
        The variables of the task's process instance, returned PLAIN.

        **An unknown task id answers `500`, not `404`** — unlike
        `GET /m2m/task/{id}` beside it, which answers 404 for the same id.
        Verified against a running backend. The inconsistency is the handler's,
        not the engine's, and is recorded rather than smoothed over.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The variables.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PlainVariableMap' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '500':
          description: '`TASK_VARIABLES_FAILED`. Also the answer for an unknown task id.'
          $ref: '#/components/responses/Error'

  /m2m/task/{id}/form-schema:
    get:
      operationId: getM2mTaskFormSchema
      tags: [Machine-to-machine]
      summary: The deployed form for a task
      security: [{ m2mOAuth: [] }]
      description: The form-js schema attached to the task, served unaltered.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: The form schema.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/FormSchema' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '404':
          description: No such task, or it has no deployed form (`FORM_NOT_FOUND`).
          $ref: '#/components/responses/Error'
        '415':
          description: The deployed form is not a form-js schema (`UNSUPPORTED_FORM_TYPE`).
          $ref: '#/components/responses/Error'

  /m2m/task/{id}/claim:
    post:
      operationId: claimM2mTask
      tags: [Machine-to-machine]
      summary: Assign a task
      security: [{ m2mOAuth: [] }]
      description: |
        **The body matters here, and does not on `/v1`.**
        `POST /v1/task/{id}/claim` ignores it and assigns the calling user;
        this operation assigns whoever `userId` names, falling back to the
        token's subject when it is absent. An M2M client claiming on its own
        behalf would be assigning a service account, which is rarely what a
        machine consumer wants, so the override is the normal path.

        The `userId` is written through to Operaton unchecked — it need not be
        a Keycloak subject, and no such user has to exist.

        The answer is `{ taskId, claimed }`; `/v1` sends `{ taskId, assignee }`.

        Claiming again FOR THE SAME assignee is idempotent and answers 200.
        Claiming a held task for a DIFFERENT assignee is refused by the engine
        and reported as **500**, not 409, and the existing assignee stands.
        Both verified against a running backend.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: |
                    Who to assign the task to. Falls back to the token's
                    subject — the M2M client's service account — when absent.
      responses:
        '200':
          description: The task was assigned.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [taskId, claimed]
                    properties:
                      taskId: { type: string }
                      claimed: { type: boolean, const: true }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '500':
          description: |
            `TASK_CLAIM_FAILED`. Covers an unknown task, a completed one, and a
            claim for a different assignee while the task is held.
          $ref: '#/components/responses/Error'

  /m2m/task/{id}/complete:
    post:
      operationId: completeM2mTask
      tags: [Machine-to-machine]
      summary: Complete a task
      security: [{ m2mOAuth: [] }]
      description: |
        Completes the task with the supplied variables, advancing the process.
        The answer is `{ taskId, completed }`; `/v1` sends
        `{ taskId, status: "completed" }`.

        **Three variables are set once at start and can never be written here**,
        exactly as on `/v1`: `municipality`, `originTenantId` and
        `applicantId`. A body containing any of them is refused with
        `400 RESERVED_VARIABLE`, naming the offenders (#261) — rewriting the
        organisation label would move a case between organisations.

        Variables may be sent plain or wrapped; see `M2mVariableMap`.

        Completing a task that is already completed answers **500**.
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                variables: { $ref: '#/components/schemas/M2mVariableMap' }
      responses:
        '200':
          description: The task was completed.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [taskId, completed]
                    properties:
                      taskId: { type: string }
                      completed: { type: boolean, const: true }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            The body tried to write `municipality`, `originTenantId` or
            `applicantId` (`RESERVED_VARIABLE`).
            The offending names are in the `reserved` extension member.
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '500':
          description: |
            `TASK_COMPLETE_FAILED` — a missing required form field, a gateway
            that cannot evaluate, an unknown task, or one already completed.
          $ref: '#/components/responses/Error'

  /m2m/decision/{key}/evaluate:
    post:
      operationId: evaluateM2mDecision
      tags: [Machine-to-machine]
      summary: Evaluate a DMN decision
      security: [{ m2mOAuth: [] }]
      description: |
        Evaluates the decision against the supplied variables and returns
        Operaton's result rows unaltered. Identical in shape to
        `POST /v1/decision/{key}/evaluate`; only the security differs.

        Input may be plain or wrapped. The OUTPUT is always wrapped
        (`{value, type, valueInfo}`) — unlike the variable reads elsewhere,
        which unwrap. An input set matching no rule answers `200` with an empty
        array, not a 404.

        **The 500 message is Operaton's own, verbatim.** An unknown key
        produces `"No matching decision definition with key: … and no
        tenant-id"` rather than a message this service wrote. That is the one
        place in this API where an upstream string reaches the caller.
      parameters:
        - $ref: '#/components/parameters/M2mDecisionKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                variables: { $ref: '#/components/schemas/M2mVariableMap' }
      responses:
        '200':
          description: |
            The matched rules, one object per row. Empty when nothing matched.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items:
                      type: object
                      description: One result row, keyed by output name.
                      additionalProperties: { $ref: '#/components/schemas/OperatonVariable' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '500':
          description: |
            `DECISION_EVALUATION_FAILED`, carrying Operaton's own message. Also
            the answer for an unknown decision key.
          $ref: '#/components/responses/Error'

  /m2m/decision/{key}:
    get:
      operationId: getM2mDecisionDefinition
      tags: [Machine-to-machine]
      summary: A DMN decision definition
      security: [{ m2mOAuth: [] }]
      description: |
        The latest version of the decision definition, as Operaton reports it.
        Identical in shape to `GET /v1/decision/{key}`; only the security
        differs.
      parameters:
        - $ref: '#/components/parameters/M2mDecisionKey'
      responses:
        '200':
          description: The definition.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/DecisionDefinition' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/M2mForbidden'
        '404':
          description: No such decision (`DECISION_NOT_FOUND`).
          $ref: '#/components/responses/Error'

  # ── /v1/edocs and /v1/doccle ──────────────────────────────────────────────
  #
  # Both are proxies onto external systems, and both answer a THIRD envelope
  # shape: { success, data, timestamp }. The public surface uses
  # { success, data, meta.generatedAt }, the execution core uses
  # { success, data } alone. Three variants in one API; each is recorded as it
  # is rather than normalised.
  #
  # Both routers apply jwtMiddleware but NOT tenantMiddleware: a document
  # library and a delivery channel are infrastructure, not cases, so there is no
  # organisation label to check. `502` means the upstream refused or could not
  # be reached -- it is the usual failure here, not `500`.
  #
  # ON ACCEPTANCE BOTH RUN IN STUB MODE (`status: "stub"`), so the shapes below
  # were captured from stubs. The envelope and the status codes are the
  # service's own and are real; the payloads a live eDOCS returns may carry more
  # fields than the examples suggest.

  /edocs/status:
    get:
      operationId: getEdocsStatus
      tags: [Documents]
      summary: Whether the document library is reachable
      responses:
        '200':
          description: The library's state, including whether it is stubbed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, library, baseUrl, stubMode, reachable, authenticated]
                        properties:
                          status:
                            {
                              type: string,
                              description: '`stub` when no live library is configured.',
                            }
                          library: { type: string }
                          baseUrl: { type: string }
                          stubMode: { type: boolean }
                          reachable: { type: boolean }
                          authenticated: { type: boolean }
                          latencyMs: { type: integer, description: Present only when measured. }
                          error: { type: string, description: Present only when the check failed. }
                          user:
                            type: object
                            description: Present for a person only -- can eDOCS be reached as them?
                            required: [available]
                            properties:
                              available: { type: boolean }
                              authenticated: { type: boolean }
                              edocsUserId: { type: string }
                              problem:
                                type: string
                                enum:
                                  [
                                    EDOCS_USER_TOKEN_UNAVAILABLE,
                                    EDOCS_REAUTH_REQUIRED,
                                    EDOCS_USER_LOOKUP_FAILED,
                                    STUB_MODE,
                                  ]
                                description: >-
                                  EDOCS_USER_LOOKUP_FAILED -- Keycloak or Entra ID could not be asked for the
                                  person's token (an outage, not a decision); `error` says why.
                              error: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EdocsForbidden'

  /edocs/workspaces:
    get:
      operationId: listEdocsWorkspaces
      tags: [Documents]
      summary: Workspaces in the document library
      responses:
        '200':
          description: The workspaces.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      actingAs:
                        type: string
                        enum: [user, service]
                        description: Whether eDOCS saw the signed-in person or the service account.
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EdocsWorkspace' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/EdocsUnauthorized'
        '403':
          $ref: '#/components/responses/EdocsForbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/workspaces/ensure:
    post:
      operationId: ensureEdocsWorkspace
      tags: [Documents]
      summary: Create a workspace for a project, or return the existing one
      description: Idempotent — an existing workspace for the project is returned
        rather than duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectNumber, projectName]
              properties:
                projectNumber: { type: string }
                projectName: { type: string }
      responses:
        '200':
          description: The workspace.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      actingAs:
                        type: string
                        enum: [user, service]
                        description: Whether eDOCS saw the signed-in person or the service account.
                      data:
                        type: object
                        required: [workspaceId, workspaceName, created]
                        properties:
                          workspaceId: { type: string }
                          workspaceName: { type: string }
                          created:
                            type: boolean
                            description: |
                              False when the workspace already existed — this
                              operation is idempotent.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`projectNumber` or `projectName` missing (`MISSING_FIELDS`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/EdocsUnauthorized'
        '403':
          $ref: '#/components/responses/EdocsForbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/documents:
    post:
      operationId: createEdocsDocument
      tags: [Documents]
      summary: Store a document in the library
      description: |
        The content is sent base64-encoded in the JSON body, not as multipart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, contentBase64, metadata]
              properties:
                filename: { type: string }
                contentBase64: { type: string, format: byte }
                metadata:
                  type: object
                  required: [docName, department]
                  properties:
                    docName: { type: string }
                    department: { type: string }
                  additionalProperties: true
      responses:
        '200':
          description: |
            The stored document. Note 200, not 201 — this proxies the library's
            own answer.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      actingAs:
                        type: string
                        enum: [user, service]
                        description: Whether eDOCS saw the signed-in person or the service account.
                      data:
                        type: object
                        required: [documentId, documentNumber]
                        properties:
                          documentId: { type: string }
                          documentNumber:
                            type: string
                            description: The library's own reference for the document.
                          workspaceId:
                            type: [string, 'null']
                            description: Null when the document is not filed in a workspace.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            `filename`, `contentBase64`, `metadata.docName` or
            `metadata.department` missing (`MISSING_FIELDS`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/EdocsUnauthorized'
        '403':
          $ref: '#/components/responses/EdocsForbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/workspaces/{workspaceId}/documents:
    get:
      operationId: listEdocsWorkspaceDocuments
      tags: [Documents]
      summary: Documents in a workspace
      description: |
        `data` is an OBJECT carrying the workspace id alongside the list, not a
        bare array.
      parameters:
        - $ref: '#/components/parameters/EdocsWorkspaceId'
      responses:
        '200':
          description: The workspace's documents.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      actingAs:
                        type: string
                        enum: [user, service]
                        description: Whether eDOCS saw the signed-in person or the service account.
                      data:
                        type: object
                        required: [workspaceId, documents]
                        properties:
                          workspaceId: { type: string }
                          documents:
                            type: array
                            items: { $ref: '#/components/schemas/EdocsDocument' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/EdocsUnauthorized'
        '403':
          $ref: '#/components/responses/EdocsForbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/documents/{documentId}/profile:
    get:
      operationId: getEdocsDocumentProfile
      tags: [Documents]
      summary: A document's metadata profile
      description: |
        The library's own field names, in its own casing (`DOCNAME`,
        `DOCNUMBER`, `APP_ID`). Passed through unaltered rather than mapped, so
        the set of fields depends on the library's configuration.
      parameters:
        - $ref: '#/components/parameters/EdocsDocumentId'
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      actingAs:
                        type: string
                        enum: [user, service]
                        description: Whether eDOCS saw the signed-in person or the service account.
                      data:
                        type: object
                        description: The library's profile fields, verbatim.
                        additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/EdocsUnauthorized'
        '403':
          $ref: '#/components/responses/EdocsForbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/documents/{documentId}/versions:
    get:
      operationId: listEdocsDocumentVersions
      tags: [Documents]
      summary: A document's versions
      description: '`data` wraps the list with the document id, as the workspace read does.'
      parameters:
        - $ref: '#/components/parameters/EdocsDocumentId'
      responses:
        '200':
          description: The versions.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      actingAs:
                        type: string
                        enum: [user, service]
                        description: Whether eDOCS saw the signed-in person or the service account.
                      data:
                        type: object
                        required: [documentId, versions]
                        properties:
                          documentId: { type: string }
                          versions:
                            type: array
                            items:
                              type: object
                              required: [id, version]
                              properties:
                                id: { type: string }
                                version: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/EdocsUnauthorized'
        '403':
          $ref: '#/components/responses/EdocsForbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/documents/{documentId}/versions/{version}:
    get:
      operationId: getEdocsDocumentVersion
      tags: [Documents]
      summary: The content of one document version
      description: |
        The bytes come back base64-encoded inside the JSON envelope, not as a
        binary body — a caller decodes `data.contentBase64` itself.
      parameters:
        - $ref: '#/components/parameters/EdocsDocumentId'
        - name: version
          in: path
          required: true
          description: The version identifier, as the versions list reports it.
          schema: { type: string }
      responses:
        '200':
          description: The content.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      actingAs:
                        type: string
                        enum: [user, service]
                        description: Whether eDOCS saw the signed-in person or the service account.
                      data:
                        type: object
                        required: [contentBase64]
                        properties:
                          contentBase64: { type: string, format: byte }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/EdocsUnauthorized'
        '403':
          $ref: '#/components/responses/EdocsForbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/documents/{documentId}:
    delete:
      operationId: deleteEdocsDocument
      tags: [Documents]
      summary: Remove a document from the library
      parameters:
        - $ref: '#/components/parameters/EdocsDocumentId'
      responses:
        '200':
          description: The document was removed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      actingAs:
                        type: string
                        enum: [user, service]
                        description: Whether eDOCS saw the signed-in person or the service account.
                      data:
                        type: object
                        required: [documentId, deleted]
                        properties:
                          documentId: { type: string }
                          deleted: { type: boolean }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/EdocsUnauthorized'
        '403':
          $ref: '#/components/responses/EdocsForbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /edocs/workspaces/{workspaceId}:
    delete:
      operationId: deleteEdocsWorkspace
      tags: [Documents]
      summary: Remove a workspace from the library
      parameters:
        - $ref: '#/components/parameters/EdocsWorkspaceId'
      responses:
        '200':
          description: The workspace was removed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      actingAs:
                        type: string
                        enum: [user, service]
                        description: Whether eDOCS saw the signed-in person or the service account.
                      data:
                        type: object
                        required: [workspaceId, deleted]
                        properties:
                          workspaceId: { type: string }
                          deleted: { type: boolean }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/EdocsUnauthorized'
        '403':
          $ref: '#/components/responses/EdocsForbidden'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /doccle/status:
    get:
      operationId: getDoccleStatus
      tags: [Delivery]
      summary: Whether the delivery channel is reachable
      responses:
        '200':
          description: The channel's state.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status, stubMode, reachable]
                        properties:
                          status: { type: string }
                          stubMode: { type: boolean }
                          reachable: { type: boolean }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /doccle/senders/{senderName}/receivers/{externalReference}:
    put:
      operationId: upsertDoccleReceiver
      tags: [Delivery]
      summary: Register or update a receiver
      description: |
        `externalReference` is the sender's own identifier for the recipient.
        Note the spelling differs from the delivery operations below, which use
        `externalReferenceId` for the same thing.
      parameters:
        - $ref: '#/components/parameters/DoccleSenderName'
        - name: externalReference
          in: path
          required: true
          description: The sender's identifier for this receiver.
          schema: { type: string }
      requestBody:
        required: true
        description: |
          The body IS the receiver — it is not wrapped in a `receiver` key.
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
              additionalProperties: true
      responses:
        '200':
          description: The receiver was registered or updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [created]
                        properties:
                          created:
                            type: boolean
                            description: False when the receiver already existed.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`receiver.id` missing (`MISSING_FIELDS`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /doccle/senders/{senderName}/receivers/{externalReferenceId}/documents/{documentId}:
    post:
      operationId: deliverDoccleDocument
      tags: [Delivery]
      summary: Deliver a document to a receiver
      parameters:
        - $ref: '#/components/parameters/DoccleSenderName'
        - $ref: '#/components/parameters/DoccleExternalReferenceId'
        - $ref: '#/components/parameters/DoccleDocumentId'
      requestBody:
        required: true
        description: |
          The body IS the document — it is not wrapped in a `document` key.
        content:
          application/json:
            schema:
              type: object
              required: [documentFile]
              properties:
                documentFile:
                  type: object
                  required: [contentBase64, mimeType]
                  properties:
                    contentBase64: { type: string, format: byte }
                    mimeType: { type: string }
              additionalProperties: true
      responses:
        '200':
          description: The document was delivered.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TimestampedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [documentUri, remPickupUrl]
                        properties:
                          documentUri: { type: string }
                          remPickupUrl:
                            type: string
                            format: uri
                            description: Where the receiver collects the document.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            `document.documentFile.contentBase64` or `.mimeType` missing
            (`MISSING_FIELDS`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  /doccle/senders/{senderName}/receivers/{externalReferenceId}/documents/{documentId}/paid:
    post:
      operationId: markDoccleDocumentPaid
      tags: [Delivery]
      summary: Mark a delivered document as paid
      parameters:
        - $ref: '#/components/parameters/DoccleSenderName'
        - $ref: '#/components/parameters/DoccleExternalReferenceId'
        - $ref: '#/components/parameters/DoccleDocumentId'
      responses:
        '200':
          description: |
            The document was marked paid. **This response carries no `data`** —
            just `success` and `timestamp`.
          content:
            application/json:
              schema:
                type: object
                required: [success, timestamp]
                properties:
                  success: { type: boolean, const: true }
                  timestamp: { type: string, format: date-time }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailed'

  # ── /v1/validsign ─────────────────────────────────────────────────────────
  #
  # TWO routers answer on this mount, with opposite security, and
  # routes/registry.ts mounts the callback one FIRST because ValidSign sends no
  # token and the authenticated router would reject its callback.
  #
  #   callbackRouter   POST /callback, GET /ceremony/complete,
  #                    GET+POST /stub/ceremony/*        — no bearer token
  #   router           GET /task/{taskId}/spec, /status,
  #                    POST /task/{taskId}/package      — bearer + organisation
  #
  # Unlike eDOCS and Doccle these use the PLAIN { success, data } envelope, with
  # no `timestamp`. Three ceremony routes answer text/html rather than JSON.
  #
  # The three authenticated operations gained an organisation check in #227.
  # They had none, and /package could send a real signature request on another
  # organisation's case.

  /validsign/callback:
    post:
      operationId: receiveValidsignCallback
      tags: [Signing]
      summary: ValidSign delivers a signing event
      description: |
        A webhook, not an operation a consumer calls. **Deliberately
        unauthenticated**: ValidSign sends no bearer token. It is rate limited,
        and the JSON body parser is bypassed for this path so an oversized or
        malformed body cannot silently drop a signature.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: ValidSign's event payload.
              additionalProperties: true
      responses:
        '200':
          description: The event was accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: The body could not be read (`INVALID_BODY`).
          $ref: '#/components/responses/Error'
        '401':
          description: |
            The callback's own shared-secret check failed (`UNAUTHORIZED`) —
            not a bearer token.
          $ref: '#/components/responses/Error'

  /validsign/ceremony/complete:
    get:
      operationId: getValidsignCeremonyComplete
      tags: [Signing]
      summary: The page a signer lands on after signing
      description: |
        Returns an HTML page, not JSON. Unauthenticated, because the signer
        arrives from ValidSign's own ceremony with no token.
      security: []
      responses:
        '200':
          description: The confirmation page.
          content:
            text/html:
              schema: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /validsign/stub/ceremony/{packageId}:
    get:
      operationId: getValidsignStubCeremony
      tags: [Signing]
      summary: A stand-in signing ceremony, for stub mode
      description: |
        Only meaningful when `VALIDSIGN_STUB_MODE` is on, which it is on
        acceptance. Returns an HTML page standing in for ValidSign's own
        ceremony. **Not part of the production contract** — a live tier sends
        signers to ValidSign.

        Note the content type varies by outcome: the page is `text/html`, but
        an unknown package answers JSON.
      security: []
      parameters:
        - $ref: '#/components/parameters/ValidsignPackageId'
      responses:
        '200':
          description: The stand-in ceremony page.
          content:
            text/html:
              schema: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No such package (`NOT_FOUND`). Answered as JSON.
          $ref: '#/components/responses/Error'

  /validsign/stub/ceremony/{packageId}/sign:
    post:
      operationId: signValidsignStubCeremony
      tags: [Signing]
      summary: Complete or decline a stand-in ceremony
      description: |
        The stub counterpart to signing in ValidSign. **Not part of the
        production contract.** Answers HTML on both the success and failure
        paths, and JSON for an unknown package.
      security: []
      parameters:
        - $ref: '#/components/parameters/ValidsignPackageId'
      responses:
        '200':
          description: The ceremony was completed or declined.
          content:
            text/html:
              schema: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No such package (`NOT_FOUND`). Answered as JSON.
          $ref: '#/components/responses/Error'
        '500':
          description: The stand-in ceremony failed. Answered as HTML.
          content:
            text/html:
              schema: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /validsign/task/{taskId}/spec:
    get:
      operationId: getValidsignTaskSpec
      tags: [Signing]
      summary: Whether a task needs a signature, and its state
      description: |
        **The response shape is fixed by contract with the frontend** — the
        handler carries a comment saying not to rename or add fields:

        ```
        { required: false }
        { required: true, templateId, status, packageId?, signingUrl? }
        ```

        Organisation-checked since #227.
      parameters:
        - $ref: '#/components/parameters/ValidsignTaskId'
      responses:
        '200':
          description: Whether a signature is required, and where it stands.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ValidsignSpec' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: '`SIGNATURE_SPEC_FAILED`.'
          $ref: '#/components/responses/Error'

  /validsign/task/{taskId}/status:
    get:
      operationId: getValidsignTaskStatus
      tags: [Signing]
      summary: The signing status of a task
      description: Organisation-checked since #227.
      parameters:
        - $ref: '#/components/parameters/ValidsignTaskId'
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { $ref: '#/components/schemas/ValidsignStatus' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: '`SIGNATURE_STATUS_NOT_FOUND`.'
          $ref: '#/components/responses/Error'
        '500':
          description: '`SIGNATURE_STATUS_FAILED`.'
          $ref: '#/components/responses/Error'

  /validsign/task/{taskId}/package:
    post:
      operationId: createValidsignPackage
      tags: [Signing]
      summary: Create a signature request for a task
      description: |
        **This sends a real signature request** on a live tier, which is why
        #227 gave it an organisation check: before that it could send one on
        another organisation's case.

        It is the operation with the most distinct refusals in this API, and
        each means something different — see the responses.

        Organisation-checked since #227.
      parameters:
        - $ref: '#/components/parameters/ValidsignTaskId'
      responses:
        '200':
          description: The signature request was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            The delivery details are not usable (`INVALID_DELIVERY`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '404':
          description: |
            The task carries no signature template, so there is nothing to sign
            (`NOT_SIGNATURE_TASK`).
          $ref: '#/components/responses/Error'
        '409':
          description: |
            A signature request already exists for this task
            (`VALIDSIGN_PACKAGE_EXISTS`). Creating a second would send the
            signer a duplicate. The existing request's id is in the `data`
            extension member, as `{ packageId }`.
          $ref: '#/components/responses/Error'
        '422':
          description: |
            The signer has no e-mail address, so the request cannot be
            delivered (`MISSING_SIGNER_EMAIL`). The only 422 in this API.
          $ref: '#/components/responses/Error'
        '500':
          description: '`SIGNATURE_PACKAGE_FAILED`.'
          $ref: '#/components/responses/Error'

  # ── /v1/pa ────────────────────────────────────────────────────────────────
  #
  # Policy analysis: two routers on one mount, pa.routes.ts and
  # pa-dossiers.routes.ts. Thirty-three operations, a quarter of this API.
  #
  # SECURITY. Both routers apply jwtMiddleware, tenantMiddleware and
  # requireRoles('public-affairs'), so every operation below needs that realm
  # role on top of a valid token. That is a different posture from the
  # execution core, which is organisation-scoped but not role-gated.
  #
  # THREE OPERATIONS ARE DECLARED BEFORE THAT MIDDLEWARE and do not get all of
  # it -- pa.routes.ts lines 33, 43 and 88 against `router.use` at 126-128:
  #
  #   POST /pa/curator/run      jwt + role inline, NO tenantMiddleware
  #   GET  /pa/curator/status   jwt + role inline, NO tenantMiddleware
  #   GET  /pa/signals.rss      NO middleware at all -- a query-parameter token
  #
  # WHAT IS AND IS NOT ORGANISATION-SCOPED. Dossiers, searches and feed tokens
  # are: their queries filter on tenant_id. SIGNALS ARE NOT -- pa_signals has
  # no tenant_id column at all, which the code states at
  # pa-dossiers.routes.ts:593. So a signal is shared across organisations by
  # design, and /pa/signals.rss returning every confirmed signal to any valid
  # token holder follows from that rather than being a leak.
  #
  # ENVELOPES. This mount uses three of its own on top of the four elsewhere:
  # { success, data }, { success, data, meta } with a DIFFERENT meta per
  # operation, and a bare { success } with no data at all on several writes.

  /pa/curator/run:
    post:
      operationId: runPaCurator
      tags: [Policy analysis]
      summary: Trigger a curation cycle
      description: |
        Starts curation in the background and returns immediately — the work is
        not awaited, and a failure after this response is logged rather than
        reported.

        **It runs for `flevoland` regardless of the caller.** The organisation
        is hardcoded in the handler, and the response says `flevoland` whoever
        asked. This operation also skips `tenantMiddleware`.

        Not exercised when this was written: it fetches from external sources
        and writes signals. The shape below is read from the handler.
      responses:
        '200':
          description: Curation was started.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [started, tenantId]
                    properties:
                      started: { type: boolean, const: true }
                      tenantId:
                        type: string
                        const: flevoland
                        description: Always `flevoland`, whoever called.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /pa/curator/status:
    get:
      operationId: getPaCuratorStatus
      tags: [Policy analysis]
      summary: How many signals and searches exist
      description: Skips `tenantMiddleware`; counts are across the whole table.
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [signals, searches]
                    properties:
                      signals:
                        type: object
                        description: Totals as strings, straight from the count query.
                        additionalProperties: true
                      searches:
                        type: object
                        additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`STATUS_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals.rss:
    get:
      operationId: getPaSignalsRss
      tags: [Policy analysis]
      summary: Confirmed signals as an RSS feed
      description: |
        **Authenticated by a `token` QUERY PARAMETER, not a bearer token** —
        this is the one operation in the API that works that way. It carries no
        `jwtMiddleware`, and RSS readers cannot send headers, which is why.

        The token comes from `GET /pa/feed-token`, which hands back a URL with
        it already embedded. It does not expire and is not rotated.

        **Its refusals are plain text, not JSON** — `Missing token`,
        `Invalid token`, `Internal error` — so a consumer cannot parse them as
        the error envelope.

        Any valid token reads every confirmed signal. That follows from signals
        not being organisation-scoped, rather than from a missing check.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: |
            A feed token from `GET /pa/feed-token`. A long-lived secret in a
            URL: it will appear in logs, browser history and referrers.
          schema: { type: string }
        - name: tab
          in: query
          description: Restrict to one tab, for example `politiek`.
          schema: { type: string }
        - name: dossierId
          in: query
          description: Restrict to signals linked to one dossier.
          schema: { type: string }
      responses:
        '200':
          description: 'Up to 100 confirmed signals, newest and most relevant first.'
          content:
            application/rss+xml:
              schema: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            The `token` query parameter was missing (`MISSING_TOKEN`) or is
            unknown (`INVALID_TOKEN`). Problem details since #216; before it,
            a bare string served as `text/html`.
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: The feed could not be built (`INTERNAL_ERROR`).
          $ref: '#/components/responses/Error'

  /pa/feed-token:
    get:
      operationId: getPaFeedToken
      tags: [Policy analysis]
      summary: The caller's RSS feed token and URL
      description: |
        Returns the caller's token, minting one on first use and returning the
        same one thereafter — **one per user and organisation, never rotated
        and with no expiry**. Anyone holding the URL can read the feed until
        the row is deleted.
      responses:
        '200':
          description: The token and a ready-made feed URL.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [token, url]
                    properties:
                      token: { type: string, description: 48 hex characters. }
                      url:
                        type: string
                        format: uri
                        description: The feed URL with the token already in the query string.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`FEED_TOKEN_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/types:
    get:
      operationId: getPaTypes
      tags: [Policy analysis]
      summary: The document types each source publishes
      description: A static map, used to populate filters. Takes no parameters and
        cannot fail.
      responses:
        '200':
          description: Types per source.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    description: 'Keyed by source (`tk`, `ob`, `media`, `eu`), each a list of type
                      names.'
                    additionalProperties:
                      type: array
                      items: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /pa/sources/status:
    get:
      operationId: getPaSourcesStatus
      tags: [Policy analysis]
      summary: Which upstream sources are configured
      responses:
        '200':
          description: Per-source state.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    description: 'Keyed by source: `tk`, `ob`, `eu`, `epTeksten`, `media`, `feeds`.'
                    additionalProperties: true
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'

  /pa/feed:
    get:
      operationId: getPaFeed
      tags: [Policy analysis]
      summary: Items from the upstream sources, before curation
      description: |
        The raw feed a curator promotes from. Paged in the upstream's own style:
        `data` carries `items` with `total`, `skip` and `top`.
      responses:
        '200':
          description: A page of feed items.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [items, total, skip, top]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/PaFeedItem' }
                      total: { type: integer }
                      skip: { type: integer }
                      top: { type: integer }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '502':
          description: The upstream source failed (`UPSTREAM_ERROR`).
          $ref: '#/components/responses/Error'

  /pa/agenda:
    get:
      operationId: getPaAgenda
      tags: [Policy analysis]
      summary: Upcoming parliamentary agenda items
      responses:
        '200':
          description: The agenda.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaAgendaItem' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '502':
          description: '`AGENDA_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals:
    get:
      operationId: listPaSignals
      tags: [Policy analysis]
      summary: Curated signals
      description: |
        `meta` reports whether the result hit the cap: `{ total, cap, capped }`.
        A different `meta` from `/pa/notifications` on the same mount.
      responses:
        '200':
          description: The signals.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaSignal' }
                  meta:
                    type: object
                    required: [total, cap, capped]
                    properties:
                      total: { type: integer }
                      cap: { type: integer, description: The maximum this operation will return. }
                      capped:
                        { type: boolean, description: True when results were truncated at `cap`. }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`SIGNALS_ERROR`.'
          $ref: '#/components/responses/Error'
    post:
      operationId: promotePaSignal
      tags: [Policy analysis]
      summary: Promote a feed item to a signal
      description: |
        Takes a feed item and creates a signal from it. The signal's id is
        derived from the item's, so promoting the same item twice is not
        idempotent — check before calling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, title, source]
              properties:
                id: { type: string, description: The feed item's id. }
                title: { type: string }
                source: { type: string }
              additionalProperties: true
      responses:
        '201':
          description: The signal that was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaSignal' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`id`, `title` or `source` missing (`MISSING_FIELDS`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`PROMOTE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals/counts:
    get:
      operationId: getPaSignalCounts
      tags: [Policy analysis]
      summary: Signal counts per tab
      responses:
        '200':
          description: Counts keyed by tab.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    description: 'For example `{ media, politiek, regionaal }`.'
                    additionalProperties: { type: integer }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`SIGNAL_COUNTS_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals/{id}/confirm:
    post:
      operationId: confirmPaSignal
      tags: [Policy analysis]
      summary: Confirm a signal
      description: |
        Moves the signal to `confirmed`, which is what puts it in the RSS feed.
        There is no operation that undoes this; `dismiss` is the way back.
      parameters:
        - $ref: '#/components/parameters/PaSignalId'
      responses:
        '200':
          description: The updated signal.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaSignal' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`CONFIRM_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals/{id}/dismiss:
    post:
      operationId: dismissPaSignal
      tags: [Policy analysis]
      summary: Dismiss a signal
      parameters:
        - $ref: '#/components/parameters/PaSignalId'
      responses:
        '200':
          description: The updated signal.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaSignal' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`DISMISS_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/signals/{id}:
    patch:
      operationId: linkPaSignalToDossier
      tags: [Policy analysis]
      summary: Link a signal to a dossier
      description: The only field this accepts is the dossier to link to.
      parameters:
        - $ref: '#/components/parameters/PaSignalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dossierId]
              properties:
                dossierId: { type: string }
      responses:
        '200':
          description: The updated signal.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaSignal' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`dossierId` missing (`MISSING_DOSSIER_ID`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`LINK_DOSSIER_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/searches:
    get:
      operationId: listPaSearches
      tags: [Policy analysis]
      summary: Saved searches
      description: |
        **This operation answers snake_case** — `tenant_id`, `user_id`,
        `dossier_id`, `created_at`, `updated_at` — where `/pa/signals` on the
        same mount answers camelCase. It also returns `tenant_id` and `user_id`
        in the payload.
      responses:
        '200':
          description: The caller's organisation's saved searches.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaSearch' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`SEARCHES_ERROR`.'
          $ref: '#/components/responses/Error'
    post:
      operationId: createPaSearch
      tags: [Policy analysis]
      summary: Save a search
      description: '`query` is an OBJECT, not a string.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: object
                  required: [q]
                  properties:
                    q: { type: string }
                    types: { type: array, items: { type: string } }
                    source: { type: array, items: { type: string } }
                scope:
                  type: string
                  enum: [tenant, user]
                  description: Whether the search is shared with the organisation or private.
                tags: { type: array, items: { type: string } }
                dossierId: { type: string }
      responses:
        '201':
          description: The new search's id.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`query.q` missing (`MISSING_QUERY`).'
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`SEARCH_CREATE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/searches/{id}:
    patch:
      operationId: updatePaSearch
      tags: [Policy analysis]
      summary: Change a saved search
      description: |
        The body is validated BEFORE the search is looked up, so a bad `scope`
        or an empty query answers 400 even for an id that does not exist.
      parameters:
        - $ref: '#/components/parameters/PaSearchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: object
                  properties:
                    q: { type: string }
                scope: { type: string, enum: [tenant, user] }
                tags: { type: array, items: { type: string } }
                notify: { type: boolean }
      responses:
        '200':
          description: |
            Updated. **No `data`** — the response is `{ success: true }` alone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BareSuccess' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            Nothing to change (`MISSING_FIELDS`), an unknown `scope`
            (`BAD_SCOPE`), or a blank query (`EMPTY_QUERY`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deletePaSearch
      tags: [Policy analysis]
      summary: Remove a saved search
      parameters:
        - $ref: '#/components/parameters/PaSearchId'
      responses:
        '200':
          description: 'Removed. **No `data`.**'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BareSuccess' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`SEARCH_DELETE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/notifications:
    get:
      operationId: listPaNotifications
      tags: [Policy analysis]
      summary: The caller's notifications
      description: '`meta` is `{ unseenCount }` — a different `meta` from `/pa/signals`.'
      responses:
        '200':
          description: The notifications.
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { type: object, additionalProperties: true }
                  meta:
                    type: object
                    required: [unseenCount]
                    properties:
                      unseenCount: { type: integer }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`NOTIFICATIONS_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/notifications/ack:
    post:
      operationId: ackPaNotifications
      tags: [Policy analysis]
      summary: Mark the caller's notifications as seen
      responses:
        '200':
          description: 'Acknowledged. **No `data`.**'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BareSuccess' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`NOTIFICATIONS_ACK_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/dossiers:
    get:
      operationId: listPaDossiers
      tags: [Policy analysis]
      summary: Dossiers for the caller's organisation
      description: |
        Organisation-scoped, unlike signals: the query filters on `tenant_id`.

        Returns the READ model — a different shape from what `POST` and `PATCH`
        answer. See `PaDossier` and `PaDossierAuthoring`.
      responses:
        '200':
          description: The dossiers.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaDossier' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`DOSSIERS_ERROR`.'
          $ref: '#/components/responses/Error'
    post:
      operationId: createPaDossier
      tags: [Policy analysis]
      summary: Create a dossier
      description: |
        The id is slugified from `naam`, so two dossiers with the same name
        collide — that is the 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [naam, onderwerp]
              properties:
                naam: { type: string, minLength: 3 }
                onderwerp: { type: string, minLength: 1 }
                status: { type: string, enum: [actief, sluimerend], default: actief }
                momentum: { type: string, default: flat }
                gepubliceerd:
                  type: boolean
                  description: Requires the publish capability; otherwise 403.
                kompas: { type: object, additionalProperties: true }
                md: { type: object, additionalProperties: true }
      responses:
        '201':
          description: 'The new dossier, in the AUTHORING shape.'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaDossierAuthoring' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            `naam` shorter than 3 characters, or `onderwerp` empty
            (`INVALID_FIELDS`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `gepubliceerd` was true and the caller lacks the publish capability
            (`FORBIDDEN_PUBLISH`). A capability refusal, not an organisation
            one — it is not `TENANT_MISMATCH`.
          $ref: '#/components/responses/Error'
        '409':
          description: |
            A dossier with the same slugified name already exists
            (`ID_CONFLICT`).
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /pa/dossiers/{id}:
    get:
      operationId: getPaDossier
      tags: [Policy analysis]
      summary: One dossier
      description: Returns the READ model, as the list does.
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      responses:
        '200':
          description: The dossier.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaDossier' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`DOSSIER_ERROR`.'
          $ref: '#/components/responses/Error'
    patch:
      operationId: updatePaDossier
      tags: [Policy analysis]
      summary: Change a dossier
      description: Answers the AUTHORING shape, as create does.
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                naam: { type: string, minLength: 3 }
                onderwerp: { type: string, minLength: 1 }
                status: { type: string, enum: [actief, sluimerend] }
                momentum: { type: string }
                gepubliceerd: { type: boolean }
                kompas: { type: object, additionalProperties: true }
                md: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The updated dossier.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaDossierAuthoring' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            An unknown `status` (`INVALID_STATUS`), or a name or subject that
            fails the same rules as create (`INVALID_FIELDS`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`FORBIDDEN_PUBLISH`, as on create.'
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '409':
          description: A concurrent change was detected.
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      operationId: deletePaDossier
      tags: [Policy analysis]
      summary: Delete a dossier
      description: |
        Reports how many linked rows it touched — signals are unlinked rather
        than deleted, since a signal is not owned by one dossier.
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      responses:
        '200':
          description: Deleted, with a count of what was unlinked.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [signals, searches]
                    properties:
                      signals: { type: integer }
                      searches: { type: integer }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`DOSSIER_DELETE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/dossiers/{id}/watch:
    post:
      operationId: watchPaDossier
      tags: [Policy analysis]
      summary: Follow a dossier
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      responses:
        '200':
          description: |
            The watch ALREADY EXISTED and was re-enabled in place. The handler
            answers `res.status(existing ? 200 : 201)`, so a repeat follow is a
            200 and only the first is a 201. Only the 201 was documented until
            #269, whose conformance check found the route test asserting a 200.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '201':
          description: The watch that was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`DOSSIER_WATCH_ERROR`.'
          $ref: '#/components/responses/Error'
    delete:
      operationId: unwatchPaDossier
      tags: [Policy analysis]
      summary: Stop following a dossier
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      responses:
        '200':
          description: 'Removed. **No `data`.**'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BareSuccess' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`DOSSIER_WATCH_DELETE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/dossiers/{id}/archive:
    post:
      operationId: archivePaDossier
      tags: [Policy analysis]
      summary: Archive a dossier
      description: |
        Archiving requires retention metadata — the Archives Act classification
        and term, and a reason. All three are mandatory and constrained.
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classificatie, bewaartermijn, reden]
              properties:
                classificatie: { type: string, enum: [openbaar, intern, vertrouwelijk] }
                bewaartermijn:
                  type: string
                  enum: [V5, V10, V20, B]
                  description: 'Retention: five, ten or twenty years, or permanent.'
                reden: { type: string, minLength: 1 }
      responses:
        '200':
          description: 'The archived dossier, status `gearchiveerd`.'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaDossierAuthoring' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: |
            A missing, blank or unrecognised value among the three
            (`INVALID_ARCHIVE_METADATA`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`DOSSIER_ARCHIVE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/dossiers/{id}/unarchive:
    post:
      operationId: unarchivePaDossier
      tags: [Policy analysis]
      summary: Return an archived dossier to active
      parameters:
        - $ref: '#/components/parameters/PaDossierId'
      responses:
        '200':
          description: 'The dossier, status `actief`.'
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaDossierAuthoring' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: The dossier is not archived (`NOT_ARCHIVED`).
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '404':
          $ref: '#/components/responses/PaNotFound'
        '500':
          description: '`DOSSIER_UNARCHIVE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/templates:
    get:
      operationId: listPaTemplates
      tags: [Policy analysis]
      summary: Document templates
      responses:
        '200':
          description: The templates.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaTemplate' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`TEMPLATES_ERROR`.'
          $ref: '#/components/responses/Error'
    post:
      operationId: createPaTemplate
      tags: [Policy analysis]
      summary: Add a template
      description: There is no operation to delete or change a template.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [naam]
              properties:
                naam: { type: string }
                cat: { type: string }
                beschrijving: { type: string }
      responses:
        '201':
          description: The template that was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaTemplate' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`naam` missing (`MISSING_NAAM`).'
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`TEMPLATE_CREATE_ERROR`.'
          $ref: '#/components/responses/Error'

  /pa/snippets:
    get:
      operationId: listPaSnippets
      tags: [Policy analysis]
      summary: Reusable text snippets
      responses:
        '200':
          description: The snippets.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PaSnippet' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`SNIPPETS_ERROR`.'
          $ref: '#/components/responses/Error'
    post:
      operationId: createPaSnippet
      tags: [Policy analysis]
      summary: Add a snippet
      description: There is no operation to delete or change a snippet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [naam, md]
              properties:
                naam: { type: string }
                md: { type: string, description: 'The snippet body, in Markdown.' }
                cat: { type: string }
      responses:
        '201':
          description: The snippet that was created.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/PaSnippet' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          description: '`naam` or `md` missing (`MISSING_FIELDS`).'
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/PaForbidden'
        '500':
          description: '`SNIPPET_CREATE_ERROR`.'
          $ref: '#/components/responses/Error'

  # ── /v1/rip and /v1/hr-capacity ───────────────────────────────────────────
  #
  # Two board views onto Operaton, both jwt + tenantMiddleware. The two
  # `{id}/documents` reads are organisation-checked through tenant-access and
  # answer TENANT_MISMATCH; the list reads are not, because they query by the
  # caller's own organisation to begin with.

  /rip/phases/active:
    get:
      operationId: listRipActivePhases
      tags: [RIP]
      summary: Active instances across every RIP phase
      responses:
        '200':
          description: One entry per running instance.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RipInstance' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`RIP_ACTIVE_AGGREGATE_FAILED`.'
          $ref: '#/components/responses/Error'

  /rip/phases/counts:
    get:
      operationId: getRipPhaseCounts
      tags: [RIP]
      summary: How many instances sit in each phase
      responses:
        '200':
          description: Counts, keyed by phase code.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [counts]
                        properties:
                          counts:
                            type: object
                            description: |
                              Keyed by process definition key. Each value is a
                              PAIR of counts, not a single number: `wip` is the
                              running instances and `gereed` the finished ones.
                              The service's own signature says so --
                              `Record<string, { wip: number; gereed: number }>`
                              -- while this said `integer` until #269, whose
                              conformance check compared the two.
                            additionalProperties:
                              type: object
                              required: [wip, gereed]
                              properties:
                                wip:
                                  type: integer
                                  description: Running instances of this phase.
                                gereed:
                                  type: integer
                                  description: Finished instances of this phase.
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`PHASE_COUNTS_FAILED`.'
          $ref: '#/components/responses/Error'

  /rip/phases/deployment-status:
    get:
      operationId: getRipDeploymentStatus
      tags: [RIP]
      summary: Which phase processes are deployed
      description: |
        Tells a caller which phases can be started at all, as against which are
        merely defined.
      responses:
        '200':
          description: The deployed process definition keys.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [deployedKeys]
                        properties:
                          deployedKeys:
                            type: array
                            items: { type: string }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: '`DEPLOYMENT_STATUS_FAILED`.'
          $ref: '#/components/responses/Error'

  /rip/phases/{code}/active:
    get:
      operationId: listRipPhaseActive
      tags: [RIP]
      summary: Active instances of one phase
      parameters:
        - $ref: '#/components/parameters/RipPhaseCode'
      responses:
        '200':
          description: The running instances.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RipInstance' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UnknownPhase'
        '500':
          description: '`RIP_LIST_FAILED`.'
          $ref: '#/components/responses/Error'

  /rip/phases/{code}/completed:
    get:
      operationId: listRipPhaseCompleted
      tags: [RIP]
      summary: Completed instances of one phase
      parameters:
        - $ref: '#/components/parameters/RipPhaseCode'
      responses:
        '200':
          description: The finished instances, carrying an `endTime`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RipInstance' }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UnknownPhase'
        '500':
          description: '`RIP_COMPLETED_LIST_FAILED`.'
          $ref: '#/components/responses/Error'

  /rip/phases/{code}/model:
    get:
      operationId: getRipPhaseModel
      tags: [RIP]
      summary: The phase's process model, as lanes, nodes and edges
      description: |
        A rendering-ready graph rather than raw BPMN — the board draws from
        this directly.
      parameters:
        - $ref: '#/components/parameters/RipPhaseCode'
      responses:
        '200':
          description: The model.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [phaseCode, lanes, nodes, edges]
                        properties:
                          phaseCode: { type: string }
                          lanes:
                            { type: array, items: { type: object, additionalProperties: true } }
                          nodes:
                            { type: array, items: { type: object, additionalProperties: true } }
                          edges:
                            { type: array, items: { type: object, additionalProperties: true } }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UnknownPhase'
        '500':
          description: '`PHASE_MODEL_FAILED`.'
          $ref: '#/components/responses/Error'

  /rip/instances/{instanceId}/documents:
    get:
      operationId: getRipInstanceDocuments
      tags: [RIP]
      summary: The documents a RIP instance has produced
      description: |
        Organisation-checked: answers `TENANT_MISMATCH` for an instance
        belonging to another organisation.

        `data` carries the instance's variables alongside each known document
        slot, so a slot that has not been produced yet is present and null
        rather than absent.
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The documents and the variables they came from.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PlainEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [variables]
                        properties:
                          variables: { $ref: '#/components/schemas/PlainVariableMap' }
                          intakeReport: { type: [object, 'null'], additionalProperties: true }
                          psuReport: { type: [object, 'null'], additionalProperties: true }
                          pdp: { type: [object, 'null'], additionalProperties: true }
          headers:
            API-Version:
              $ref: '#/components/headers/ApiVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/TenantMismatch'
        '500':
          description: '`RIP_DOCUMENTS_FAILED`.'
          $ref: '#/components/responses/Error'

  /hr-capacity/active:
    get:
