  /decision/{key}/evaluate:
    post:
      operationId: evaluateDecision
      tags: [Decision]
      summary: Evaluate a DMN decision
      description: |
        Evaluates the decision against the supplied variables and returns
        Operaton's result rows unaltered.

        Input uses Operaton's WRAPPED variable form (`{value, type}`), and the
        output keeps it too — unlike the variable reads elsewhere, which unwrap.
        An input set that matches no rule answers `200` with an empty array, not
        a 404.
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
