<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Doorzoek de openbare regels, producten, processen en berichten van Provincie Flevoland — zonder inloggen."
    />
    <title>Open Regels Nederland — publieke kennisbank</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Open Graph / Twitter card. Source of the image: docs/herkomst-handoff/reference/social/social-card.html
      (edit the copy there and re-capture the #card element at 1x to regenerate
      public/og-open-regels.png). Sitewide — one card for the whole site, and
      the same image on every environment; the title prefix tells ACC apart.
      Static on purpose: unfurlers do not run JavaScript. Vite fills the
      VITE_ placeholders per build mode from .env.<mode>; og:url and
      og:image must be absolute (scrapers do not resolve relative paths).
      prerender.ts swaps <title>, the description and the canonical per route,
      and never touches the og: tags.
    -->
    <meta name="robots" content="%VITE_ROBOTS%" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Regels Nederland" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:title" content="%VITE_OG_TITLE_PREFIX%Waar komt deze regel vandaan?" />
    <meta property="og:description" content="Zoek in de regels, producten, processen en begrippen van de overheid — en volg elk begrip terug naar de wettekst." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-open-regels.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Open Regels Nederland — publieke kennisbank van Provincie Flevoland" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
