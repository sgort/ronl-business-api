<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta
      name="description"
      content="Werkende demo van de PA-Cockpit: dossiers, curatie, monitoring en voortgang in één werkomgeving."
    />
    <title>PA-Cockpit demo — Open Regels Nederland</title>

    <!--
      Open Graph / Twitter card. Source of the image:
      docs/pa-demo-social-handoff/reference/social-card-pa-demo.html — edit the
      copy there and re-capture the #card element at exactly 1x (1200x630) to
      regenerate public/og-pa-demo.png. Sitewide: one card for the whole demo,
      not per-mode.

      og:url and og:image are absolute per the OG spec — scrapers do not resolve
      relative paths — and are authored against the production origin because a
      static HTML file cannot know its own deploy target. The transformIndexHtml
      plugin in vite.config.ts rewrites both to the origin being built for, so an
      acceptance build does not advertise a domain that is not live yet. See
      scripts/social-card-origin.ts.

      The image itself is environment-specific too (it carries an
      ACCEPTATIEOMGEVING badge and the acc. hostname), and swapping it for
      production is a manual re-capture — see the handoff's reference/README.md.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Regels Nederland" />
    <meta property="og:locale" content="nl_NL" />
    <meta property="og:title" content="Flevoland Public Affairs" />
    <meta
      property="og:description"
      content="Werkende demo van de PA-Cockpit: dossiers, curatie, monitoring en voortgang in één werkomgeving."
    />
    <meta property="og:url" content="https://plato.open-regels.nl/" />
    <meta property="og:image" content="https://plato.open-regels.nl/og-pa-demo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Flevoland Public Affairs — demo van de PA-Cockpit, met de vijf werkmodi Vandaag, Dossiers, Monitoring, Voortgang en Beheer"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
